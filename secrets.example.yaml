# =====================================================================
# EXAMPLE secrets - copy the keys into your Home Assistant ESPHome
# secrets.yaml and fill in real values. Do NOT commit your real secrets.yaml
# (it is gitignored).
#
# Generate a fresh API encryption key at: https://esphome.io/components/api
# (or `openssl rand -base64 32`).
# =====================================================================
wifi_ssid: "YourWiFiName"
wifi_password: "YourWiFiPassword"
ap_password: "fallback-hotspot-password"       # >= 8 chars; used by the setup AP
soundmachine__ota_password: "your-ota-password"
soundmachine__api_encryption: "REPLACE_WITH_A_FRESH_32_BYTE_BASE64_KEY="
