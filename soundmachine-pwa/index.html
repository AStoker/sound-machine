<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sound Machine</title>

  <!-- PWA / installable -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1436" />
  <link rel="icon" href="icons/icon-192.png" />

  <!-- iOS "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sound Machine" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />

  <style>
    :root {
      --bg:#161029; --card:#241a45; --card2:#2e2154; --line:#3a2c66;
      --text:#f3ecff; --muted:#a99fce; --accent:#ffb54a; --accent2:#ff7a3c;
      --on:#4ad07a; --off:#5a4e86;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; background:var(--bg); color:var(--text);
      font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    body { padding:max(14px,env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; gap:10px; margin:4px 2px 16px; }
    header img { width:34px; height:34px; border-radius:9px; }
    header h1 { font-size:20px; margin:0; flex:1; font-weight:700; letter-spacing:.2px; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--off); transition:background .3s; }
    .dot.live { background:var(--on); box-shadow:0 0 8px var(--on); }
    .gear { background:none; border:none; color:var(--muted); font-size:20px; padding:6px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px;
      padding:14px; margin-bottom:14px; }
    .card h2 { font-size:13px; letter-spacing:.08em; text-transform:uppercase;
      color:var(--muted); margin:0 0 12px; font-weight:600; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .grid.three { grid-template-columns:repeat(3,1fr); }
    button.opt { appearance:none; border:1px solid var(--line); background:var(--card2);
      color:var(--text); border-radius:12px; padding:16px 10px; font-size:16px; font-weight:600;
      transition:transform .06s, background .2s, border-color .2s; }
    button.opt:active { transform:scale(.96); }
    button.opt.active { background:linear-gradient(135deg,var(--accent2),var(--accent));
      border-color:var(--accent); color:#241405; }
    button.opt.off.active { background:var(--off); border-color:var(--off); color:var(--text); }
    .row { display:flex; align-items:center; gap:12px; }
    input[type=range] { flex:1; accent-color:var(--accent); height:32px; }
    .toggle { width:100%; padding:16px; border-radius:12px; border:1px solid var(--line);
      background:var(--card2); color:var(--text); font-size:16px; font-weight:600; display:flex;
      justify-content:space-between; align-items:center; }
    .pill { padding:5px 12px; border-radius:999px; font-size:13px; background:var(--off); }
    .pill.on { background:var(--on); color:#04270f; }
    .hint { color:var(--muted); font-size:12px; text-align:center; margin-top:8px; }
    dialog { background:var(--card); color:var(--text); border:1px solid var(--line);
      border-radius:16px; padding:18px; width:min(90vw,360px); }
    dialog input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
      background:var(--bg); color:var(--text); font-size:16px; margin:10px 0 14px; }
    dialog button { padding:12px 16px; border-radius:10px; border:none; font-size:15px; font-weight:600; }
    .primary { background:var(--accent); color:#241405; }
    .ghost { background:transparent; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-192.png" alt="" />
    <h1>Sound Machine</h1>
    <span class="dot" id="dot" title="live state"></span>
    <button class="gear" id="settingsBtn" aria-label="Settings">&#9881;</button>
  </header>

  <section class="card">
    <h2>Light</h2>
    <div class="grid" data-group="select-crescent_preset">
      <button class="opt off" data-opt="Off">Off</button>
      <button class="opt" data-opt="(Dynamic) Sunrise">Sunrise</button>
      <button class="opt" data-opt="Nightlight">Nightlight</button>
      <button class="opt" data-opt="Morning Light">Morning</button>
    </div>
    <div class="row" style="margin-top:12px">
      <span style="color:var(--muted);font-size:13px">Dim</span>
      <input type="range" id="brightness" min="1" max="255" value="180" />
      <span style="color:var(--muted);font-size:13px">Bright</span>
    </div>
  </section>

  <section class="card">
    <h2>Sound</h2>
    <div class="grid" data-group="select-sound">
      <button class="opt off" data-opt="Off">Off</button>
      <button class="opt" data-opt="White">White</button>
      <button class="opt" data-opt="Pink">Pink</button>
      <button class="opt" data-opt="Brown">Brown</button>
    </div>
  </section>

  <section class="card">
    <h2>Media</h2>
    <div class="grid" data-group="select-media_preset">
      <button class="opt off" data-opt="Off">Off</button>
      <button class="opt" data-opt="La La">La La</button>
    </div>
  </section>

  <section class="card">
    <h2>Alarm</h2>
    <button class="toggle" id="alarmToggle">
      <span>Wake-up alarm</span>
      <span class="pill" id="alarmPill">Off</span>
    </button>
  </section>

  <p class="hint" id="hint">Tap the gear to set your device address.</p>

  <dialog id="settings">
    <h2 style="margin-top:0">Device address</h2>
    <p style="color:var(--muted);font-size:13px;margin:0">Hostname or IP of the Sound Machine on your WiFi.</p>
    <input id="hostInput" placeholder="soundmachine.local" />
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="ghost" id="cancelBtn">Cancel</button>
      <button class="primary" id="saveBtn">Save</button>
    </div>
  </dialog>

  <script>
    const LS = 'sm_host';
    let host = localStorage.getItem(LS) || 'soundmachine.local';
    const base = () => `http://${host}`;
    const dot = document.getElementById('dot');
    const hint = document.getElementById('hint');

    // Fire a command. no-cors keeps it working even if the device sends no CORS
    // headers — we don't need to read the response for actions.
    function cmd(path) {
      fetch(base() + path, { method: 'POST', mode: 'no-cors' })
        .catch(() => flash('Could not reach ' + host));
    }
    function flash(msg) { hint.textContent = msg; setTimeout(() => hint.textContent = '', 4000); }

    // ---- Selects (Light / Sound / Media) ----
    document.querySelectorAll('[data-group^="select-"]').forEach((group) => {
      const id = group.dataset.group.replace('select-', '');
      group.querySelectorAll('button.opt').forEach((btn) => {
        btn.addEventListener('click', () => {
          setActive(group, btn.dataset.opt);
          cmd(`/select/${id}/set?option=${encodeURIComponent(btn.dataset.opt)}`);
        });
      });
    });
    function setActive(group, opt) {
      group.querySelectorAll('button.opt').forEach((b) =>
        b.classList.toggle('active', b.dataset.opt === opt));
    }

    // ---- Brightness (Crescent Light entity) ----
    let bTimer;
    document.getElementById('brightness').addEventListener('input', (e) => {
      clearTimeout(bTimer);
      bTimer = setTimeout(() => cmd(`/light/crescent_light/turn_on?brightness=${e.target.value}`), 120);
    });

    // ---- Alarm switch ----
    let alarmOn = false;
    const pill = document.getElementById('alarmPill');
    document.getElementById('alarmToggle').addEventListener('click', () => {
      alarmOn = !alarmOn; renderAlarm();
      cmd(`/switch/alarm_enabled/${alarmOn ? 'turn_on' : 'turn_off'}`);
    });
    function renderAlarm() {
      pill.textContent = alarmOn ? 'On' : 'Off';
      pill.classList.toggle('on', alarmOn);
    }

    // ---- Live state (best-effort; needs CORS. If blocked, buttons still work) ----
    let es;
    function connect() {
      try { es && es.close(); } catch (_) {}
      try {
        es = new EventSource(base() + '/events');
        es.addEventListener('state', (ev) => {
          dot.classList.add('live');
          let d; try { d = JSON.parse(ev.data); } catch (_) { return; }
          const id = d.id || '';
          if (id.startsWith('select-')) {
            const g = document.querySelector(`[data-group="${id}"]`);
            if (g && d.value != null) setActive(g, String(d.value));
          } else if (id === 'switch-alarm_enabled') {
            alarmOn = (d.value === true || d.state === 'ON'); renderAlarm();
          } else if (id === 'light-crescent_light' && d.brightness != null) {
            document.getElementById('brightness').value = d.brightness;
          }
        });
        es.onerror = () => dot.classList.remove('live');
      } catch (_) { /* SSE unavailable; commands still fire */ }
    }
    connect();

    // ---- Settings dialog ----
    const dlg = document.getElementById('settings');
    const hostInput = document.getElementById('hostInput');
    document.getElementById('settingsBtn').onclick = () => { hostInput.value = host; dlg.showModal(); };
    document.getElementById('cancelBtn').onclick = () => dlg.close();
    document.getElementById('saveBtn').onclick = () => {
      const v = hostInput.value.trim().replace(/^https?:\/\//, '').replace(/\/$/, '');
      if (v) { host = v; localStorage.setItem(LS, host); flash('Saved: ' + host); connect(); }
      dlg.close();
    };

    // ---- Register the service worker (offline app shell) ----
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
