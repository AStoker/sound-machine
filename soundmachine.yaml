# =====================================================================
# SMART SOUND MACHINE - FULL CONFIG (Rev: Flex + HT16K33 clock)
#
# Hardware map:
#   ReSpeaker Flex XVF3800 (linear 4-mic) w/ XIAO ESP32-S3 Plus seated
#   AIC3104 codec (on Flex)  -> line out -> TPA2016 amp -> 2x speakers
#   HT16K33 7-seg clock display (Adafruit #1002)        [I2C 0x70]
#   BH1750 light, SHT40 temp/hum, VL53L0X ToF, DS3231 RTC, seesaw knob
#   SK6812 GRBW crescent strip (data on GPIO1 / D0), 48 px half-circle
#   Waveshare UPS Module 3S (3x 18650 series) - I2C power monitoring
#   OPTIONAL: IS31FL3731 charlieplex 9x16 matrix        [I2C 0x74]
#
# LAYOUT: this file holds the device core (substitutions, connectivity, I2C,
# boot). Each feature lives in its own package under packages/ (see the
# `packages:` block below). Cross-package wiring is by ESPHome id, and every
# tunable lives in the substitutions block here - that's the one place to edit.
#
# PIN MAP (Flex claims I2S; everything else is I2C = zero extra pins):
#   GPIO7  (D8)  = I2S WS/LRCLK   (fixed by Flex)
#   GPIO8  (D9)  = I2S BCLK       (fixed by Flex)
#   GPIO43 (D6)  = I2S mic DIN    (fixed by Flex)
#   GPIO44 (D7)  = I2S spk DOUT   (fixed by Flex)
#   GPIO5  (D4)  = I2C SDA        (shared: everything below)
#   GPIO6  (D5)  = I2C SCL
#   GPIO1  (D0)  = SK6812 crescent data  << NEW - verify D0 is free/labelled
#                                           on the Flex breakout pads
#   No SPI needed anymore - MAX7219 replaced by I2C HT16K33.
#   No bonus pads required for any of this.
#
# I2C ADDRESS MAP (no conflicts):
#   0x18 AIC3104 codec     0x23 BH1750         0x29 VL53L0X
#   0x2C XVF3800           0x36 seesaw encoder  0x44 SHT40
#   0x58 TPA2016 amp       0x68 DS3231          0x70 HT16K33 clock
#   0x4?? UPS monitor  << PLACEHOLDER, see ups_i2c_address in substitutions
#   0x74 IS31FL3731 (opt)
#
# TPA2016 AMP NOTES - ITS I2C IS NOW REQUIRED, NOT OPTIONAL:
#   - STEREO amp: one 4-ohm speaker per channel. Outputs are BRIDGE-TIED:
#     every terminal swings, there is no output ground. Do NOT common the
#     two speakers' negative leads and do NOT tie an output to GND - either
#     shorts half a bridge and kills the amp.
#   - Left standalone the amp boots with its AGC ENABLED. That fights the
#     software volume (turn it down, the AGC ramps it back up), breathes
#     audibly on steady noise, and - the real problem - makes the echo path
#     time-varying, which is precisely what the XVF3800's AEC cannot cancel.
#     Wake-word-over-noise would suffer.
#   - So the amp is configured once at boot by the custom `tpa2016:` block
#     in packages/audio.yaml: compression 1:1 (AGC off), one fixed analog gain,
#     limiter parked high as a pure fault stop. All volume stays in software.
#   - The chip has no NVM. A glitch on the 5V rail returns it to factory
#     defaults (AGC back on); id(amp).apply() rewrites it.
# =====================================================================

substitutions:
  # ============ SINGLE PLACE FOR FLAGS & VALUES ============
  # Hardware
  ht16k33_address: "0x70"            # 7-seg clock display (I2C)
  touch_pin: GPIO4                   # capacitive preset pad (D3; D2 = GPIO3)
  touch_threshold: "700000"          # ESP32-S3 raw touch threshold - CALIBRATE

  # Preset system
  light_preset_count: "3"            # number of ON light presets (1..N); Off is separate
  preset_code_seconds: "2s"          # how long the display shows e.g. "L1"

  # Sunrise (timed light preset) defaults
  sunrise_default_minutes: "30"      # dawn ramp length
  sunrise_default_hold: "10"         # bright hold before auto-off

  # Alarm (starts the Sunrise timed preset)
  alarm_default_time: "06:30:00"

  # Logging - the ToF sensor logs every reading. WARN hides that per-reading
  # spam; set to DEBUG to see every distance while fine-tuning (CONFIG keeps
  # just the boot dump).
  tof_log_level: "WARN"

  # LEDs: gamma 1.0 = linear brightness so low values still light. SK6812s
  # otherwise blank out below ~20% at the default 2.8 gamma. Raise toward 2.8
  # for a more perceptual fade (at the cost of the dim end).
  led_gamma: "1.0"

  # Hard current ceiling for the crescent, as a % of full-white output. This
  # caps the max PWM (color_correct) so the strip PHYSICALLY can't exceed it.
  # BUDGET (5V rail = Waveshare UPS 3S, 5A):
  #   48 SK6812 RGBW at full all-channel white ~= 2.9A
  #   TPA2016 into 2x 4ohm at clipping           ~= 1.3A
  #   Flex + XVF3800 + ESP32-S3 + sensors        ~= 0.5A
  # 65% of 2.9A = ~1.9A for the strip, total ~3.7A of 5A. Also keeps the
  # sealed dome from cooking. Raise only after measuring actual draw.
  led_max_pct: "65%"

  # ---- Waveshare UPS Module 3S (3x 18650 series) power monitoring ----
  # !! PLACEHOLDER !! The monitor chip's address is UNCONFIRMED. Run the boot
  # I2C scan (scan: true below) with the UPS connected and look for an address
  # that isn't already in the map above. Waveshare's UPS boards normally carry
  # an INA219 at 0x40-0x43; if the scan turns up 0x40 that's almost certainly
  # it. If the readings come back nonsense, the part may be an INA226 instead -
  # change `platform: ina219` to `platform: ina226` in packages/battery.yaml.
  ups_i2c_address: "0x41"
  # Series shunt on the UPS board. ALSO UNCONFIRMED - 0.01 ohm is the usual
  # value for a 5A-class board. If reported current is 10x off, this is why.
  ups_shunt_ohms: "0.01 ohm"

  # 3S pack thresholds, PACK volts (per-cell x3).
  battery_full_v: "12.6"      # 4.20 V/cell
  battery_low_v: "10.2"       # 3.40 V/cell - start warning
  battery_empty_v: "9.0"      # 3.00 V/cell - protection cutoff is just below
  battery_low_pct: "15"       # SOC at/below this = "low battery"

  # ---- Clock display auto-dim curve (HT16K33, 16 levels) ----
  # Deliberately weighted dark: level sits at the floor for anything up to a
  # dim room, and only climbs into the top half in real daylight.
  display_lux_dark: "3"       # at/below this lux -> display_level_min
  display_lux_bright: "500"   # at/above this lux -> display_level_max
  display_level_min: "0"      # HT16K33 hardware floor (1/16 duty)
  display_level_max: "14"
  # Curve shape. >1 holds the low end down; 1.0 would be a straight log ramp.
  display_dim_gamma: "1.8"

  # Second layer: cap how bright individual presets can command, so nothing
  # even approaches the color_correct ceiling. Fractions (0..1).
  preset_max_brightness: "0.60"     # brightest STATIC preset (Morning Light)
  sunrise_max_brightness: "0.70"    # caps the Circadian Sunrise's peak output

  # ---- On-device media source ----
  # ESPHome resolves a LOCAL `file:` path against the config dir of whatever
  # machine runs the build. When this config is pulled onto Home Assistant as a
  # remote package that dir is HA's, not this repo - so a bare `sounds/...` path
  # would not be found there even though the file lives in the repo. A value
  # starting with http(s):// is instead downloaded at build time, so the URL
  # default just works everywhere. For LOCAL/offline dev with the repo checked
  # out, override this with the repo-relative path: sounds/La-la-sad.mp3
  la_la_sad_source: "https://raw.githubusercontent.com/astoker/sound-machine/main/sounds/La-la-sad.mp3"

  # ---- Credentials (injected, NOT stored here) ----
  # This config is designed to be pulled as a remote ESPHome package, and remote
  # packages may not contain `!secret` lookups. So credentials are substitutions
  # instead: the local device YAML on Home Assistant overrides each of these with
  # `!secret ...` from its own secrets.yaml (a local substitution wins over the
  # package's). The values below are PLACEHOLDERS - a real build must override
  # them. See soundmachine.min.yaml / secrets.example.yaml.
  wifi_ssid: "set-in-local-secrets"
  wifi_password: "set-in-local-secrets"
  ap_password: "set-in-local-secrets"
  ota_password: "set-in-local-secrets"
  # Must be a valid 32-byte base64 key or even a bare `esphome config` fails
  # format validation before the local override lands. This is a throwaway key.
  api_key: "kreOUJQZbPUFn1efUReXwEbfhkZzuGGXk1t2AKESiVs="

# ---------------------------------------------------------------------
# FEATURE PACKAGES - each is a self-contained slice of the device. See the
# header comment in each file for the ids it defines and consumes.
# ---------------------------------------------------------------------
packages:
  audio: !include packages/audio.yaml
  lighting: !include packages/lighting.yaml
  display: !include packages/display.yaml
  battery: !include packages/battery.yaml

esphome:
  name: soundmachine
  friendly_name: Sound Machine
  on_boot:
    - priority: 600
      then:
        # ---- HT16K33 clock display init ----
        - lambda: |-
            // HT16K33 power-on sequence: each command is one I2C byte.
            const uint8_t HT16K33_ADDRESS = ${ht16k33_address};
            auto send_command = [](uint8_t address, uint8_t command) {
              id(internal_i2c).write(address, &command, 1);
            };
            send_command(HT16K33_ADDRESS, 0x21);  // oscillator on
            send_command(HT16K33_ADDRESS, 0x81);  // display on, no blink
            send_command(HT16K33_ADDRESS, 0xE7);  // brightness mid (0xE0 | 0..15)
    # ---- deferred noise resume ----
    # Runs LATE (priority -100) + a short delay so the mixer/speaker stack is
    # fully initialized before we start the noise generator (starting it during
    # setup dereferenced an uninitialized event group -> crash).
    - priority: -100
      then:
        - delay: 2s
        - lambda: 'id(booted) = true;'
        # Re-apply the restored sound now the audio stack is up: drives the
        # Sound select's set_action, which starts the generator + updates HA.
        - select.set:
            id: sound_select
            option: !lambda 'return id(sound_option);'

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB # 8MB for regular, 16 for Plus
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG    # drop to INFO once everything is stable
  logs:
    vl53l0x: ${tof_log_level}   # quiet the per-reading ToF spam (see substitutions)

api:
  encryption:
    key: ${api_key}          # injected from local secrets (see substitutions)

ota:
  - platform: esphome
    password: ${ota_password}    # injected from local secrets (see substitutions)

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "Soundmachine Setup"
    password: ${ap_password}

captive_portal:

# ---------------------------------------------------------------------
# WEB SERVER - standalone control when Home Assistant is down.
# Point a browser at http://soundmachine.local/ (or the device IP) on the
# same WiFi. version 3 = modern UI; local: true embeds it in flash so it works
# with NO internet at all (you have ~1.6 MB flash free, so this is affordable).
# Uncomment auth to require a login.
# ---------------------------------------------------------------------
web_server:
  port: 80
  version: 3
  local: true
  # auth:                          # if you enable this, add a `web_password`
  #   username: admin              # substitution (overridden from local secrets)
  #   password: ${web_password}    # - remote packages can't use !secret directly

# ---------------------------------------------------------------------
# I2C - one bus, everything lives here
# ---------------------------------------------------------------------
i2c:
  id: internal_i2c
  sda: GPIO5
  scl: GPIO6
  scan: true
  frequency: 100kHz   # dropped from 100kHz: slower edges tolerate the extra
                     # cable capacitance / pull-ups from the STEMMA sensor chain,
                     # which was starving the timing-sensitive XVF3800. If it's
                     # still flaky with everything reconnected, try 10kHz.
  timeout: 1ms       # give the XVF3800 room to clock-stretch while its
                     # firmware boots; avoids "I2C transaction timeout" at setup

# ---------------------------------------------------------------------
# External components
# ---------------------------------------------------------------------
external_components:
  # FormatBCE I2S fork + XVF3800/AIC3104 drivers (audio)
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: respeaker_microphone
    components: [ i2s_audio ]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
      ref: main
    components: [ respeaker_xvf3800, aic3104 ]
    refresh: 0s
  # ssieb seesaw (rotary encoder)
  # - source:
  #     type: git
  #     url: https://github.com/ssieb/esphome_components
  #   components: [ seesaw ]
  #   refresh: 1d
  # Custom components pulled from THIS repo by git, so they resolve the same way
  # whether built locally or pulled remotely onto Home Assistant. (A `type: local`
  # source would resolve against the local config dir, which the HA side doesn't
  # have.) For local component development, push first, then build - or
  # temporarily switch this back to `type: local, path: components`.
  - source: github://astoker/sound-machine@main
    components: [ noise_source, seesaw, tpa2016 ]
    refresh: 0s

# ---------------------------------------------------------------------
# TIME - DS3231 is battery-backed source, HA is the fallback that syncs when loaded
# ---------------------------------------------------------------------
time:
  - platform: ds1307
    id: ds3231_time
    address: 0x68
    update_interval: 10s
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - ds1307.write_time:
          id: ds3231_time

# =====================================================================
