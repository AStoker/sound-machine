# =====================================================================
# SMART SOUND MACHINE - device core and package manifest
#
# A bedside sound machine on a ReSpeaker Flex (XVF3800 + XIAO ESP32-S3):
# white/pink/brown noise, a voice assistant, an LED-matrix clock, an SK6812
# sunrise crescent, a rotary knob, and UPS battery monitoring.
#
# THIS FILE HOLDS ONLY THE DEVICE CORE: the platform, connectivity, the single
# I2C bus, the external components, and the `packages:` manifest below. There is
# no feature logic and no tunable value here.
#   * every tunable  -> packages/settings.yaml
#   * every feature   -> packages/{hw,api,behavior}/
#   * the layer rules -> packages/README.md   <- READ THIS FIRST
#
# THE SHORT VERSION OF THE ARCHITECTURE
#   hw/       one file per physical part. Owns the component config and the only
#             register/pin-level talk to that part. No policy.
#   api/      one file per subsystem. The abstraction layer: everything else
#             talks to a subsystem THROUGH these scripts, never to its hardware.
#   behavior/ operational logic. Presets, gestures, announcements, the Home
#             Assistant control surface. Decides what should happen; calls api/.
#
# See HARDWARE.md for the physical part list, pin map, I2C address map and power
# budget, and SOUNDMACHINE.md for why the device is the way it is.
# =====================================================================

packages:
  # ---- Tunables. Loaded first by convention; ESPHome merges every package
  # before it expands substitutions, so order does not actually matter. ----
  settings: !include packages/settings.yaml

  # ---- HARDWARE: the parts. One file per physical device. ----
  hw_rtc: !include packages/hw/rtc.yaml
  hw_ambient_light: !include packages/hw/ambient_light.yaml
  hw_audio_chain: !include packages/hw/audio_chain.yaml
  hw_crescent: !include packages/hw/crescent.yaml
  hw_knob: !include packages/hw/knob.yaml
  hw_touch: !include packages/hw/touch.yaml
  hw_proximity: !include packages/hw/proximity.yaml
  hw_power: !include packages/hw/power.yaml
  # The display driver: the only thing in the build that talks to the panels.
  # It renders the frame it is handed and nothing else - what to SHOW is decided
  # one layer up, in api/display.yaml.
  hw_matrix: !include packages/hw/matrix.yaml

  # ---- API: the abstraction layer. The only writers of their hardware. ----
  api_display: !include packages/api/display.yaml
  api_sound: !include packages/api/sound.yaml
  api_light: !include packages/api/light.yaml
  api_indicator: !include packages/api/indicator.yaml

  # ---- BEHAVIOR: operational logic and the Home Assistant surface. ----
  behavior_sound: !include packages/behavior/sound.yaml
  behavior_light: !include packages/behavior/light.yaml
  behavior_voice: !include packages/behavior/voice.yaml
  behavior_power: !include packages/behavior/power.yaml
  behavior_message: !include packages/behavior/message.yaml

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  # No on_boot here. Boot work belongs to whichever package owns the thing being
  # brought up, so that dropping the package drops its boot step too:
  #   api/sound.yaml   waits for the audio stack, then raises on_audio_ready
  #   clock_display       self-initialises on its first paint, and re-does it if a
  #                    rail glitch wipes the panels

esp32:
  board: esp32-s3-devkitc-1
  # 8MB matches the standard XIAO ESP32-S3, which is what this build targets (see
  # HARDWARE.md). Raise to 16MB ONLY if the board is the "Plus" variant.
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: ${log_level}
  logs:
    vl53l0x: ${tof_log_level}   # quiet the per-reading ToF spam

api:
  encryption:
    key: ${api_key}             # injected from local secrets - see settings.yaml

ota:
  - platform: esphome
    password: ${ota_password}   # injected from local secrets

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

captive_portal:

# ---------------------------------------------------------------------
# WEB SERVER - standalone control when Home Assistant is down. Point a browser
# at http://soundmachine.local/ (or the device IP) on the same WiFi. version 3 =
# modern UI; local: true embeds it in flash so it works with NO internet at all
# (there is ~1.6 MB of flash free, so this is affordable).
# ---------------------------------------------------------------------
web_server:
  port: 80
  version: 3
  local: true
  # auth:                          # if you enable this, add a `web_password`
  #   username: admin              # substitution (overridden from local secrets)
  #   password: ${web_password}    # - remote packages can't use !secret directly

# ---------------------------------------------------------------------
# I2C - ONE bus; every sensor, the codec, the amp, the RTC and the display all
# hang off it. Addresses and the frequency rationale are in settings.yaml
# section 2; the wiring cautions are in HARDWARE.md.
# ---------------------------------------------------------------------
i2c:
  id: internal_i2c
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  scan: true              # the boot scan is how you confirm the UPS address
  frequency: ${i2c_frequency}
  timeout: ${i2c_timeout}

# ---------------------------------------------------------------------
# EXTERNAL COMPONENTS
# ---------------------------------------------------------------------
external_components:
  # FormatBCE I2S fork + XVF3800/AIC3104 drivers (audio)
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: respeaker_microphone
    components: [ i2s_audio ]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
      ref: main
    components: [ respeaker_xvf3800, aic3104 ]
    refresh: 0s
  # ssieb seesaw (rotary encoder) - superseded by the vendored copy below, which
  # carries a patched dump_summary() for ESPHome 2026.7.x. Kept for provenance.
  # - source:
  #     type: git
  #     url: https://github.com/ssieb/esphome_components
  #   components: [ seesaw ]   # upstream name
  #   refresh: 1d
  # Custom components pulled from THIS repo by git, so they resolve the same way
  # whether built locally or pulled remotely onto Home Assistant. (A `type: local`
  # source would resolve against the local config dir, which the HA side does not
  # have.) For local component development, push first, then build - or
  # temporarily switch this back to `type: local, path: components`.
  - source: github://astoker/sound-machine@main
    components: [ ambience_player, background_sound, clock_display, noise_generator, rotary_knob, shared_helpers, speaker_amp ]
    refresh: 0s

# Shared helpers for the YAML lambdas (components/shared_helpers). No configuration -
# naming it here is what puts its header in the generated main.cpp, which is how
# lambdas in different packages can call the same function. `includes:` would be
# the obvious alternative and is unusable here: it resolves against the build
# machine's config dir, so it breaks when this config is pulled onto Home
# Assistant as a remote package.
shared_helpers:
