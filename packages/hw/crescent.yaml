# =====================================================================
# HARDWARE: SK6812 crescent LED strip (RMT, GRBW)  [layer: hw]
#
# The strip itself, its geometry, and the effects that need to know that
# geometry. Nothing here decides when the light should be on - that is
# behavior/light.yaml, working through api/light.yaml.
#
# >>> THE PIXEL COUNT AND ROW LAYOUT ARE NOT SETTINGS. They are DERIVED from the
# >>> enclosure: 3d-print/enclosure_geom.py is the source of truth and this file
# >>> carries a copy of its output. Change the crescent, re-run gen_drawing.py,
# >>> re-sync BOTH values here, and run 3d-print/check_docs.py - which fails the
# >>> build if they drift. Get this wrong and the firmware addresses pixels that
# >>> are not physically there.
#
# The three custom effects live here, because two of them paint by POSITION and
# so are inseparable from the row layout above them - Circadian Sunrise per row,
# Rainbow Arch per pixel-radius. (Colour Cycle needs no geometry; it is here
# only because effects must be declared on the light they run on.) Which effect
# a preset uses, and when, is behavior/light.yaml's business, not this file's.
#
# The sunrise's auto-off is NOT here: it raises sunrise_done and api/light.yaml
# acts on it, because turning the light off is a write and writes belong to the
# api layer (also: calling turn_off from inside a running effect is asking for
# trouble).
#
# DEFINES  crescent (light) and its effects, sunrise_duration + sunrise_hold
#          (numbers), sunrise_done (global).
# CONSUMES the led_*, sunrise_*, cycle_*, rainbow_* and pin_crescent_data
#          settings.
# WRITTEN BY api/light.yaml ONLY.
# =====================================================================
globals:
  # Set true by the Circadian Sunrise effect once it has held at full for the
  # configured hold time. api/light.yaml's tick acts on it and turns the light
  # off. Cleared on each fresh run of the effect.
  - id: sunrise_done
    type: bool
    restore_value: no
    initial_value: 'false'

number:
  - platform: template
    name: "Sunrise Duration"
    id: sunrise_duration
    optimistic: true
    restore_value: true
    initial_value: ${sunrise_default_minutes}
    min_value: 5
    max_value: 90
    step: 1
    unit_of_measurement: "min"
    mode: box

  # How long to hold the full "state B" before auto-off. 0 = off immediately at
  # full; e.g. 10 = stay bright 10 min after the sunrise completes, then off.
  - platform: template
    name: "Sunrise Hold (auto-off)"
    id: sunrise_hold
    optimistic: true
    restore_value: true
    initial_value: ${sunrise_default_hold}
    min_value: 0
    max_value: 60
    step: 1
    unit_of_measurement: "min"
    mode: box

light:
  - platform: esp32_rmt_led_strip
    id: crescent
    name: "Crescent Light"
    chipset: SK6812
    rgb_order: GRB
    is_rgbw: true
    pin: ${pin_crescent_data}
    # Real build: the crescent is a FLATTENED HALF-ELLIPSE, 89 x 62.7 semi-axes,
    # not a half circle -- the crown was flattened (CROWN_K 0.74) to get the dome
    # printable in one piece on a 220 bed. MEASURED strip: 10.0mm ribbon, 16.5mm
    # cut-line pitch, 2.13mm thick. See 3d-print/enclosure_geom.crescent_rows --
    # that is the source of truth, this is a copy of its output.
    #
    # >>> WHAT LIMITS THE COUNT IS THE RIBBON, NOT THE LEDs. A cut segment of n
    # >>> pixels is n * 16.5mm long, because the cut lines sit half a pitch
    # >>> outboard of the end LEDs and trimming past them loses the solder pads.
    # >>> On the bottom row that is 6.9mm more than the LED span. Every layout
    # >>> before this one measured only the LED bodies and so overcounted.
    #
    # THE ROW PITCH IS 10.4, NOT 16.5. It is DERIVED: the flattened crown leaves
    # only 62.7mm of height, so the pitch is whatever gets the most pixels on,
    # floored at the ribbon width (10.0) - THE ROWS BUTT, edge to edge. That
    # floor used to carry a 1mm gap and it cost three pixels: at 11.0 the
    # crescent holds 45, at 10.4 it holds the whole 48-px reel, same shell.
    # Rows are much CLOSER together than the pixels within a row - the grid is
    # deliberately not square.
    #
    # NO FADE BAND. The LED field IS the diffuser ellipse now; the old R96-inside-
    # R117 arrangement with a 21mm unlit band is gone. Tightest LED-body-to-
    # diffuser gap is 2.95mm.
    # Row chords 177.8/174.1/165.2/150.0/126.3/87.7 mm -> 10/10/9/8/7/4 = 48 px.
    num_leds: 48
    # Hard current ceiling: caps max PWM to led_max_pct of full scale, so the
    # strip physically can't exceed that current no matter what HA commands.
    # Sized against the UPS 5V/5A rail with the amp at full tilt - see the power
    # budget in settings.yaml section 7.
    color_correct:            # block style: ${} can't live inside a [ ] flow list
      - ${led_max_pct}
      - ${led_max_pct}
      - ${led_max_pct}
      - ${led_max_pct}
    gamma_correct: ${led_gamma}    # linear so low brightness still lights
    default_transition_length: ${crescent_transition}
    effects:
      - addressable_rainbow:
      - addressable_color_wipe:
      - pulse:
      # ---------------------------------------------------------------
      # Colour Cycle: the whole crescent one colour, drifting round the hue
      # wheel. No geometry at all - it is here rather than anywhere else only
      # because effects must be declared on the light.
      #
      # BRIGHTNESS IS BAKED IN, as it is in every effect below. An addressable
      # light hands its pixels to the running effect and stops applying its own
      # brightness to them, so the HA brightness slider does nothing while an
      # effect is active. cycle_brightness is the second brightness layer the
      # static presets get from settings; led_max_pct still caps the result.
      #
      # ---- WHY THIS DITHERS, AND WHY THE OBVIOUS VERSION LOOKS CHOPPY ----
      # THERE ARE ONLY ~32 BRIGHTNESS LEVELS PER CHANNEL HERE, not 256. The strip
      # is 8-bit, and everything downstream multiplies into that: cycle_brightness
      # (0.50) then led_max_pct (25%). 255 x 0.50 x 0.25 = 32. A hue sweep at full
      # saturation walks ONE channel from 0 to full across 60 degrees, so those 60
      # degrees are rendered in 32 steps - and at 180s a step lands about once a
      # second, as a visible 3% jump in that channel. The first few steps off zero
      # are the worst: 0 -> 1 -> 2 is a doubling each time. That is the choppiness,
      # and no amount of finer maths upstream fixes it, because the quantiser is
      # the last thing in the chain.
      #
      # What DOES fix it: the 48 pixels are behind a diffuser and the eye reads
      # their AVERAGE, so they do not all have to be on the same side of a step at
      # the same time. Each pixel therefore renders a hue a fraction of a degree
      # ahead of its neighbour - a span of cycle_pixel_spread_deg across the whole
      # crescent, sized to about one output step. At any instant some pixels have
      # rounded up and the rest have not, and the ratio slides smoothly as the
      # colour advances: ~48x the effective resolution, for one extra term.
      #
      # Two things this depends on, so don't undo them:
      #   * the hue -> RGB conversion is done in FLOAT here rather than through
      #     ESPHSVColor, whose hue is a uint8 (1.4 deg per count). Quantising the
      #     hue first would collapse the spread onto 2-3 distinct values and there
      #     would be almost nothing left to average.
      #   * the offsets are SCATTERED (golden ratio), not ramped. A ramp puts the
      #     rounded-up pixels together and walks that boundary along the crescent
      #     as a faintly visible edge; scattering leaves a fixed 1-LSB speckle the
      #     diffuser swallows.
      # ---------------------------------------------------------------
      - addressable_lambda:
          name: "${cycle_effect_name}"
          update_interval: ${cycle_update_interval}
          lambda: |-
            static uint32_t start_millis = 0;
            if (initial_run) start_millis = millis();

            // Position on the wheel, 0..1, wrapping every cycle_period_s.
            const float period_seconds = ${cycle_period_s}.0f;
            const float phase = fmodf((millis() - start_millis) / 1000.0f / period_seconds, 1.0f);
            const float base_hue = phase * 360.0f;
            const float level = ${cycle_brightness}f;

            for (int i = 0; i < it.size(); i++) {
              // Golden-ratio low-discrepancy offset: evenly spread over 0..1 for
              // any pixel count, with no correlation between neighbours.
              float scatter = i * 0.6180339887f;
              scatter -= floorf(scatter);
              float hue = base_hue + ${cycle_pixel_spread_deg}f * scatter;

              // Hue -> RGB at full saturation, in float. One channel is at full,
              // one at zero, and the third ramps across the 60-degree sector.
              const float sextant = fmodf(hue, 360.0f) / 60.0f;
              const int sector = (int) sextant;
              const float ramp = sextant - sector;
              float red, green, blue;
              switch (sector) {
                case 0:  red = 1.0f;        green = ramp;        blue = 0.0f;        break;
                case 1:  red = 1.0f - ramp; green = 1.0f;        blue = 0.0f;        break;
                case 2:  red = 0.0f;        green = 1.0f;        blue = ramp;        break;
                case 3:  red = 0.0f;        green = 1.0f - ramp; blue = 1.0f;        break;
                case 4:  red = ramp;        green = 0.0f;        blue = 1.0f;        break;
                default: red = 1.0f;        green = 0.0f;        blue = 1.0f - ramp; break;
              }

              // Rounded, not truncated - truncation costs half a level of the 32
              // there are. White channel stays 0: mixing it in would wash the hue
              // out, and a saturated colour lighting at most two of the four
              // channels is what keeps this well under the static presets' draw.
              it[i] = Color((uint8_t) lroundf(red   * level * 255.0f),
                            (uint8_t) lroundf(green * level * 255.0f),
                            (uint8_t) lroundf(blue  * level * 255.0f), 0);
            }

      # ---------------------------------------------------------------
      # Rainbow Arch: concentric hue bands, red on the outside and violet at the
      # centre of the flat edge - a real rainbow's order, on the one shape this
      # crescent naturally makes.
      #
      # The band a pixel lands in is its NORMALISED ELLIPTICAL RADIUS, not its
      # row: r = sqrt((x/half_width)^2 + (y/height)^2) over the LED field's own
      # semi-axes. Rows alone would give horizontal stripes, which is not what an
      # arch looks like - the top-centre pixels and the bottom-outermost pixels
      # belong to the SAME band, and only a radius puts them there.
      #
      # >>> IT IS LEFT-RIGHT SYMMETRIC ON PURPOSE. x appears only as x^2, so
      # >>> mirroring a row changes nothing - which means this effect is correct
      # >>> whether or not the strip is laid serpentine. That is the one unknown
      # >>> in the layout note above, and this sidesteps it rather than guessing.
      #
      # Static, so it is repainted on a lazy interval purely to survive anything
      # that disturbs the buffer; there is nothing to animate.
      # ---------------------------------------------------------------
      - addressable_lambda:
          name: "${rainbow_effect_name}"
          update_interval: ${rainbow_update_interval}
          lambda: |-
            // Same row layout as the sunrise above, and the same warning: this is
            // a COPY of 3d-print/enclosure_geom.crescent_rows, bottom row first.
            static const uint8_t leds_per_row[] = {10, 10, 9, 8, 7, 4};
            const uint8_t row_count = sizeof(leds_per_row) / sizeof(leds_per_row[0]);
            // Physical spacing from the same source: 16.5mm between pixels along
            // a row, 10.4mm between rows. The grid is deliberately not square, so
            // using row/column INDICES here would squash the bands vertically.
            const float pitch_x = 16.5f, pitch_y = 10.4f;

            // Semi-axes of the LED FIELD, derived from the layout rather than
            // copied from the enclosure's 89 x 62.7: those describe the diffuser,
            // which the pixels sit inside, so normalising by them would leave the
            // outer band never reaching r = 1 and the red end unused.
            uint8_t widest = 0;
            for (uint8_t row = 0; row < row_count; row++)
              if (leds_per_row[row] > widest) widest = leds_per_row[row];
            const float half_width = (widest > 1) ? (widest - 1) * 0.5f * pitch_x : 1.0f;
            const float height = (row_count > 1) ? (row_count - 1) * pitch_y : 1.0f;

            const float level = ${rainbow_brightness}f;
            uint16_t led_index = 0;
            for (uint8_t row = 0; row < row_count && led_index < it.size(); row++) {
              const float y = row * pitch_y;
              for (uint8_t led_in_row = 0; led_in_row < leds_per_row[row] && led_index < it.size(); led_in_row++) {
                // x measured from the crescent's centre line, in mm.
                const float x = (led_in_row - (leds_per_row[row] - 1) * 0.5f) * pitch_x;
                const float nx = x / half_width, ny = y / height;
                float radius = sqrtf(nx * nx + ny * ny);
                if (radius > 1.0f) radius = 1.0f;   // the top row overhangs slightly

                // Outermost band red (hue 0), innermost violet. 270 degrees is
                // the rainbow's own span - a full 360 would wrap back to red and
                // put two red bands on the arch.
                const float hue_degrees = ${rainbow_hue_span}f * (1.0f - radius);
                auto hue_rgb = light::ESPHSVColor((uint8_t) (hue_degrees * 255.0f / 360.0f), 255, 255).to_rgb();
                it[led_index++] = Color((uint8_t) (hue_rgb.r * level),
                                        (uint8_t) (hue_rgb.g * level),
                                        (uint8_t) (hue_rgb.b * level), 0);
              }
            }
            // Any LEDs past the configured rows stay off.
            for (; led_index < it.size(); led_index++) it[led_index] = Color(0, 0, 0, 0);
      # Circadian Sunrise: keyframe-interpolated dawn simulation. The sun rises
      # from the bottom row; colour evolves deep-red -> amber -> blue-enriched
      # cool white over an ADJUSTABLE duration (the "Sunrise Duration" number
      # above). Holds the final keyframe when done, then asks for auto-off.
      - addressable_lambda:
          # Named from settings so behavior/light.yaml can ask for it without
          # re-typing the string - a mismatch there is a silent no-op at runtime.
          name: "${sunrise_effect_name}"
          update_interval: ${sunrise_update_interval}
          lambda: |-
            // ============ THE ROW LAYOUT (see the header warning) ============
            // LEDs per row, DATA-LINE order, BOTTOM row first. Sum == num_leds.
            // FLATTENED half-ellipse crescent, 89 x 62.7 semi-axes. 16.5mm pitch
            // ALONG a row; rows are 10.4 apart, NOT 16.5 -- the grid is
            // deliberately not square, see the note on the light above. The flat
            // side is down, so the widest row is row 0. Row counts are limited by
            // whichever binds first: the LED body staying inside the diffuser, or
            // the RIBBON (n x 16.5mm) fitting the cavity. On rows 0, 2 and 4 it
            // is the ribbon.
            //   row 0: 177.8mm -> 10   row 3: 150.0mm -> 8
            //   row 1: 174.1mm -> 10   row 4: 126.3mm -> 7
            //   row 2: 165.2mm ->  9   row 5:  87.7mm -> 4   total 48
            //
            // >>> ROWS ARE ONLY 10.4mm APART -- they BUTT, ribbon edge to ribbon
            // >>> edge -- against 16.5mm between pixels along a row. Vertical
            // >>> gradients therefore have well under half the physical travel a
            // >>> square grid would give, so any effect that sweeps up the
            // >>> crescent will look much faster vertically than horizontally
            // >>> unless it compensates.
            //
            // If the strip is laid serpentine, every ODD row runs right-to-left.
            // The sunrise only fills whole rows so that doesn't matter here, but
            // it will for any effect with horizontal structure.
            static const uint8_t leds_per_row[] = {10, 10, 9, 8, 7, 4};
            const uint8_t row_count = sizeof(leds_per_row) / sizeof(leds_per_row[0]);

            // Dawn keyframes across normalized progress 0..1.
            // Research-based path: dim deep-red (low circadian disruption) ->
            // amber -> blue-enriched cool white (~480nm drives alertness).
            const uint8_t keyframe_count = 5;
            static const float   keyframe_progress[]   = {0.00f, 0.25f, 0.55f, 0.80f, 1.00f};
            static const float   keyframe_sun_height[] = {0.05f, 0.30f, 0.60f, 0.85f, 1.00f};
            static const float   keyframe_brightness[] = {0.02f, 0.12f, 0.35f, 0.65f, 1.00f};
            static const uint8_t keyframe_red[]        = {255,   255,   255,   255,   150};
            static const uint8_t keyframe_green[]      = { 20,    70,   130,   180,   200};
            static const uint8_t keyframe_blue[]       = {  0,     5,    30,   110,   255};
            static const uint8_t keyframe_white[]      = {  0,     0,    20,   110,   200};
            // =================================================================

            // How far through the sunrise are we? progress = elapsed / duration,
            // clamped to 1.0 so it holds the final "wake" keyframe (state B).
            float duration_minutes = id(sunrise_duration).state;
            if (!(duration_minutes >= 0.1f)) duration_minutes = ${sunrise_default_minutes}.0f;  // nan/0 guard
            float hold_minutes = id(sunrise_hold).state;
            if (!(hold_minutes >= 0.0f)) hold_minutes = ${sunrise_default_hold}.0f;             // nan guard

            static uint32_t start_millis = 0;
            if (initial_run) { start_millis = millis(); id(sunrise_done) = false; }
            float elapsed_seconds = (millis() - start_millis) / 1000.0f;
            float progress = elapsed_seconds / (duration_minutes * 60.0f);
            if (progress > 1.0f) progress = 1.0f;

            // Auto-off: after holding at full for hold_minutes, ask api/light.yaml
            // to switch the light off (safer than doing it from inside the effect
            // that is currently painting).
            if (elapsed_seconds >= (duration_minutes + hold_minutes) * 60.0f)
              id(sunrise_done) = true;

            // Find the keyframe pair surrounding 'progress' and how far we are
            // between them (0..1), then interpolate the whole sky state.
            uint8_t lower_keyframe = 0;
            while (lower_keyframe < keyframe_count - 2 &&
                   progress > keyframe_progress[lower_keyframe + 1])
              lower_keyframe++;
            uint8_t upper_keyframe = lower_keyframe + 1;
            float segment_span = keyframe_progress[upper_keyframe] - keyframe_progress[lower_keyframe];
            float blend = (segment_span > 0.0001f)
                        ? (progress - keyframe_progress[lower_keyframe]) / segment_span
                        : 0.0f;
            if (blend < 0.0f) blend = 0.0f;
            if (blend > 1.0f) blend = 1.0f;

            auto interpolate = [blend](float from, float to) { return from + (to - from) * blend; };
            float sun_height     = interpolate(keyframe_sun_height[lower_keyframe], keyframe_sun_height[upper_keyframe]);
            float sky_brightness = interpolate(keyframe_brightness[lower_keyframe], keyframe_brightness[upper_keyframe]);
            float sky_red        = interpolate(keyframe_red[lower_keyframe],   keyframe_red[upper_keyframe]);
            float sky_green      = interpolate(keyframe_green[lower_keyframe], keyframe_green[upper_keyframe]);
            float sky_blue       = interpolate(keyframe_blue[lower_keyframe],  keyframe_blue[upper_keyframe]);
            float sky_white      = interpolate(keyframe_white[lower_keyframe], keyframe_white[upper_keyframe]);

            // Paint: the lit "sun" fills from the bottom row upward with a soft
            // glowing leading edge; the sky above the sun stays dark.
            const float edge_softness = ${sunrise_edge_softness}f;
            uint16_t led_index = 0;
            for (uint8_t row = 0; row < row_count && led_index < it.size(); row++) {
              float row_height = (row_count > 1) ? (float) row / (row_count - 1) : 0.0f;
              float sun_above_row = sun_height - row_height;
              float edge_glow;
              if (sun_above_row <= 0.0f)               edge_glow = 0.0f;   // sun not here yet
              else if (sun_above_row < edge_softness)  edge_glow = sun_above_row / edge_softness;
              else                                     edge_glow = 1.0f;   // fully lit below sun
              float level = sky_brightness * edge_glow * ${sunrise_max_brightness}f;  // current cap
              uint8_t out_red   = (uint8_t)(sky_red   * level);
              uint8_t out_green = (uint8_t)(sky_green * level);
              uint8_t out_blue  = (uint8_t)(sky_blue  * level);
              uint8_t out_white = (uint8_t)(sky_white * level);
              for (uint8_t led_in_row = 0; led_in_row < leds_per_row[row] && led_index < it.size(); led_in_row++)
                it[led_index++] = Color(out_red, out_green, out_blue, out_white);
            }
            // Any LEDs past the configured rows stay off.
            for (; led_index < it.size(); led_index++) it[led_index] = Color(0, 0, 0, 0);
