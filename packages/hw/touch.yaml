# =====================================================================
# HARDWARE: ESP32-S3 capacitive touch pad  [layer: hw]
#
# A single native touch channel, no extra chip. Uses the same tap/hold timings as
# the knob switch, so the two controls feel identical.
#
# INPUT EVENTS RAISED (the contract behavior/light.yaml must implement):
#   on_touch_tap   - a short press
#   on_touch_hold  - a long press
#
# CALIBRATION: check `value` FIRST. If it reads exactly 4194303 the counter is
# saturated and no threshold can ever work - fix touch_measurement_duration before
# anything else (see the measurement_duration note below). Once value sits well
# under that ceiling, the threshold is a DELTA against the peripheral's
# own rolling per-channel `benchmark`, not a raw capacitance count - the pad goes
# active when (value - benchmark) exceeds it. Expect hundreds to a few thousand,
# and expect it to be build-specific: it depends on the pad area, the lead length
# and the wall thickness. Set touch_setup_mode to true, watch the `difference=`
# field in the logs untouched vs held, set touch_threshold to ~0.5-0.7x the held
# figure, then set setup mode back to false.
#
# NOTHING HERE LOGS AT DEBUG. The component only prints pad state at VERBOSE, and
# so does binary_sensor itself - so with log_level: DEBUG a working pad produces
# no log line at all, only a state change in HA / the web server. Setup mode is
# the exception: it logs at DEBUG. Don't read log silence as "the pad is dead".
#
# DEFINES  preset_touch (binary_sensor).
# CONSUMES the touch_* and gesture_* settings.
# REQUIRES scripts on_touch_tap / on_touch_hold (behavior/light.yaml).
# =====================================================================
esp32_touch:
  setup_mode: ${touch_setup_mode}
  # NOT OPTIONAL - see touch_measurement_duration in settings.yaml. Leaving this
  # out takes ESPHome's default, which derives charge_times = 65535 (its maximum,
  # against a driver default of 500) and pins every reading at the 22-bit ceiling
  # of 4194303, difference stuck at 0. A pad that reads exactly 4194303 is this,
  # not a wiring fault.
  measurement_duration: ${touch_measurement_duration}

binary_sensor:
  - platform: esp32_touch
    name: "Preset Touch"
    id: preset_touch
    pin: ${touch_pin}
    threshold: ${touch_threshold}
    filters:
      - delayed_on: ${touch_debounce}   # debounce the pad against electrical noise
    on_multi_click:
      - timing:
          - ON for at most ${gesture_tap_max}
          - OFF for at least ${gesture_tap_gap}
        then:
          - script.execute: on_touch_tap
      - timing:
          - ON for at least ${gesture_hold_min}
        then:
          - script.execute: on_touch_hold
