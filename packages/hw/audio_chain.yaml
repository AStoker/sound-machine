# =====================================================================
# HARDWARE: the audio chain  [layer: hw]
#
# Everything the sound physically travels through, and nothing about what to
# play. Signal path:
#
#   noise_source ---\
#   loop_source  ----\
#   media files  ----> mixer -> I2S -> XVF3800 -> AIC3104 -> TPA2016 -> 2 speakers
#   TTS reply    ---/
#   4 mics -------> I2S in -> XVF3800 beamformer -> wake word / voice assistant
#
# TWO WAYS AUDIO REACHES THE MIXER, AND THEY ARE NOT INTERCHANGEABLE.
#   * AN AMBIENCE runs for hours and must never stop: noise_source and loop_source own
#     a mixer source each, start it once, and push samples into it forever.
#     There is no end-of-file and no pipeline, so there is nothing to restart.
#   * A ONE-SHOT is played through `external_media_player`, which decodes into a
#     resampler and a pipeline that is torn down at the end.
#   Looping a one-shot means `repeat_one`, which restarts that pipeline every
#   pass and eventually wedges the media channel - FUTURE-DEVELOPMENT T3/T4/T5.
#   EVERY flashed sound here is an ambience, so the media player has no `files:` list
#   at all; it carries the TTS reply and Home Assistant's audio, and nothing that
#   loops.
#
# DEFINES  amp, i2s_output, i2s_input, aic3104_dac, i2s_mics, i2s_audio_speaker,
#          announcement_resampling_speaker, media_resampling_speaker,
#          mixing_speaker + its four inputs (announcement/media/noise/ambience),
#          noise, ambience (loop_source) + the la_la_sad and crickets files it
#          reads, external_media_player, respeaker, mic_mute_switch, and the
#          amp's configuration re-assert tick.
# CONSUMES internal_i2c (device core), the audio settings.
# WRITTEN BY api/sound.yaml ONLY. Nothing else starts, stops, ducks or
#          re-levels this chain; behavior packages go through that api. Reading
#          state (external_media_player->volume, is_announcing) is allowed
#          anywhere - see the layer rules in packages/README.md.
#
# ---------------------------------------------------------------------
# THE AMP'S I2C IS REQUIRED, NOT OPTIONAL
#   * STEREO amp, one 4-ohm speaker per channel. Outputs are BRIDGE-TIED: every
#     terminal swings, there is no output ground. Do NOT common the two
#     speakers' negative leads and do NOT tie an output to GND - either shorts
#     half a bridge and kills the amp.
#   * Left standalone the amp boots with its AGC ENABLED. That fights the
#     software volume (turn it down, the AGC ramps it back up), breathes audibly
#     on steady noise, and - the real problem - makes the echo path
#     time-varying, which is precisely what the XVF3800's echo canceller cannot
#     cancel. Wake-word-over-noise is the exact case that would fail.
#   * So the amp is configured ONCE at boot by the `tpa2016:` block below:
#     compression 1:1 (AGC off), one fixed analog gain, limiter parked high as a
#     pure fault stop. All volume lives in software, in the AIC3104 upstream.
#   * ORDER OF THE REGISTER WRITES MATTERS and is handled inside the component:
#     compression must reach 1:1 BEFORE the gain is set, because disabling
#     compression narrows the legal gain range from -28..30 dB to 0..30 dB. Set
#     gain first and it gets clamped - people end up with a silent amp this way.
#   * The chip has no NVM. A glitch on the 5V rail returns it to factory defaults
#     - which means AGC back ON, silently. The interval below re-asserts the
#     configuration so that state cannot persist; see the note on it.
# ---------------------------------------------------------------------
tpa2016:
  id: amp
  address: ${i2c_addr_amp}
  i2c_id: internal_i2c
  compression: "1:1"          # AGC OFF. Do not change without re-testing AEC.
  gain_db: ${amp_gain_db}
  limiter: true
  limiter_level: ${amp_limiter_dbv}
  noise_gate: false

interval:
  # RE-ASSERT THE AMP CONFIGURATION. The failure this exists for is silent: the
  # amp comes back from a rail glitch with its AGC enabled, and the only symptom
  # is that the echo canceller stops working and wake-word-over-noise starts
  # failing. Nothing would report it.
  #
  # apply() is four register writes, each verified by readback, and it is
  # idempotent - the component exposes it publicly for exactly this. Re-writing
  # blindly is the right shape here rather than probing first: the probe would
  # cost the same readbacks that apply() already does.
  - interval: ${amp_reassert_interval}
    then:
      - lambda: |-
          if (!id(amp)->apply())
            ESP_LOGW("tpa2016", "re-assert failed - amp may be on factory defaults (AGC ON)");

# ---------------------------------------------------------------------
# I2S to/from the XVF3800. The pins are fixed by the Flex's routing, and the
# clock pins are shared between the input and output buses - hence
# allow_other_uses on both.
# ---------------------------------------------------------------------
i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: ${pin_i2s_ws}
      allow_other_uses: true
    i2s_bclk_pin:
      number: ${pin_i2s_bclk}
      allow_other_uses: true
  - id: i2s_input
    i2s_lrclk_pin:
      number: ${pin_i2s_ws}
      allow_other_uses: true
    i2s_bclk_pin:
      number: ${pin_i2s_bclk}
      allow_other_uses: true

audio_dac:
  - platform: aic3104
    id: aic3104_dac
    address: ${i2c_addr_codec}
    i2c_id: internal_i2c

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: ${pin_i2s_din}
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary        # the XVF3800 is the I2S master
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: ${pin_i2s_dout}
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never             # never tear the stream down; noise runs for hours
    buffer_duration: 100ms
    audio_dac: aic3104_dac
  # Resamplers in front of the mixer: HA-supplied audio and flashed files arrive
  # at whatever rate they were encoded at; the mixer needs one common rate.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  # FOUR independent inputs, which is what makes ducking possible: the three
  # background channels can be dipped while the spoken reply stays at full
  # volume on its own channel.
  #
  # `ambience_mixing_input` is separate from `noise_mixing_input` even though only one
  # ambience can play at a time, because a mixer source has exactly one owner - the
  # component that starts and stops it. Sharing one input between two components
  # would put the start/stop race back that this whole arrangement removes.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        num_channels: 1
        timeout: never
      - id: media_mixing_input
        num_channels: 1
        timeout: never
      - id: noise_mixing_input
        num_channels: 1
        timeout: never
      - id: ambience_mixing_input
        num_channels: 1
        timeout: never

# The noise generator (custom component, components/noise_source). Colour is
# selected at runtime through api/sound.yaml, never here.
noise_source:
  id: noise
  speaker: noise_mixing_input
  sample_rate: 48000
  gain: ${noise_gain}
  fade_length: ${noise_fade_length}
  high_pass_frequency: ${noise_high_pass_hz}
  high_pass_makeup: ${noise_high_pass_makeup}

# The flashed audio. Every one of these is an AMBIENCE, so none of them belongs to the
# media player - both declaration sites compile to the same thing (a byte array
# plus an `audio::AudioFile`), and the only question is which component honestly
# owns the file.
#
# THE FORMAT IS NOT NEGOTIABLE: mono, 48 kHz, MP3. The rules and the ffmpeg
# recipe are in settings.yaml section 11, under "ADDING AUDIO".
audio_file:
  - id: la_la_sad
    file: ${la_la_sad_source}
  - id: crickets
    file: ${crickets_source}

# The ambiences (custom component, components/loop_source). Decodes the files above
# straight into ONE shared mixer source and rewinds at end-of-file, so a loop
# costs a read pointer going back to zero instead of a pipeline restart.
#
# `files:` ORDER IS THE API. The index is what `ambience_play(index)` takes, and
# behavior/sound.yaml's AMBIENCES[] must list them in the same order - the two are
# checked against each other at runtime, so a mismatch logs rather than plays the
# wrong thing. Adding an ambience is a line here, a line there, and an option in the
# select; there is no new verb, because an index CAN be a script parameter where
# an `audio::AudioFile` id cannot.
loop_source:
  - id: ambience
    speaker: ambience_mixing_input
    sample_rate: 48000
    gain: ${ambience_gain}
    fade_length: ${ambience_fade_length}
    files:
      - la_la_sad                # ambience 0
      - crickets                 # ambience 1

media_player:
  - platform: speaker
    id: external_media_player
    name: None                 # the device's own media player entity in HA
    internal: false
    announcement_pipeline:
      speaker: announcement_resampling_speaker
    media_pipeline:
      speaker: media_resampling_speaker
    volume_min: ${volume_floor_pct}
    volume_max: ${volume_ceiling_pct}
    # NO `files:` LIST, AND THAT IS THE POINT. Every flashed sound this machine
    # plays runs until something turns it off, which makes all of them ambiences -
    # they live under `audio_file:` + `loop_source:` above. What is left here is
    # what this component is actually good at: the TTS reply on the announcement
    # pipeline, and whatever Home Assistant streams at it.
    #
    # Putting a flashed file back here would mean looping it with `repeat_one`,
    # and that is the failure the ambiences exist to avoid - see the two-mechanisms
    # note at the top of this file, and FUTURE-DEVELOPMENT T3/T4/T5.
    #
    # NOTE: no on_idle hook. The mixer keeps this player from reporting idle
    # reliably, so voice-turn un-ducking is driven by the announcement state
    # instead (see behavior/voice.yaml). That unreliability is the same defect
    # that made looping through here fail, and it has not gone away - it just no
    # longer has anything to break, now that nothing loops here.

# The XVF3800 voice front-end: 4-mic beamforming, noise suppression and the echo
# canceller that the amp's AGC-off setting exists to protect.
respeaker_xvf3800:
  id: respeaker
  address: ${i2c_addr_xvf3800}
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    update_interval: ${mic_mute_update_interval}
