# =====================================================================
# HARDWARE: Waveshare UPS Module 3S power monitoring (INA219, I2C)  [layer: hw]
#
# Reads bus voltage and current off the UPS board and turns them into the two
# facts the rest of the device actually needs:
#
#   external_power  - is the barrel jack live?      (THE mains detector)
#   battery_low     - should we be worried?         (latching, with hysteresis)
#
# Everything between those and the raw chip - load compensation, the state-of-
# charge curve, the debounces - is hardware interpretation and belongs here.
# What to DO about a flat pack or a pulled plug is policy: behavior/power.yaml.
#
# INPUT EVENT RAISED
#   on_power_state_changed  - fired whenever external_power or battery_low
#                            publishes. Read the two sensors for the new state.
#
# !! THE ADDRESS AND SHUNT VALUE ARE PLACEHOLDERS !! Boot with the UPS connected,
# read the I2C scan in the logs, and set ups_i2c_address to whatever unclaimed
# address appears. Everything here keys off settings.yaml, so that is the only
# thing you should need to change once the scan comes back. If the readings are
# nonsense the part may be an INA226 - change `platform: ina219` below.
#
# SIGN CONVENTION: the INA219 on this board reports CHARGE CURRENT POSITIVE and
# DISCHARGE CURRENT NEGATIVE natively - do NOT add a `multiply: -1` filter. An
# earlier revision of this file did, which flipped discharge to positive and made
# "Battery Charging" read true while the pack was actually powering the device.
# Confirmed against mgjbroadbent/waveshare_ups_monitor, which reads this same
# board (INA219 @ 0x41, 0.01 ohm shunt) and documents UPS_CURRENT_A as
# "-0.650 (negative = discharging)".
#
# "CHARGING" IS NOT "ON MAINS". A full pack on the charger tapers to near-zero
# current, so testing for charging reports mains-lost on a perfectly healthy UPS.
# Anything that wants to know "is the jack live?" reads external_power, which is
# defined as NOT DISCHARGING rather than as charging.
#
# PACK THRESHOLDS, for reference (3S = per-cell x3):
#   12.6V full (4.20/cell)   10.2V low (3.40/cell)   9.0V empty (3.00/cell)
# The SOC curve below spans exactly that range. It is a measured lithium-ion
# rest-voltage curve, not a tunable, which is why it lives here rather than in
# settings.yaml.
#
# DEFINES  battery_voltage, battery_current, battery_power,
#          battery_shunt_voltage, battery_oc_voltage, battery_level,
#          battery_cell_voltage, battery_charging, external_power, battery_low.
# CONSUMES internal_i2c (device core), the ups_* / battery_* settings.
# REQUIRES script on_power_state_changed (behavior/power.yaml).
# =====================================================================
sensor:
  - platform: ina219
    address: ${ups_i2c_address}
    i2c_id: internal_i2c
    shunt_resistance: ${ups_shunt_ohms}
    max_voltage: ${ups_max_voltage}
    max_current: ${ups_max_current}
    update_interval: ${ups_poll_interval}
    bus_voltage:
      name: "Battery Voltage"
      id: battery_voltage
      unit_of_measurement: "V"
      accuracy_decimals: 2
      device_class: voltage
      state_class: measurement
    current:
      name: "Battery Current"
      id: battery_current
      unit_of_measurement: "A"
      accuracy_decimals: 3
      device_class: current
      state_class: measurement
      # NO SIGN FILTER. See SIGN CONVENTION above.
    power:
      name: "Battery Power"
      id: battery_power
      unit_of_measurement: "W"
      accuracy_decimals: 2
      device_class: power
      state_class: measurement
    shunt_voltage:
      name: "Battery Shunt Voltage"
      id: battery_shunt_voltage
      internal: true           # diagnostic only; not worth an HA entity

  # Open-circuit (unloaded) pack voltage, recovered from the loaded bus voltage
  # using the pack's internal resistance:
  #
  #     V_oc = V_bus - (I * R)
  #
  # Charge current is positive so it SUBTRACTS (a charging pack reads high);
  # discharge current is negative so it ADDS BACK (a loaded pack sags). One
  # expression handles both directions. This is what stops Battery Level lurching
  # every time the sunrise ramps or the amp starts drawing - the old behaviour
  # where SOC dived under load and "recovered" when it stopped.
  #
  # An EMA on top keeps the number from twitching on single noisy samples.
  # ups_internal_resistance is THE value worth tuning - settings.yaml section 10
  # has the procedure.
  - platform: template
    name: "Battery Compensated Voltage"
    id: battery_oc_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: ${ups_poll_interval}
    lambda: |-
      if (!id(battery_voltage).has_state()) return {};
      if (!id(battery_current).has_state()) return {};
      float bus = id(battery_voltage).state;
      if (!(bus > 0.0f)) return {};

      float oc = bus - (id(battery_current).state * ${ups_internal_resistance}f);

      static bool seeded = false;
      static float ema = 0.0f;
      if (!seeded) { ema = oc; seeded = true; }
      else         { ema += ${ups_ema_alpha}f * (oc - ema); }
      return ema;

  # State of charge, derived from the COMPENSATED pack voltage against a
  # lithium-ion OCV curve. Still an estimate - the UPS board has no coulomb
  # counter, so voltage is all we get, and the curve is flat through the middle
  # by nature. But feeding it V_oc rather than the loaded bus voltage removes the
  # load-sag error, which was the biggest source of drift. Treat <20% as "plug it
  # in", not as a fuel gauge.
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    icon: "mdi:battery"
    update_interval: ${ups_poll_interval}
    lambda: |-
      if (!id(battery_oc_voltage).has_state()) return {};
      float pack = id(battery_oc_voltage).state;
      if (!(pack > 0.0f)) return {};
      float cell = pack / 3.0f;          // 3 cells in SERIES

      // Li-ion rest-voltage curve. Flat through the middle by nature - that
      // plateau is why voltage-based SOC is only ever approximate.
      static const float curve_v[]   = {3.00f, 3.30f, 3.50f, 3.62f, 3.70f, 3.75f,
                                        3.80f, 3.85f, 3.92f, 4.00f, 4.10f, 4.20f};
      static const float curve_pct[] = {0.0f,  5.0f,  10.0f, 20.0f, 30.0f, 40.0f,
                                        50.0f, 60.0f, 75.0f, 85.0f, 95.0f, 100.0f};
      const int points = sizeof(curve_v) / sizeof(curve_v[0]);

      if (cell <= curve_v[0]) return 0.0f;
      if (cell >= curve_v[points - 1]) return 100.0f;
      for (int i = 0; i < points - 1; i++) {
        if (cell < curve_v[i + 1]) {
          float span = curve_v[i + 1] - curve_v[i];
          float blend = (cell - curve_v[i]) / span;
          return curve_pct[i] + (curve_pct[i + 1] - curve_pct[i]) * blend;
        }
      }
      return 100.0f;

  # Per-cell average of the RAW bus voltage - deliberately not the compensated
  # figure, because the point of this entity is to be checkable against a
  # multimeter on the pack terminals.
  - platform: template
    name: "Battery Cell Voltage"
    id: battery_cell_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: ${ups_poll_interval}
    lambda: |-
      if (!id(battery_voltage).has_state()) return {};
      return id(battery_voltage).state / 3.0f;

binary_sensor:
  # TRUE only while the cells are actually absorbing charge. Goes FALSE once a
  # full pack tapers off on mains - that is correct and expected, and is exactly
  # why nothing else in this config gates on it. A battery-health readout, not a
  # mains detector.
  - platform: template
    name: "Battery Charging"
    id: battery_charging
    device_class: battery_charging
    lambda: |-
      if (!id(battery_current).has_state()) return {};
      return id(battery_current).state > ${ups_charge_threshold_a}f;
    filters:
      - delayed_on: ${ups_confirm_time}
      - delayed_off: ${ups_confirm_time}

  # THE MAINS DETECTOR. Defined as NOT DISCHARGING, not as charging: idle-on-mains
  # and full-on-mains both sit near zero current and must still read as powered.
  # Only a sustained NEGATIVE current - the device pulling its whole draw out of
  # the pack - counts as mains lost.
  #
  # The threshold is deliberately asymmetric with the charge threshold. A full
  # pack on the charger periodically hands the load back to the cells for a few
  # seconds, a small discharge of tens of mA with occasional ~180mA spikes; at
  # 50mA that reads as mains loss and flaps. A genuine loss puts several hundred
  # mA on the pack from the very first sample. ups_discharge_threshold_a sits in
  # the empty gap between the two.
  - platform: template
    name: "External Power"
    id: external_power
    device_class: plug
    lambda: |-
      if (!id(battery_current).has_state()) return {};
      return id(battery_current).state > -${ups_discharge_threshold_a}f;
    filters:
      - delayed_on: ${ups_confirm_time}
      - delayed_off: ${ups_confirm_time}
    on_state:
      - script.execute: on_power_state_changed

  # Latching low-battery flag with hysteresis: trips at battery_low_pct and will
  # not clear until SOC climbs battery_low_clear_gap points past it. Without the
  # gap this chatters every time the sunrise ramps and the pack sags across the
  # threshold. Anything reacting to low battery reads THIS, not the raw
  # percentage.
  - platform: template
    name: "Battery Low"
    id: battery_low
    device_class: battery
    lambda: |-
      if (!id(battery_level).has_state()) return {};
      float pct = id(battery_level).state;
      if (id(battery_low).state)
        return pct < (${battery_low_pct} + ${battery_low_clear_gap}.0f);
      return pct <= ${battery_low_pct};
    on_state:
      - script.execute: on_power_state_changed
