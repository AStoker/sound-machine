# =====================================================================
# HARDWARE: the clock display - tiled 16x9 LED matrix panels
# [layer: hw]
#
# There is no native ESPHome component for this chip, so the driver is a custom
# one in components/clock_display. This file is what every other hw/ file is: the
# device's configuration, and nothing else.
#
# THE DRIVER MAKES NO DECISIONS. It renders the `Frame` it is handed - text or a
# clock, at a brightness - and that is the whole interface:
#
#     id(matrix)->paint(frame)
#
# What goes IN that frame is decided one layer up, in packages/api/display.yaml,
# which is the only caller. The Frame type itself is documented in
# components/clock_display/clock_display.h, along with the tiling, the physical
# inter-panel gap, how static text is kept off the seam, and the self-healing
# config probe.
# Those are all properties of this hardware, so they live with the code that
# talks to it rather than in YAML.
#
# BRING-UP: delete the second entry from `addresses:` to run on the left panel
# alone. THE PANEL COUNT IS THE LENGTH OF THAT LIST - there is no second setting
# that could disagree with it - and the unlisted panel is never touched, so an
# unwired board causes no I2C errors.
#
# DEFINES  matrix (the display driver).
# CONSUMES internal_i2c (device core) and the matrix_* settings.
# WRITTEN BY api/display.yaml ONLY.
# =====================================================================
clock_display:
  id: matrix
  i2c_id: internal_i2c
  addresses:                    # left to right; one entry per physical panel
    - ${matrix_address}
    - ${matrix_address_2}
  panel_gap: ${matrix_panel_gap}
  pwm_min: ${matrix_pwm_min}
  pwm_max: ${matrix_pwm_on}
  probe_interval: ${matrix_probe_interval}
