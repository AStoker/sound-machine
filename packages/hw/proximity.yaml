# =====================================================================
# HARDWARE: VL53L0X time-of-flight sensor (I2C)  [layer: hw]
#
# Mounted on the crown just right of the knob, looking up (see HARDWARE.md).
# Reports METRES. Its whole job is answering one question - "is a hand over the
# knob?" - which is hardware interpretation, so the debounce lives here. What to
# DO about a nearby hand is policy and lives in behavior/sound.yaml, with the rest
# of the knob's behaviour.
#
# NOTHING DEPENDS ON THIS SENSOR. If the board is absent or unwired the component
# marks itself failed at setup, publishes nothing, hand_near stays false, and
# every other feature carries on unchanged. Dropping this package from the
# manifest is likewise safe: on_hand_near_changed simply never fires.
#
# INPUT EVENT RAISED
#   on_hand_near_changed  - fired only on a genuine transition. Read hand_near
#                           for the new verdict.
#
# The published entity never reports NaN: "no target in range" - the sensor's
# resting state - becomes tof_no_target_m instead, so it cannot show as
# 'unknown' in Home Assistant. See the filters block for why the debounce
# doesn't go through them.
#
# IF IT WILL NOT SEE A HAND, look at the raw readings before touching a
# threshold: set `tof_log_level: DEBUG` (settings.yaml section 12) and watch the
# "Got distance" lines with the space above the knob empty, then with a hand at
# 30 / 20 / 10cm. What you learn from that:
#   * idle shows a small fixed distance (~0.03m)  -> unresolved measurements, or
#     something inside the sensor's 25-degree cone. The debounce already ignores
#     these; raise tof_min_valid_m just above whatever it shows.
#   * a hand reads nothing at all                  -> sensitivity. tof_long_range
#     and tof_timing_budget are the levers, in that order.
#   * a hand reads the RIGHT distance but the pixel does not light -> thresholds.
#     tof_near_m / tof_far_m, tracked as C1 in FUTURE-DEVELOPMENT.md.
#
# DEFINES  knob_distance (sensor), knob_proximity (binary_sensor),
#          hand_near (global) + its three sample counters.
# CONSUMES internal_i2c (device core), the tof_* settings.
# REQUIRES script on_hand_near_changed (behavior/sound.yaml).
# =====================================================================
globals:
  # The debounced verdict. This, not the raw distance, is what consumers read.
  - id: hand_near
    type: bool
    restore_value: no
    initial_value: 'false'
  # Consecutive-sample counters behind hand_near.
  - id: hand_near_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: hand_far_count
    type: int
    restore_value: no
    initial_value: '0'
  # Consecutive UNRESOLVED readings. Not a third verdict - just the leash on how
  # long an unresolved sample may be ignored before it is treated as "far".
  - id: hand_invalid_count
    type: int
    restore_value: no
    initial_value: '0'

sensor:
  - platform: vl53l0x
    id: knob_distance
    name: "Knob Distance"
    address: ${i2c_addr_tof}
    update_interval: ${tof_update_interval}
    # SENSITIVITY, not reach - a palm is a much weaker return than the datasheet's
    # white target, so the short-range signal-rate limit may be rejecting hands.
    # Currently OFF: see settings.yaml section 8 for why, and for the second lever
    # (`timing_budget:`) that goes here when this one has been ruled in or out.
    long_range: ${tof_long_range}
    # WHY THE PUBLISHED VALUE IS FILTERED BUT THE DEBOUNCE IS NOT
    # There is no target in range most of the time on a bedside table, and the
    # component reports that in two different ways: NaN when the target is past
    # ~8.19m, and a sub-minimum number (0, or a few cm) when a measurement did
    # not resolve, because it publishes the range register without consulting the
    # range-status byte next to it. Raw, that is an entity alternating between
    # 'unknown' and 0.03m 4x a second. The debounce below still needs those
    # samples - and needs to tell the two apart, which the entity does not - so
    # the two paths are split: filters clean up what the entity sees, and the
    # debounce hangs off on_raw_value, upstream of them.
    filters:
      # Collapse both "nothing usable" encodings into one. "No target" is a fact,
      # not an absence of one - publish it as a distance past anything this
      # sensor can legitimately see. The DEBOUNCE does not do this: to it the two
      # encodings mean different things (see the classifier below).
      - lambda: |-
          return (std::isnan(x) || x <= ${tof_min_valid_m}f) ? ${tof_no_target_m}f : x;
      # With no-target pinned to a constant, an idle sensor now publishes the
      # same number forever. Only forward real movement - HA retains the last
      # state, and nothing on-device reads knob_distance.state.
      - delta: ${tof_publish_delta_m}
      # ...but a sensor that has stopped reporting ALSO holds its last state
      # forever, so with the delta alone those two look identical and the entity
      # cannot tell you which one you have. That is exactly the hole this fell
      # into: a permanent 2.00m reading was read as "the sensor is dead" when it
      # equally means "alive, nothing in front of it". The heartbeat re-sends the
      # last value on a slow tick, so the entity's LAST-UPDATED time is now the
      # liveness signal - ticking = alive, stuck = the component failed at setup
      # or is not being polled.
      - heartbeat: ${tof_heartbeat}
    # Fires on every sample, before the filters above - NaN included.
    on_raw_value:
      - lambda: |-
          // Debounce in BOTH axes before believing "a hand is here":
          //   * distance hysteresis - it takes tof_near_m to assert but
          //     tof_far_m to release, so a hand hovering at the boundary does
          //     not chatter;
          //   * consecutive samples - assert on tof_confirm_samples, release on
          //     tof_release_samples (slower to release, so one dropped reading
          //     cannot blink the pixel).
          //
          // THIS IS THE RAW VALUE, AND IT HAS THREE MEANINGS, NOT TWO. A sample
          // is near, far, or UNRESOLVED, and the third one is why hovering used
          // to be unreliable:
          //
          //   NaN            the chip saw >=8190mm. Nothing is there. That is
          //                  real evidence, and it counts as FAR.
          //   <= min_valid   0, or a few centimetres, from a measurement that
          //                  failed. The component publishes the range register
          //                  without checking the range-status byte beside it,
          //                  so a failure arrives dressed as a distance. It is
          //                  neither a target nor proof of an empty room, so it
          //                  is IGNORED - the counters are left exactly as they
          //                  were and the next real sample continues the run.
          //
          // Both used to fall through to "far" together. One junk reading in the
          // middle of a hover therefore reset the confirm counter, and since
          // asserting needs tof_confirm_samples in a row, the assert often never
          // happened. Ignoring them costs nothing when they are rare and is
          // leashed by tof_invalid_hold_samples when they are not.
          float distance_m = x;
          const bool resolved = std::isnan(distance_m) ||
                                distance_m > ${tof_min_valid_m}f;
          if (!resolved) {
            // Unresolved. Ignore it - unless they keep coming, in which case
            // something is sitting on the sensor and "far" is the safe verdict.
            if (++id(hand_invalid_count) < ${tof_invalid_hold_samples}) return;
            id(hand_invalid_count) = ${tof_invalid_hold_samples};
            distance_m = NAN;                       // fall through as "far"
          } else {
            id(hand_invalid_count) = 0;
          }

          float threshold = id(hand_near) ? ${tof_far_m}f : ${tof_near_m}f;
          // Every comparison against NaN is false, so a genuine no-target
          // reading lands in the "far" branch by design.
          bool near_now = (distance_m > ${tof_min_valid_m}f) &&
                          (distance_m < ${tof_max_valid_m}f) &&
                          (distance_m <= threshold);

          // Counters are clamped at their thresholds rather than left to climb:
          // nothing reads them past that, and an unbounded counter on a sensor
          // ticking 4x a second forever is just an overflow waiting to happen.
          const bool was_near = id(hand_near);
          if (near_now) {
            id(hand_far_count) = 0;
            if (++id(hand_near_count) >= ${tof_confirm_samples}) {
              id(hand_near_count) = ${tof_confirm_samples};
              id(hand_near) = true;
            }
          } else {
            id(hand_near_count) = 0;
            if (++id(hand_far_count) >= ${tof_release_samples}) {
              id(hand_far_count) = ${tof_release_samples};
              id(hand_near) = false;
            }
          }

          // Edge-triggered, not level-triggered: the handler runs twice per
          // hand, not four times a second forever.
          if (id(hand_near) != was_near) id(on_hand_near_changed)->execute();

binary_sensor:
  # Exposed mainly so the thresholds can be sanity-checked from Home Assistant:
  # wave a hand and watch this flip. Reads the debounced global, so it costs no
  # extra I2C.
  - platform: template
    name: "Knob Proximity"
    id: knob_proximity
    device_class: presence
    lambda: 'return id(hand_near);'
