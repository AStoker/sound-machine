# =====================================================================
# HARDWARE: VL53L0X time-of-flight sensor (I2C)  [layer: hw]
#
# Mounted on the crown just right of the knob, looking up (see HARDWARE.md).
# Reports METRES. Its whole job is answering one question - "is a hand over the
# knob?" - which is hardware interpretation, so the debounce lives here. What to
# DO about a nearby hand is policy and lives in behavior/sound.yaml, with the rest
# of the knob's behaviour.
#
# NOTHING DEPENDS ON THIS SENSOR. If the board is absent or unwired the component
# marks itself failed at setup, publishes nothing, hand_near stays false, and
# every other feature carries on unchanged. Dropping this package from the
# manifest is likewise safe: on_hand_near_changed simply never fires.
#
# INPUT EVENT RAISED
#   on_hand_near_changed  - fired only on a genuine transition. Read hand_near
#                           for the new verdict.
#
# The published entity never reports NaN: "no target in range" - the sensor's
# resting state - becomes tof_no_target_m instead, so it cannot show as
# 'unknown' in Home Assistant. See the filters block for why the debounce
# doesn't go through them.
#
# ---------------------------------------------------------------------
# WHAT THIS SENSOR ACTUALLY MEASURES, AND WHY THE VERDICT IS NOT A DISTANCE
#
# It is not measuring the room. In this enclosure it measures a fixed 0.024 m,
# forever, four times a second - MEASURED over minutes: every sample between
# 0.020 and 0.030, sd about 0.0015. There is nothing 24 mm above the crown. That
# number is OPTICAL CROSSTALK: the emitter and the receiver share one 3.5 mm
# pinhole through the crown (TOF_HOLE_D in 3d-print/enclosure_geom.py) with no
# barrier between them, so some of the emitted light reaches the receiver
# straight off the bore and the chip ranges its own aperture. ST's guidance is a
# larger opening and a light-tight septum between the two windows; 3.5 mm shared
# is below it. That is a print change, tracked as H4 in FUTURE-DEVELOPMENT.md.
#
# So the absolute reading is meaningless AND the deviation from it is not: a hand
# over the pinhole changes what comes back. From the same log - idle 0.024, hand
# approaching 0.036 / 0.046, hand held over the knob 0.011-0.019, hand leaving
# 0.028-0.038. Ten to twenty millimetres of swing against 1.5 of noise.
#
# >>> AND THE SWING IS NOT MONOTONIC. A hand hovering HIGH reads HIGH (0.030 to
# >>> 0.049, and it does track height in that band); a hand right on the knob
# >>> reads LOW (0.010-0.020). What comes back is a signal-weighted blend of the
# >>> phantom aperture return and the real one, so as a hand descends the reading
# >>> rises, then falls back THROUGH the idle baseline on its way down.
# >>>
# >>> That crossing is why releasing is slow. For three or four samples in the
# >>> middle of a real gesture the deviation is ~0, which is exactly what an empty
# >>> room looks like to a test built on |deviation|. tof_release_samples (2s) is
# >>> sized to bridge it - measured, then confirmed by replaying the log. Shorten
# >>> it and the pixel drops out halfway through every reach.
#
# THIS FILE THEREFORE DETECTS CHANGE, NOT RANGE. It learns the quiet-room reading
# as a slow EMA and calls "hand near" when a sample departs from it by more than
# tof_deviation_near_m. Consequences worth knowing before trusting it:
#   * It cannot tell you HOW FAR a hand is, only that one is there. There is no
#     threshold in metres to tune any more, because no reading is in metres.
#   * The baseline only learns from samples that already look quiet, so a hand
#     resting over the knob cannot be absorbed into it.
#   * Anything permanently parked over the pinhole becomes the new normal within
#     about a minute. That is the intended behaviour, not a bug.
#   * FIX THE PINHOLE AND THIS SHOULD BE REPLACED with plain distance
#     thresholds - it is a workaround for a hole, and it is only worth its
#     complexity while that hole is 3.5 mm.
#
# DEFINES  knob_distance (sensor), knob_proximity (binary_sensor),
#          hand_near + hand_baseline_m (globals) + the sample counters.
# CONSUMES internal_i2c (device core), the tof_* settings.
# REQUIRES script on_hand_near_changed (behavior/sound.yaml).
# =====================================================================
globals:
  # The debounced verdict. This, not the raw distance, is what consumers read.
  - id: hand_near
    type: bool
    restore_value: no
    initial_value: 'false'
  # Consecutive-sample counters behind hand_near.
  - id: hand_near_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: hand_far_count
    type: int
    restore_value: no
    initial_value: '0'
  # Consecutive UNUSABLE readings. Not a third verdict - just the leash on how
  # long such a sample may be ignored before it is treated as "far".
  - id: hand_invalid_count
    type: int
    restore_value: no
    initial_value: '0'
  # The quiet-room reading, learned at runtime. This is the number every verdict
  # is measured AGAINST - see "WHAT THIS SENSOR ACTUALLY MEASURES" above. Not
  # persisted: it is cheap to relearn and it tracks a physical state (what is in
  # front of the pinhole) that a reboot cannot vouch for.
  - id: hand_baseline_m
    type: float
    restore_value: no
    initial_value: '0.0'
  # Samples taken since boot, capped at the warm-up length. Until the baseline
  # has settled, no deviation means anything.
  - id: hand_warmup_count
    type: int
    restore_value: no
    initial_value: '0'

sensor:
  - platform: vl53l0x
    id: knob_distance
    name: "Knob Distance"
    address: ${i2c_addr_tof}
    update_interval: ${tof_update_interval}
    # 3, not the component's default of 2. At 2 decimals every reading this
    # sensor produces displays as "0.02" or "0.03" - the idle baseline and a hand
    # right on the knob round to the SAME NUMBER. The third decimal is where the
    # entire signal lives here.
    accuracy_decimals: 3
    # Left at the component's defaults. Long range and an explicit timing budget
    # are the sensitivity levers, and they are pointless while the pinhole
    # dominates the return - a more sensitive receiver just hears the crosstalk
    # better. Revisit them WITH the enclosure fix (H4), not before.
    long_range: ${tof_long_range}
    # WHY THE PUBLISHED VALUE IS FILTERED BUT THE DEBOUNCE IS NOT
    # The entity is for a human watching Home Assistant; the debounce needs every
    # sample and needs to tell apart things the entity flattens together - a
    # failed measurement (the component publishes the range register without
    # consulting the range-status byte next to it, so a failure arrives dressed
    # as a distance) from a genuine >=8190mm NaN. So the two paths are split:
    # filters clean up what the entity sees, and the debounce hangs off
    # on_raw_value, upstream of them.
    filters:
      # Collapse both "nothing usable" encodings into one. "No target" is a fact,
      # not an absence of one - publish it as a distance past anything this
      # sensor can legitimately see.
      - lambda: |-
          return (std::isnan(x) || x <= ${tof_min_valid_m}f) ? ${tof_no_target_m}f : x;
      # Only forward real movement - HA retains the last state, and nothing
      # on-device reads knob_distance.state. Note this is a 2mm delta against a
      # reading that idles at 24mm: the entity is now a usable picture of the
      # crosstalk baseline and what a hand does to it.
      - delta: ${tof_publish_delta_m}
      # ...but a sensor that has stopped reporting ALSO holds its last state
      # forever, so with the delta alone those two look identical and the entity
      # cannot tell you which one you have. That is exactly the hole this fell
      # into: a permanent 2.00m reading was read as "the sensor is dead" when it
      # equally means "alive, nothing in front of it". The heartbeat re-sends the
      # last value on a slow tick, so the entity's LAST-UPDATED time is now the
      # liveness signal - ticking = alive, stuck = the component failed at setup
      # or is not being polled.
      - heartbeat: ${tof_heartbeat}
    # Fires on every sample, before the filters above - NaN included.
    on_raw_value:
      - lambda: |-
          // Three guards before believing "a hand is here", in this order:
          //   * usability   - the sample has to be a number the chip could have
          //                   produced at all;
          //   * DEVIATION from the learned baseline, with hysteresis - it takes
          //     tof_deviation_near_m to assert but only tof_deviation_far_m to
          //     stay asserted, so a hand at the boundary does not chatter;
          //   * consecutive samples - assert on tof_confirm_samples, release on
          //     tof_release_samples (slower to release, so one odd reading
          //     cannot blink the pixel).
          //
          // The verdict is on the CHANGE, not the distance. See the header: in
          // this enclosure the chip ranges its own pinhole at a fixed ~0.024m, so
          // there is no distance here to compare against a threshold in metres.
          //
          // WHAT COUNTS AS UNUSABLE - and it is not "small". Small is normal
          // here; a hand pushes the reading DOWN to 0.011-0.019. Only two things
          // are unusable: a NaN (the chip reported >=8190mm, so the crosstalk
          // return it always sees was itself lost - something is very wrong), and
          // a reading beyond tof_max_valid_m for the same reason. Both are
          // IGNORED rather than treated as "far": the counters are left exactly
          // as they were, so one dropped sample mid-hover no longer resets the
          // run of consecutive near readings that asserting depends on.
          float distance_m = x;
          const bool usable = !std::isnan(distance_m) &&
                              distance_m > ${tof_min_valid_m}f &&
                              distance_m < ${tof_max_valid_m}f;
          if (!usable) {
            // Ignore it - unless they keep coming, in which case the sensor is
            // not telling us anything and "far" is the safe verdict. Falling
            // through AS THE BASELINE is how that is expressed: zero deviation
            // is exactly what "nobody is there" looks like to the test below.
            if (++id(hand_invalid_count) < ${tof_invalid_hold_samples}) return;
            id(hand_invalid_count) = ${tof_invalid_hold_samples};
            distance_m = id(hand_baseline_m);
          } else {
            id(hand_invalid_count) = 0;
          }

          // Learn the quiet-room reading before judging anything against it. The
          // first sample seeds it outright - starting from 0 would read as a
          // 24mm deviation and fire the pixel at every boot - and the warm-up
          // then lets the EMA settle before any verdict is allowed.
          if (id(hand_warmup_count) < ${tof_baseline_warmup_samples}) {
            id(hand_baseline_m) = (id(hand_warmup_count) == 0)
                ? distance_m
                : id(hand_baseline_m) +
                  ${tof_baseline_alpha}f * (distance_m - id(hand_baseline_m));
            id(hand_warmup_count)++;
            return;
          }

          const float deviation = fabsf(distance_m - id(hand_baseline_m));
          const float threshold = id(hand_near) ? ${tof_deviation_far_m}f
                                                : ${tof_deviation_near_m}f;
          const bool near_now = deviation >= threshold;

          // THE BASELINE ONLY LEARNS FROM QUIET SAMPLES. Updating it on every
          // reading would let a hand held over the knob become the new normal
          // within a few seconds, and the pixel would go out with the hand still
          // there. Gating on near_now means the drift it does track is the slow
          // kind - temperature, a moved object - which is the only kind there is
          // when nothing is happening.
          if (!near_now)
            id(hand_baseline_m) += ${tof_baseline_alpha}f *
                                   (distance_m - id(hand_baseline_m));

          // Counters are clamped at their thresholds rather than left to climb:
          // nothing reads them past that, and an unbounded counter on a sensor
          // ticking 4x a second forever is just an overflow waiting to happen.
          const bool was_near = id(hand_near);
          if (near_now) {
            id(hand_far_count) = 0;
            if (++id(hand_near_count) >= ${tof_confirm_samples}) {
              id(hand_near_count) = ${tof_confirm_samples};
              id(hand_near) = true;
            }
          } else {
            id(hand_near_count) = 0;
            if (++id(hand_far_count) >= ${tof_release_samples}) {
              id(hand_far_count) = ${tof_release_samples};
              id(hand_near) = false;
            }
          }

          // Edge-triggered, not level-triggered: the handler runs twice per
          // hand, not four times a second forever.
          if (id(hand_near) != was_near) id(on_hand_near_changed)->execute();

binary_sensor:
  # Exposed mainly so the thresholds can be sanity-checked from Home Assistant:
  # wave a hand and watch this flip. Reads the debounced global, so it costs no
  # extra I2C.
  - platform: template
    name: "Knob Proximity"
    id: knob_proximity
    device_class: presence
    lambda: 'return id(hand_near);'
