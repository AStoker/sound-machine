# =====================================================================
# BEHAVIOR: sound, media, and the knob  [layer: behavior]
#
# What the device DOES about sound: which colours exist, what a knob turn means,
# what a tap means, that noise and media are mutually exclusive, and what the user
# gets told about it. All of it expressed in api verbs - this file contains no
# hardware access.
#
# THE SELECT IS THE STATE. The "Sound" select is the single place a sound change
# happens, and its option INDEX is the state: 0 = Off, and 1..N are the noise
# colours in the order the generator numbers them (index - 1 IS the colour index
# the api takes). Everything else - a knob tap, a long press, the boot restore,
# Home Assistant - drives that select and lets it do the work, which is why the
# code flash and the mutual exclusion live in one place and are guaranteed to run
# whatever triggered the change.
#
# Reading the order off the option list is what keeps it honest: the cycle used to
# be a hand-written chain of "White -> Pink, Pink -> Brown, Brown -> White" that
# had to silently agree with the list, and the set_action mapped each name to a
# colour number and a display code by hand. Both are now arithmetic on the index.
#
# ADDING A COLOUR: add an option, in the generator's numbering order. Nothing else.
#
# IMPLEMENTS the hardware input contract from hw/knob.yaml:
#   on_knob_turn(clicks) / on_knob_tap / on_knob_hold
# and from hw/proximity.yaml:
#   on_hand_near_changed
# and from api/sound.yaml:
#   on_audio_ready
#
# DEFINES  sound_option, sound_option_last (globals), sound_select, media_select,
#          media_loop, sound_next, sound_off, volume_feedback,
#          indicator_hue_from_volume, and the event handlers above.
# CONSUMES api/sound (noise_play, noise_stop, media_*, volume_apply),
#          api/display (display_show_code), api/indicator (set_hue, flash,
#          glow_set), and reads external_media_player->volume + hand_near.
# =====================================================================
globals:
  # The current selection as an option INDEX, persisted. This - not the select's
  # own index - is what survives a reboot, because reading a select's state from a
  # lambda at boot is unreliable and the restore path needs it before the entity
  # has settled. Once running, the select is the live state and this follows it.
  - id: sound_option
    type: int
    restore_value: yes
    initial_value: '0'          # Off
  # Last non-off sound, so turning sound back on resumes what was playing rather
  # than always starting at White.
  - id: sound_option_last
    type: int
    restore_value: yes
    initial_value: '1'          # White

script:
  # ---- knob: rotation = volume ----
  - id: on_knob_turn
    parameters:
      clicks: int
    then:
      - lambda: |-
          const float current = id(external_media_player)->volume;
          // Bigger steps when quiet, finer when loud, so the usable range is not
          // crossed in three clicks near the bottom.
          const float step = ${volume_step_at_zero}f - ${volume_step_falloff}f * current;
          // MINUS the delta: that is what makes clockwise mean louder on this
          // encoder. Flip the sign here if the knob is wired the other way round -
          // it is the only place the direction is decided. volume_apply clamps.
          id(volume_apply)->execute(current - clicks * step);
      - script.execute: volume_feedback

  # ---- knob: press = sound ----
  - id: on_knob_tap
    then:
      - script.execute: sound_next
  - id: on_knob_hold
    then:
      - script.execute: sound_off

  # ---- proximity: pre-light the knob so it can be found in the dark ----
  # The hue is refreshed first: a glow can be the FIRST thing that ever lights the
  # pixel (nobody has touched the volume since boot), and it should still show the
  # current volume's colour rather than the initial one.
  - id: on_hand_near_changed
    then:
      - script.execute: indicator_hue_from_volume
      - script.execute:
          id: indicator_glow_set
          enabled: !lambda 'return id(hand_near);'

  # The one place volume is turned into a colour: hue 240 (blue) when quiet,
  # through 120 (green), to 0 (red) at full. The player reports volume as a plain
  # 0..1 fraction (its volume_min/volume_max remap only what reaches the speaker),
  # so there is nothing to clamp on the way in.
  - id: indicator_hue_from_volume
    then:
      - lambda: |-
          id(indicator_set_hue)->execute(240.0f * (1.0f - id(external_media_player)->volume));

  # ---- boot: re-apply the sound that was playing before the reboot ----
  # Raised by api/sound.yaml once the audio stack is safe to drive. Goes through
  # the select so the entity in Home Assistant agrees with what is playing.
  - id: on_audio_ready
    then:
      - select.set_index:
          id: sound_select
          index: !lambda 'return id(sound_option);'

  # ---- the two sound gestures ----
  # Tap: advance Off -> (last sound) -> the next colour -> ... wrapping among the
  # colours. From Off it RESUMES rather than restarting the cycle; Off is index 0
  # and reachable only by a hold.
  - id: sound_next
    then:
      - lambda: |-
          auto *select = id(sound_select);
          const size_t colours = select->size() - 1;       // every option except Off
          const size_t current = select->active_index().value_or(0);
          const size_t next = (current == 0) ? (size_t) id(sound_option_last)
                                            : (current % colours) + 1;
          select->make_call().set_index(next).perform();
  # Long press: silence.
  - id: sound_off
    then:
      - select.set_index:
          id: sound_select
          index: 0

  # ---- user feedback for a volume change ----
  # Two channels, both shared with the rest of the device: the knob pixel takes a
  # hue and a flash, and the volume percentage goes out as a display code. Neither
  # call knows what hardware is on the other end.
  - id: volume_feedback
    then:
      - script.execute: indicator_hue_from_volume
      - script.execute: indicator_flash
      - lambda: |-
          const float volume = id(external_media_player)->volume;
          id(display_show_code)->execute(std::to_string((int) lroundf(volume * 100.0f)));

select:
  # SOUND = Off plus the noise colours, IN THE GENERATOR'S NUMBERING ORDER, so
  # (index - 1) is the colour index api/sound.yaml takes and index is the "S<n>"
  # code shown on the display. Replaces what used to be an on/off switch and a
  # separate type select.
  - platform: template
    name: "Sound"
    id: sound_select
    icon: "mdi:waveform"
    optimistic: true
    restore_value: false          # persistence lives in the sound_option global
    initial_option: "Off"
    options:
      - "Off"                     # 0
      - "White"                   # 1 -> noise colour 0
      - "Pink"                    # 2 -> noise colour 1
      - "Brown"                   # 3 -> noise colour 2
    set_action:
      - lambda: |-
          // index_of(x), not active_index(): the select has not published the new
          // option yet at this point in the call.
          const auto slot = id(sound_select)->index_of(x);
          if (!slot.has_value()) return;
          const size_t choice = *slot;

          id(sound_option) = (int) choice;                 // remember (persisted)
          if (choice == 0) {
            id(noise_stop)->execute();
            id(display_show_code)->execute("OFF");
            return;
          }
          id(sound_option_last) = (int) choice;            // the last real one
          id(noise_play)->execute((int) choice - 1);
          id(display_show_code)->execute("S" + std::to_string(choice));

          // Noise and media are mutually exclusive: turning ON a colour stops any
          // playing media and syncs the Media Preset select to Off. publish_state
          // (not a select call) so it does not re-enter the media set_action or
          // flash a second code - it just updates the shown state.
          id(media_stop)->execute();
          id(media_select).publish_state("Off");

  # MEDIA PRESET = Off plus the playable tracks. Each track is either a file
  # flashed into the ESP (offline-capable) or a URL played to the same media
  # player. Looping follows the Media Loop switch. Stop with "Off" here or with
  # the media player controls in Home Assistant.
  #
  # Not index-driven like the Sound select above, because a track is not a number:
  # each one needs its own api verb (a media_file id cannot be a script parameter)
  # so the branch per option is irreducible.
  - platform: template
    name: "Media Preset"
    id: media_select
    icon: "mdi:music"
    optimistic: true
    restore_value: false
    initial_option: "Off"
    options:
      - "Off"
      - "La La"
      - "Crickets"
      # - "Rain (HA)"      # example URL-based track (see the commented branch)
    set_action:
      # The other half of the mutual exclusion. sound_option_last is left intact,
      # so a later knob tap can still resume the previous colour.
      - if:
          condition:
            lambda: 'return x != "Off";'
          then:
            - script.execute: noise_stop
            - lambda: |-
                id(sound_option) = 0;                      // Off
                id(sound_select).publish_state("Off");
      - if:
          condition:
            lambda: 'return x == "Off";'
          then:
            - script.execute: media_stop
      - if:
          condition:
            lambda: 'return x == "La La";'
          then:
            - script.execute:
                id: media_set_repeat
                loop: !lambda 'return id(media_loop).state;'
            - script.execute: media_play_la_la
      # A 61s loop bed, so it is meant to be heard with Media Loop ON - one pass
      # is not a sound machine. The seam is whatever gap the MP3 decoder leaves
      # at end-of-file; the clip's head and tail levels are within 0.5 dB of each
      # other, so nothing else calls attention to the wrap.
      - if:
          condition:
            lambda: 'return x == "Crickets";'
          then:
            - script.execute:
                id: media_set_repeat
                loop: !lambda 'return id(media_loop).state;'
            - script.execute: media_play_crickets
      # ----- URL / Home Assistant track (uncomment + edit to use) -----
      # Add the option name above, then a branch here. A URL track needs a real
      # network path, so it is not offline-capable the way a flashed file is.
      # - if:
      #     condition:
      #       lambda: 'return x == "Rain (HA)";'
      #     then:
      #       - script.execute:
      #           id: media_set_repeat
      #           loop: !lambda 'return id(media_loop).state;'
      #       - media_player.play_media:
      #           id: external_media_player
      #           media_url: "http://homeassistant.local:8123/local/rain.mp3"

switch:
  # Loop mode for MEDIA tracks (on = repeat, off = play once). Read by the Media
  # Preset select and by anything triggered from Home Assistant.
  - platform: template
    name: "Media Loop"
    id: media_loop
    icon: "mdi:repeat"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
