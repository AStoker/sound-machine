# =====================================================================
# BEHAVIOR: sound, media, and the knob  [layer: behavior]
#
# What the device DOES about sound: which colours exist, what a knob turn means,
# what a tap means, that noise and media are mutually exclusive, and what the user
# gets told about it. All of it expressed in api verbs - this file contains no
# hardware access.
#
# THE SELECT IS THE STATE. The "Sound" select is the single place a sound change
# happens, and its option INDEX is the state: 0 = Off, then the noise colours in
# the order the generator numbers them (index - 1 IS the colour index the api
# takes), then the flashed tracks. Everything else - a knob tap, a long press, the
# boot restore, Home Assistant - drives that select and lets it do the work, which
# is why the code flash and the mutual exclusion live in one place and are
# guaranteed to run whatever triggered the change.
#
# ONE LIST, BOTH KINDS. Noise and tracks used to be separate selects that kept
# each other Off by publishing into one another; now they are options in the same
# list and only one option can be selected, so the exclusion is structural rather
# than a protocol two set_actions have to keep observing. A knob tap therefore
# walks the whole list - White, Pink, Brown, La La, Crickets - and a track, like a
# colour, resumes after a reboot.
#
# Reading the order off the option list is what keeps it honest: the cycle used to
# be a hand-written chain of "White -> Pink, Pink -> Brown, Brown -> White" that
# had to silently agree with the list, and the set_action mapped each name to a
# colour number and a display code by hand. Both are now arithmetic on the index.
#
# ADDING A COLOUR: add an option after the last colour, in the generator's
# numbering order. Nothing else.
# ADDING A FLASHED SOUND: add it to `audio_file:` and `ambience_player.files:` in
# hw/audio_chain.yaml with a `name:`, then add that same name as an option here.
# No api verb and no second list - ambience_play takes the name, and this file
# asks the component whether an option is an ambience. Mono 48 kHz MP3 only; the
# format rules are in sounds/README.md.
#
# IMPLEMENTS the hardware input contract from hw/knob.yaml:
#   on_knob_turn(clicks) / on_knob_tap / on_knob_hold
# and from hw/proximity.yaml:
#   on_hand_near_changed
# and from api/sound.yaml:
#   on_audio_ready
#
# DEFINES  sound_option, sound_option_last (globals), sound_select,
#          sound_next, sound_off, volume_feedback,
#          indicator_hue_from_volume, and the event handlers above.
# CONSUMES api/sound (noise_play, noise_stop, media_*, volume_apply),
#          api/display (display_show_code), api/indicator (set_hue, flash,
#          glow_set), and reads external_media_player->volume + hand_near.
# =====================================================================
globals:
  # The current selection as an option INDEX, persisted. This - not the select's
  # own index - is what survives a reboot, because reading a select's state from a
  # lambda at boot is unreliable and the restore path needs it before the entity
  # has settled. Once running, the select is the live state and this follows it.
  - id: sound_option
    type: int
    restore_value: yes
    initial_value: '0'          # Off
  # Last non-off sound, so turning sound back on resumes what was playing rather
  # than always starting at White.
  - id: sound_option_last
    type: int
    restore_value: yes
    initial_value: '1'          # White

script:
  # ---- knob: rotation = volume ----
  - id: on_knob_turn
    parameters:
      clicks: int
    then:
      - lambda: |-
          const float current = id(external_media_player)->volume;
          // FINER STEPS WHEN QUIET, coarser when loud. The fraction this walks is
          // linear in decibels all the way to the codec (the arithmetic is in
          // settings.yaml section 6), so the quiet end does not need bigger
          // numbers to be audible - it needs smaller ones, to place a whisper.
          const float step = ${volume_step_at_zero}f +
                             (${volume_step_at_full}f - ${volume_step_at_zero}f) * current;
          // MINUS the delta: that is what makes clockwise mean louder on this
          // encoder. Flip the sign here if the knob is wired the other way round -
          // it is the only place the direction is decided. volume_apply clamps.
          id(volume_apply)->execute(current - clicks * step);
      - script.execute: volume_feedback

  # ---- knob: press = sound ----
  - id: on_knob_tap
    then:
      - script.execute: sound_next
  - id: on_knob_hold
    then:
      - script.execute: sound_off

  # ---- proximity: pre-light the knob so it can be found in the dark ----
  # The hue is refreshed first: a glow can be the FIRST thing that ever lights the
  # pixel (nobody has touched the volume since boot), and it should still show the
  # current volume's colour rather than the initial one.
  - id: on_hand_near_changed
    then:
      - script.execute: indicator_hue_from_volume
      - script.execute:
          id: indicator_glow_set
          enabled: !lambda 'return id(hand_near);'

  # The one place volume is turned into a colour: hue 240 (blue) when quiet,
  # through 120 (green), to 0 (red) at full. The player reports volume as a plain
  # 0..1 fraction (its volume_min/volume_max remap only what reaches the speaker),
  # so there is nothing to clamp on the way in.
  - id: indicator_hue_from_volume
    then:
      - lambda: |-
          id(indicator_set_hue)->execute(240.0f * (1.0f - id(external_media_player)->volume));

  # ---- boot: re-apply the sound that was playing before the reboot ----
  # Raised by api/sound.yaml once the audio stack is safe to drive. Goes through
  # the select so the entity in Home Assistant agrees with what is playing.
  - id: on_audio_ready
    then:
      - select.set_index:
          id: sound_select
          index: !lambda 'return id(sound_option);'

  # ---- the two sound gestures ----
  # Tap: advance Off -> (last sound) -> the next sound -> ... wrapping among every
  # sound there is, colours and ambiences alike. The "Off at 0, resume from Off"
  # model is shared with the Crescent Preset select and lives in one place -
  # shared_helpers::cycle_to_next_option, which documents it.
  - id: sound_next
    then:
      - lambda: 'shared_helpers::cycle_to_next_option(id(sound_select), id(sound_option_last));'
  # Long press: silence.
  - id: sound_off
    then:
      - select.set_index:
          id: sound_select
          index: 0

  # ---- user feedback for a volume change ----
  # Two channels, both shared with the rest of the device: the knob pixel takes a
  # hue and a flash, and the volume percentage goes out as a display code. Neither
  # call knows what hardware is on the other end.
  - id: volume_feedback
    then:
      - script.execute: indicator_hue_from_volume
      - script.execute: indicator_flash
      - lambda: |-
          const float volume = id(external_media_player)->volume;
          id(display_show_code)->execute(std::to_string((int) lroundf(volume * 100.0f)));

select:
  # SOUND = Off, then the noise colours IN THE GENERATOR'S NUMBERING ORDER, then
  # the flashed ambiences IN `ambience_player.files:` ORDER. One list holding both kinds,
  # because only one of them can ever be playing.
  #
  # THAT IS THE POINT OF MERGING THEM. This used to be two selects - Sound and
  # Media Preset - that enforced mutual exclusion by publishing "Off" into each
  # other, each set_action having to remember to stop the other subsystem and to
  # use publish_state rather than a real call so it did not re-enter the other's
  # action and flash a second display code. A select already holds exactly one
  # option; making it hold ALL the sounds turns that whole protocol into a fact
  # about the data structure. It also means one knob tap walks the entire list -
  # White, Pink, Brown, La La, Crickets - which is what the gesture always
  # implied.
  #
  # The index is still the state, and still does double duty: it is the "S<n>"
  # code on the display, and for a colour it is (index - 1) = the colour number
  # api/sound.yaml takes.
  - platform: template
    name: "Sound"
    id: sound_select
    icon: "mdi:waveform"
    optimistic: true
    restore_value: false          # persistence lives in the sound_option global
    initial_option: "Off"
    options:
      - "Off"                     # 0
      - "White"                   # 1 -> noise colour 0
      - "Pink"                    # 2 -> noise colour 1
      - "Brown"                   # 3 -> noise colour 2
      - "La La"                   # 4 -> track 0
      - "Crickets"                # 5 -> track 1
      # - "Rain (HA)"      # example URL-based track (see the commented branch)
    set_action:
      - lambda: |-
          // index_of(x), not active_index(): the select has not published the new
          // option yet at this point in the call.
          const auto slot = id(sound_select)->index_of(x);
          if (!slot.has_value()) return;
          const size_t choice = *slot;

          id(sound_option) = (int) choice;                 // remember (persisted)
          if (choice == 0) {
            id(noise_stop)->execute();
            id(ambience_stop)->execute();
            id(media_stop)->execute();
            id(display_show_code)->execute("OFF");
            return;
          }
          id(sound_option_last) = (int) choice;            // the last real one
          id(display_show_code)->execute("S" + std::to_string(choice));

          // WHICH KIND OF SOUND IS THIS? Ask the component that owns the flashed
          // files. `ambience_player.files:` names every ambience there is, so an
          // option it recognises IS one and everything else is a noise colour.
          // This file therefore keeps NO list of its own to drift out of sync -
          // the option list above is the only thing here that has to agree with
          // hw/audio_chain.yaml, and it agrees by name rather than by position.
          //
          // Both branches stop the other two sources. media_stop is one of them
          // even though no flashed sound goes through the player any more: Home
          // Assistant can be streaming something at it, and this select means
          // "one sound at a time" regardless of who started it.
          if (id(ambience)->has(x)) {
            id(noise_stop)->execute();
            id(media_stop)->execute();
            // Switching from one ambience to another does not even stop the
            // mixer source; there is no repeat flag and no wait to arbitrate.
            id(ambience_play)->execute(x);
            return;
          }

          // A noise colour. Its number is its position: the colours run from
          // option 1 in the generator's own numbering order, so option n is
          // colour n - 1.
          id(ambience_stop)->execute();
          id(media_stop)->execute();
          id(noise_play)->execute((int) choice - 1);
      # ----- ADDING A SOUND -----
      # A flashed AMBIENCE (the normal case): add the file to `audio_file:` and a
      # `name:`/`file:` pair to `ambience_player.files:` in hw/audio_chain.yaml, then
      # add that SAME name as an option above. No new verb, no second list. The
      # file must be mono 48 kHz MP3 - see sounds/README.md.
      #
      # A URL sound is possible but is NOT an ambience - it streams through the
      # media player, needs the network, and must not be looped
      # (FUTURE-DEVELOPMENT T3/T4/T5). It would need its own branch above the
      # ambience check:
      #   if (x == "Rain (HA)") {
      #     id(noise_stop)->execute();
      #     id(ambience_stop)->execute();
      #     id(external_media_player)->make_call()
      #       .set_media_url("http://homeassistant.local:8123/local/rain.mp3")
      #       .perform();
      #     return;
      #   }
