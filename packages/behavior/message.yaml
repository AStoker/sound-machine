# =====================================================================
# BEHAVIOR: the Home Assistant authored message  [layer: behavior]
#
# Type a string in Home Assistant, press a button, and it appears on the display
# for a configurable time, scrolling if it does not fit. Four entities and no
# state of its own: the button reads the other three and hands the text to
# api/display.yaml's message channel.
#
# NOTHING IS MIRRORED INTO A GLOBAL. An earlier version kept a
# `display_message_pending` global holding a filtered copy of the text and a
# `display_message_duration_s` global shadowing the (already persisted) number
# entity, each maintained by a set_action. Both were second copies of state the
# entities already hold, so they could disagree; the button reads the entities.
#
# NEITHER IS THE TEXT FILTERED. It used to be folded to upper case and screened
# against an allow-list of drawable characters - a list the comment admitted was
# a copy of the glyph tables in hw/matrix.yaml. That is a driver's business, and
# the driver already does it: hw/matrix.yaml's glyph lookups fold case on entry
# and return a blank for anything they cannot draw. Trimming trailing spaces is
# the one part that mattered (a trailing space still occupies a glyph cell and
# would push centred text off-centre) and that now lives in display_show_message,
# where it applies to whatever is drawing.
#
# The entity NAMES still say "Matrix" for continuity: renaming them would change
# their Home Assistant entity_ids and break anyone's dashboard or automation.
#
# DEFINES  display_message_input, display_message_duration, display_scroll_speed,
#          display_message_show.
# CONSUMES api/display (display_show_message, display_set_scroll_speed).
# =====================================================================
text:
  - platform: template
    name: "Matrix Message"
    id: display_message_input
    icon: "mdi:message-text-outline"
    optimistic: true
    mode: text
    max_length: 64

number:
  - platform: template
    name: "Matrix Message Duration"
    id: display_message_duration
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: ${display_message_duration_min}
    max_value: ${display_message_duration_max}
    step: 1
    mode: box
    initial_value: ${display_message_duration_default}
    # No set_action: min_value/max_value already bound the entity, and the button
    # reads .state directly, so there is nothing to copy anywhere or re-clamp.

  # Scroll rate for any text too wide for its channel. Owned by api/display.yaml
  # because the driver needs it; this is just the knob for it.
  - platform: template
    name: "Matrix Scroll ms per px"
    id: display_scroll_speed
    icon: "mdi:arrow-left-right"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: ${display_scroll_ms_per_px_min}
    max_value: ${display_scroll_ms_per_px_max}
    step: ${display_scroll_ms_per_px_step}
    mode: box
    initial_value: ${display_scroll_ms_per_px_default}
    set_action:
      - script.execute:
          id: display_set_scroll_speed
          milliseconds: !lambda 'return (int) x;'

button:
  - platform: template
    name: "Show Matrix Message"
    id: display_message_show
    icon: "mdi:message-flash-outline"
    on_press:
      # An empty message is a valid press: it hands "" to the channel, which
      # clears anything currently showing and falls back to the clock.
      - script.execute:
          id: display_show_message
          text: !lambda 'return id(display_message_input).state;'
          seconds: !lambda 'return (int) id(display_message_duration).state;'
