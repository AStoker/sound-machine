# =====================================================================
# BEHAVIOR: what the device says about its power  [layer: behavior]
#
# Two policies, both on top of the two facts hw/power.yaml publishes:
#
#   1. ANNOUNCE a change of power source - "CHG" when the charger goes in,
#      "BATT" when the device starts running off the pack.
#   2. RAISE a sticky low-battery alert, but not while on mains. The alert is a
#      DEFAULT VIEW in api/display.yaml, so it stands in for the clock rather
#      than talking over the machine's other feedback - see that file's header.
#
# ONE HANDLER PER FACT. hw/power.yaml raises a separate event for each sensor, so
# each handler here knows exactly what changed and does not have to work it out.
# An earlier version shared one event between both sensors and paid for it: it
# needed a has_state() guard, a second global remembering the last source it had
# announced, and a paragraph explaining that battery_low settles first (it needs
# only the SOC chain, ~10s, while external_power carries a 30s debounce) and would
# otherwise arm the announce latch with a default power source - announcing "CHG"
# on every mains boot. None of that is needed once the events are separate.
#
# THE FIRST PUBLISH IS STILL SWALLOWED, though. external_power has no state until
# the monitor reports and the debounce settles, so its first publish is "here is
# the power source", not "the power source changed". power_announced is a one-shot
# latch that is never reset, so only genuine transitions after that are announced.
#
# THE ALERT GATES ON external_power, NOT battery_charging. A pack that has
# finished charging tapers to near-zero current and battery_charging correctly
# goes false, which would bring the warning back while still plugged in. See the
# note on the two sensors in hw/power.yaml. battery_low itself has hysteresis;
# mains presence just clears the on-screen nag immediately.
#
# IMPLEMENTS the hardware input contract from hw/power.yaml:
#   on_external_power_changed / on_battery_low_changed
#
# DEFINES  power_announced (global), on_external_power_changed,
#          on_battery_low_changed, power_alert_refresh.
# CONSUMES api/display (display_show_status, display_set_alert), and reads
#          external_power + battery_low (hw/power).
# =====================================================================
globals:
  # Latch: has this device ever seen a settled power state? Blocks the boot-time
  # announcement described above. Never reset.
  - id: power_announced
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # The jack went live or dead. Only reached on a real change, so there is no
  # previous value to compare against and no has_state() to check - the sensor
  # just published.
  - id: on_external_power_changed
    then:
      - lambda: |-
          if (id(power_announced)) {
            id(display_show_status)->execute(
                id(external_power).state ? std::string("${power_msg_mains}")
                                         : std::string("${power_msg_battery}"),
                ${power_msg_seconds});
          }
          id(power_announced) = true;
      # Mains coming back clears the nag; mains going away may raise it.
      - script.execute: power_alert_refresh

  - id: on_battery_low_changed
    then:
      - script.execute: power_alert_refresh

  # Re-evaluate the sticky alert from scratch. Passing "" clears it, so this one
  # call handles both raising and clearing and cannot get out of step with itself -
  # which is what makes it safe to call from either event.
  - id: power_alert_refresh
    then:
      - lambda: |-
          const bool on_mains = id(external_power).has_state() && id(external_power).state;
          const bool warn = id(battery_low).state && !on_mains;
          id(display_set_alert)->execute(warn ? std::string("${alert_msg_low_battery}")
                                              : std::string(""));
