# =====================================================================
# IS31FL3731 CHARLIEPLEX 16x9 MATRIX (I2C) - the ACTIVE clock display
#
# There is NO native ESPHome component for the IS31FL3731, so this drives it
# over the shared I2C bus with raw register writes (same approach as the amp/
# 7-seg init lambdas). This is the interchangeable "display" package that is
# loaded by default (the 7-seg in packages/display.yaml is the alternative -
# load EITHER, never both: they both define render_display).
#
# It provides the display-agnostic contract that packages/ambient.yaml drives:
#   render_display  - paints the matrix honouring, in priority order, an
#                     HA-authored message -> a device status message ->
#                     low-battery "LOW BATT" -> transient preset code -> clock.
# The 1s tick, show_preset_code, show_status_message, the preset-code and
# status-message state, and the ambient auto-dim (display_brightness) all live in
# packages/ambient.yaml.
#
# SINGLE vs DUAL PANEL --------------------------------------------------------
# One 16x9 panel is tight for a clock, so the design tiles N panels side-by-side
# into ONE logical framebuffer 16*N wide x 9 tall. Everything draws in LOGICAL
# (x,y); a flush step slices the framebuffer per panel and pushes each slice to
# that panel's own I2C address. Change ONE substitution to go from bring-up to
# the full display:
#     matrix_panels: "1"   -> left panel only, compact 3x5 font  (bring-up)
#     matrix_panels: "2"   -> 32x9, roomy 5x7 font               (real clock)
# In single mode the 2nd address (${matrix_address_2}) is never touched, so a
# board that isn't wired yet causes no I2C errors. Tiling is horizontal: panel p
# owns logical columns [16*p .. 16*p+15]. Second board needs its ADDR jumper set
# to a free address (0x75/0x76/0x77) - see HARDWARE.md.
#
# THE INTER-PANEL GAP ---------------------------------------------------------
# Two panels butted together are NOT seamless: there is a physical ~1-pixel gap
# between the last column of the left panel and the first column of the right
# (${matrix_panel_gap}). So content is laid out in PHYSICAL columns (which
# include that gap as a dead column) and mapped back to logical columns at draw
# time - set_px() drops any pixel that lands in the gap. That keeps the clock
# visually centred across the seam instead of looking shoved to one side, and it
# makes 2-char preset codes ("S1", "LO"...) fall naturally one-per-panel with
# the gap between them.
#
# Chip model (from Adafruit's Adafruit_IS31FL3731 base 16x9 class):
#   - pixel (x,y) -> LED number  = x + y*16   (x: 0..15 cols, y: 0..8 rows)
#   - PWM byte for LED n         at register 0x24 + n   (144 LEDs, 0x24..0xB3)
#   - LED on/off enable          registers 0x00..0x11   (18 bytes, 8 LEDs each)
#   - blink enable               registers 0x12..0x23   (held off)
#   - "command register" 0xFD selects the bank/page:
#       0x00 = frame 0 (enable + PWM live here)
#       0x0B = function register (config / picture-frame / shutdown)
#   Function-bank registers: 0x00 config (0x00 = picture mode),
#       0x01 picture-display-frame, 0x0A shutdown (0 = off, 1 = normal).
#
# Defines ids: matrix_inited + custom-message globals, render_display (script),
#   and Home Assistant entities for a timed scrolling text message.
# Consumes: internal_i2c + ds3231_time (main), display_brightness + preset_code
#   + showing_preset + status_message + status_message_until_ms (ambient),
#   battery_low + external_power (battery).
#   Panel count / addresses / gap / brightness are the ${matrix_*} substitutions.
# =====================================================================
globals:
  # Panels are configured once (below), not every frame - the 1s tick only
  # pushes PWM. Clearing this flag forces a re-init, which is how render logic
  # recovers if a 5V glitch resets the chip (it has no NVM).
  - id: matrix_inited
    type: bool
    restore_value: no
    initial_value: 'false'
  # Active custom message text (A-Z/0-9 plus a few punctuation chars).
  - id: matrix_custom_text
    type: std::string
    restore_value: no
    initial_value: '""'
  # Absolute expiry (millis) for the custom message display window.
  - id: matrix_custom_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Duration for the custom message in seconds; editable from HA.
  - id: matrix_custom_duration_s
    type: int
    restore_value: yes
    initial_value: '${matrix_message_duration_default}'
  # Scroll speed in milliseconds per pixel step; editable from HA.
  - id: matrix_scroll_ms_per_px
    type: int
    restore_value: yes
    initial_value: '${matrix_scroll_ms_per_px_default}'

interval:
  # Faster refresh only while a message is active, so text scrolls smoothly
  # without increasing baseline I2C traffic. Status messages are included even
  # though they normally render STATIC: render_display's signature check returns
  # before touching I2C when nothing changed, so the extra ticks are free, and a
  # status string long enough to overflow the panel still scrolls properly.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              const uint32_t t = millis();
              return (!id(matrix_custom_text).empty() &&
                      (int32_t) (id(matrix_custom_until_ms) - t) > 0) ||
                     (!id(status_message).empty() &&
                      (int32_t) (id(status_message_until_ms) - t) > 0);
          then:
            - script.execute: render_display

script:
  # Single owner of the matrix. Ensures the driver is configured, then paints,
  # in priority order: custom message, low-battery warning, preset code, or
  # the clock. Called by ambient.yaml's 1s interval and show_preset_code.
  - id: render_display
    then:
      - lambda: |-
          const int     PANELS  = ${matrix_panels};                 // 1 or 2
          const uint8_t ADDR[2] = {(uint8_t)${matrix_address},
                                   (uint8_t)${matrix_address_2}};
          const int     H = 9;
          // Physical geometry: a dead gap column sits between adjacent panels.
          const int GAP = (PANELS > 1) ? ${matrix_panel_gap} : 0;
          const int BLK = 16 + GAP;                    // physical span: panel + gap
          const int WP  = 16 * PANELS + GAP * (PANELS - 1);  // total physical width

          auto W1 = [&](uint8_t addr, uint8_t reg, uint8_t val) {
            uint8_t b[2] = {reg, val};
            id(internal_i2c).write(addr, b, 2);
          };

          // ---- one-time per-panel init (auto-recovers after chip reset) ----
          bool force = false;
          if (!id(matrix_inited)) {
            for (int p = 0; p < PANELS; p++) {
              uint8_t addr = ADDR[p];
              W1(addr, 0xFD, 0x0B);              // function register bank
              W1(addr, 0x0A, 0x00);              // shutdown
              delay(10);
              W1(addr, 0x0A, 0x01);              // normal operation
              W1(addr, 0x00, 0x00);              // picture mode
              W1(addr, 0x01, 0x00);              // display frame 0
              W1(addr, 0xFD, 0x00);              // frame 0 bank
              for (uint8_t r = 0x00; r <= 0x11; r++) W1(addr, r, 0xFF);  // enable all
              for (uint8_t r = 0x12; r <= 0x23; r++) W1(addr, r, 0x00);  // blink off
            }
            id(matrix_inited) = true;
            force = true;                        // guarantee a paint after init
          }

          // Lit-pixel PWM tracks the shared ambient auto-dim (0..15), scaled into
          // [matrix_pwm_min .. matrix_pwm_on] so the matrix dims at night like the
          // 7-seg (and never fully blanks - min keeps digits readable).
          int b = id(display_brightness);
          if (b < 0) b = 0; if (b > 15) b = 15;
          const uint8_t PMIN = ${matrix_pwm_min};
          const uint8_t PMAX = ${matrix_pwm_on};
          const uint8_t ON = PMIN + (uint8_t)((PMAX - PMIN) * b / 15);

          // ---- decide what to show ----
          // Priority: custom (HA-authored) > status (device event) > low batt >
          // preset > clock.
          // 0 = low-battery warning, 1 = preset code, 2 = clock, 3 = custom,
          // 4 = status message.
          //
          // A status message outranks the low-battery nag deliberately: plugging
          // in while the pack is flat is exactly when you want to see "CHARGING"
          // rather than "LOW BATT" (and external_power going true clears the nag
          // anyway a moment later).
          int mode;
          std::string text;
          const uint32_t now_ms = millis();
          bool custom_active = !id(matrix_custom_text).empty() &&
                               (int32_t) (id(matrix_custom_until_ms) - now_ms) > 0;
          bool status_active = !id(status_message).empty() &&
                               (int32_t) (id(status_message_until_ms) - now_ms) > 0;
          if (custom_active) {
            mode = 3; text = id(matrix_custom_text);
          } else if (status_active) {
            mode = 4; text = id(status_message);
          } else if (id(battery_low).state && !id(external_power).state) {
            mode = 0; text = "LOW BATT";         // suppressed while on mains (see battery.yaml)
          } else if (id(showing_preset)) {
            mode = 1; text = id(preset_code);    // e.g. "S3", "L1", "OFF"
          } else {
            mode = 2;                            // clock
          }

          // ---- read the battery-backed RTC (12h, blank leading zero) ----
          auto now = id(ds3231_time).now();
          bool valid = now.is_valid();
          int digs[4] = {-1, -1, -1, -1};        // -1 = blank slot
          if (valid) {
            int hour = now.hour % 12; if (hour == 0) hour = 12;
            int minute = now.minute;
            if (hour >= 10) digs[0] = hour / 10; // else leading zero stays blank
            digs[1] = hour % 10;
            digs[2] = minute / 10;
            digs[3] = minute % 10;
          }

          // Skip the redraw when nothing visible changed. The signature folds in
          // mode, content and brightness; frame tokens are only added when a
          // message is actively scrolling.
          std::string sigkey;
          // Status messages use the COMPACT font even on the dual panel, because
          // they are drawn inside ONE panel (see draw_text_in_last_panel) to keep
          // clear of the seam: at the 3x5 font's 4px pitch a 4-character word
          // ("BATT" = 15px) fits 16 columns, where 5x7 would manage only two.
          const int font_w = (mode == 4 || PANELS < 2) ? 3 : 5;
          const int font_h = (font_w == 5) ? 7 : 5;
          const int text_w = (!text.empty()) ? ((int) text.size() * font_w + ((int) text.size() - 1)) : 0;
          // Anything over budget scrolls rather than being clipped. A status
          // message gets one panel; every other text mode gets the full width.
          // Preset codes are at most 3 chars so mode 1 never trips this.
          const int text_budget = (mode == 4) ? 16 : WP;
          const bool should_scroll_text = (mode != 2) && (text_w > text_budget);
          int scroll_ms = id(matrix_scroll_ms_per_px);
          if (scroll_ms < 30) scroll_ms = 30;
          if (mode == 0 || mode == 3 || mode == 4) {
            sigkey = (mode == 0) ? "LOWBATT" : ((mode == 3) ? "MSG:" : "STAT:");
            sigkey += text;
            if (should_scroll_text) {
              int frame_token = (int) (now_ms / (uint32_t) scroll_ms);
              sigkey += ":" + std::to_string(frame_token);
            }
          } else if (mode == 1) sigkey = "P:" + text;
          else {
            sigkey = "T:";
            for (int i = 0; i < 4; i++) sigkey += (digs[i] < 0 ? '_' : char('0' + digs[i]));
          }
          sigkey += "/"; sigkey += std::to_string((int) ON);
          uint32_t sig = 2166136261u;            // FNV-1a over the state key
          for (size_t i = 0; i < sigkey.size(); i++)
            sig = (sig ^ (uint8_t) sigkey[i]) * 16777619u;
          static uint32_t last_sig = 0;
          static bool have_sig = false;
          if (!force && have_sig && sig == last_sig) return;
          last_sig = sig; have_sig = true;

          // ---- render into the logical framebuffer (16*PANELS wide) ----
          uint8_t fb[9][32];
          for (int y = 0; y < H; y++)
            for (int x = 0; x < 32; x++) fb[y][x] = 0;

          // Place a pixel by PHYSICAL column: map physical -> logical, dropping
          // anything that falls in the inter-panel gap (a dead column).
          auto set_px = [&](int px, int y) {
            if (px < 0 || px >= WP || y < 0 || y >= H) return;
            int p = px / BLK;
            int within = px - p * BLK;
            if (within >= 16) return;            // in the gap between panels
            fb[y][p * 16 + within] = ON;
          };

          // Fonts: glyph rows are bit patterns, MSB = leftmost column.
          static const uint8_t FONT3x5[10][5] = {
            {0b111,0b101,0b101,0b101,0b111}, {0b010,0b110,0b010,0b010,0b111},
            {0b111,0b001,0b111,0b100,0b111}, {0b111,0b001,0b111,0b001,0b111},
            {0b101,0b101,0b111,0b001,0b001}, {0b111,0b100,0b111,0b001,0b111},
            {0b111,0b100,0b111,0b101,0b111}, {0b111,0b001,0b001,0b001,0b001},
            {0b111,0b101,0b111,0b101,0b111}, {0b111,0b101,0b111,0b001,0b111},
          };
          static const uint8_t FONT5x7[10][7] = {
            {0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110},  // 0
            {0b00100,0b01100,0b00100,0b00100,0b00100,0b00100,0b01110},  // 1
            {0b01110,0b10001,0b00001,0b00010,0b00100,0b01000,0b11111},  // 2
            {0b01110,0b10001,0b00001,0b00110,0b00001,0b10001,0b01110},  // 3
            {0b00010,0b00110,0b01010,0b10010,0b11111,0b00010,0b00010},  // 4
            {0b11111,0b10000,0b11110,0b00001,0b00001,0b10001,0b01110},  // 5
            {0b01110,0b10001,0b10000,0b11110,0b10001,0b10001,0b01110},  // 6
            {0b11111,0b00001,0b00010,0b00100,0b01000,0b01000,0b01000},  // 7
            {0b01110,0b10001,0b10001,0b01110,0b10001,0b10001,0b01110},  // 8
            {0b01110,0b10001,0b10001,0b01111,0b00001,0b10001,0b01110},  // 9
          };
          // Full uppercase alphabet for custom messages.
          static const uint8_t ALPHA5[26][7] = {
            {0b01110,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001},  // A
            {0b11110,0b10001,0b10001,0b11110,0b10001,0b10001,0b11110},  // B
            {0b01110,0b10001,0b10000,0b10000,0b10000,0b10001,0b01110},  // C
            {0b11100,0b10010,0b10001,0b10001,0b10001,0b10010,0b11100},  // D
            {0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b11111},  // E
            {0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b10000},  // F
            {0b01110,0b10001,0b10000,0b10111,0b10001,0b10001,0b01110},  // G
            {0b10001,0b10001,0b10001,0b11111,0b10001,0b10001,0b10001},  // H
            {0b01110,0b00100,0b00100,0b00100,0b00100,0b00100,0b01110},  // I
            {0b00001,0b00001,0b00001,0b00001,0b10001,0b10001,0b01110},  // J
            {0b10001,0b10010,0b10100,0b11000,0b10100,0b10010,0b10001},  // K
            {0b10000,0b10000,0b10000,0b10000,0b10000,0b10000,0b11111},  // L
            {0b10001,0b11011,0b10101,0b10101,0b10001,0b10001,0b10001},  // M
            {0b10001,0b11001,0b10101,0b10011,0b10001,0b10001,0b10001},  // N
            {0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110},  // O
            {0b11110,0b10001,0b10001,0b11110,0b10000,0b10000,0b10000},  // P
            {0b01110,0b10001,0b10001,0b10001,0b10101,0b10010,0b01101},  // Q
            {0b11110,0b10001,0b10001,0b11110,0b10100,0b10010,0b10001},  // R
            {0b01110,0b10001,0b10000,0b01110,0b00001,0b10001,0b01110},  // S
            {0b11111,0b00100,0b00100,0b00100,0b00100,0b00100,0b00100},  // T
            {0b10001,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110},  // U
            {0b10001,0b10001,0b10001,0b10001,0b10001,0b01010,0b00100},  // V
            {0b10001,0b10001,0b10001,0b10101,0b10101,0b11011,0b10001},  // W
            {0b10001,0b10001,0b01010,0b00100,0b01010,0b10001,0b10001},  // X
            {0b10001,0b10001,0b01010,0b00100,0b00100,0b00100,0b00100},  // Y
            {0b11111,0b00001,0b00010,0b00100,0b01000,0b10000,0b11111},  // Z
          };
          static const uint8_t ALPHA3[26][5] = {
            {0b010,0b101,0b111,0b101,0b101},  // A
            {0b110,0b101,0b110,0b101,0b110},  // B
            {0b011,0b100,0b100,0b100,0b011},  // C
            {0b110,0b101,0b101,0b101,0b110},  // D
            {0b111,0b100,0b110,0b100,0b111},  // E
            {0b111,0b100,0b110,0b100,0b100},  // F
            {0b011,0b100,0b101,0b101,0b011},  // G
            {0b101,0b101,0b111,0b101,0b101},  // H
            {0b111,0b010,0b010,0b010,0b111},  // I
            {0b001,0b001,0b001,0b101,0b010},  // J
            {0b101,0b101,0b110,0b101,0b101},  // K
            {0b100,0b100,0b100,0b100,0b111},  // L
            {0b101,0b111,0b111,0b101,0b101},  // M
            {0b101,0b111,0b111,0b111,0b101},  // N
            {0b111,0b101,0b101,0b101,0b111},  // O
            {0b110,0b101,0b110,0b100,0b100},  // P
            {0b111,0b101,0b101,0b111,0b001},  // Q
            {0b110,0b101,0b110,0b101,0b101},  // R
            {0b011,0b100,0b010,0b001,0b110},  // S
            {0b111,0b010,0b010,0b010,0b010},  // T
            {0b101,0b101,0b101,0b101,0b111},  // U
            {0b101,0b101,0b101,0b101,0b010},  // V
            {0b101,0b101,0b111,0b111,0b101},  // W
            {0b101,0b101,0b010,0b101,0b101},  // X
            {0b101,0b101,0b010,0b010,0b010},  // Y
            {0b111,0b001,0b010,0b100,0b111},  // Z
          };
          static const uint8_t DASH5[7] = {0b00000,0b00000,0b00000,0b11111,0b00000,0b00000,0b00000};
          static const uint8_t UNDERSCORE5[7] = {0b00000,0b00000,0b00000,0b00000,0b00000,0b00000,0b11111};
          static const uint8_t DOT5[7] = {0b00000,0b00000,0b00000,0b00000,0b00000,0b00110,0b00110};
          static const uint8_t EXCL5[7] = {0b00100,0b00100,0b00100,0b00100,0b00100,0b00000,0b00100};
          static const uint8_t QMARK5[7] = {0b01110,0b10001,0b00001,0b00010,0b00100,0b00000,0b00100};
          static const uint8_t COLON5[7] = {0b00000,0b00110,0b00110,0b00000,0b00110,0b00110,0b00000};
          static const uint8_t DASH3[5] = {0b000,0b000,0b111,0b000,0b000};
          static const uint8_t UNDERSCORE3[5] = {0b000,0b000,0b000,0b000,0b111};
          static const uint8_t DOT3[5] = {0b000,0b000,0b000,0b000,0b010};
          static const uint8_t EXCL3[5] = {0b010,0b010,0b010,0b000,0b010};
          static const uint8_t QMARK3[5] = {0b110,0b001,0b010,0b000,0b010};
          static const uint8_t COLON3[5] = {0b000,0b010,0b000,0b010,0b000};
          auto glyph5 = [&](char c) -> const uint8_t* {
            if (c >= 'a' && c <= 'z') c = (char) (c - 'a' + 'A');
            if (c >= '0' && c <= '9') return FONT5x7[c - '0'];
            if (c >= 'A' && c <= 'Z') return ALPHA5[c - 'A'];
            switch (c) {
              case ' ': return nullptr;
              case '-': return DASH5;
              case '_': return UNDERSCORE5;
              case '.': return DOT5;
              case '!': return EXCL5;
              case '?': return QMARK5;
              case ':': return COLON5;
            }
            return nullptr;                      // space / unknown -> blank
          };
          auto glyph3 = [&](char c) -> const uint8_t* {
            if (c >= 'a' && c <= 'z') c = (char) (c - 'a' + 'A');
            if (c >= '0' && c <= '9') return FONT3x5[c - '0'];
            if (c >= 'A' && c <= 'Z') return ALPHA3[c - 'A'];
            switch (c) {
              case ' ': return nullptr;
              case '-': return DASH3;
              case '_': return UNDERSCORE3;
              case '.': return DOT3;
              case '!': return EXCL3;
              case '?': return QMARK3;
              case ':': return COLON3;
            }
            return nullptr;
          };
          auto draw_glyph = [&](const uint8_t *rows, int gw, int gh, int dx, int dy) {
            if (!rows) return;
            for (int r = 0; r < gh; r++)
              for (int c = 0; c < gw; c++)
                if (rows[r] & (1 << (gw - 1 - c))) set_px(dx + c, dy + r);
          };
          // Draw text using physical coordinates; off-screen columns are clipped
          // by set_px(), which lets the low-battery warning scroll cleanly.
          auto draw_text_at = [&](const std::string &s, int gw, int gh, int x0, int y0, int spacing) {
            int n = (int) s.size();
            if (n == 0) return;
            for (int i = 0; i < n; i++) {
              const uint8_t *g = (gw == 5) ? glyph5(s[i]) : glyph3(s[i]);
              draw_glyph(g, gw, gh, x0 + i * (gw + spacing), y0);
            }
          };
          auto draw_text_centered = [&](const std::string &s, int gw, int gh) {
            int n = (int) s.size();
            if (n == 0) return;
            int width = n * gw + (n - 1);
            int x0 = (WP - width) / 2;
            int y0 = (H - gh) / 2;
            draw_text_at(s, gw, gh, x0, y0, 1);
          };
          // Status text sits centred INSIDE THE LAST PANEL rather than centred
          // across the whole display, so it can never straddle the inter-panel
          // gap. That sidesteps the seam problem outright: a word centred across
          // both panels loses one column of whichever glyph lands on the dead
          // column, which for a narrow 3x5 glyph can be fatal (a 'T' reduced to
          // its top bar). Nothing here has to know where the gap is.
          //
          // The tradeoff is a 4-character budget (15px at the 3x5 font's 4px
          // pitch, inside 16 columns). Longer strings scroll across the full
          // width instead - see text_budget above.
          auto draw_text_in_last_panel = [&](const std::string &s) {
            int n = (int) s.size();
            if (n == 0) return;
            int width = n * 4 - 1;
            int x0 = (PANELS - 1) * BLK + (16 - width) / 2;
            draw_text_at(s, 3, 5, x0, (H - 5) / 2, 1);
          };
          auto draw_text_scrolling = [&](const std::string &s, int gw, int gh, int phase) {
            int n = (int) s.size();
            if (n == 0) return;
            int width = n * gw + (n - 1);
            int travel = width + WP;
            int safe_travel = (travel > 0) ? travel : 1;
            int x0 = WP - (phase % safe_travel);
            int y0 = (H - gh) / 2;
            draw_text_at(s, gw, gh, x0, y0, 1);
          };

          if (mode != 2) {
            // Warning / preset / message text. font_w picked above: roomy 5x7 on
            // the dual panel, compact 3x5 on a single panel or for a status
            // message (which is panel-local and needs the narrower pitch).
            if (should_scroll_text) {
              int phase = (int) (now_ms / (uint32_t) scroll_ms);
              draw_text_scrolling(text, font_w, font_h, phase);
            } else if (mode == 4) {
              draw_text_in_last_panel(text);
            } else {
              draw_text_centered(text, font_w, font_h);
            }
          } else if (PANELS >= 2) {
            // Clock: HH on the left panel, MM on the right, colon at the seam.
            // MM is pulled toward the seam by GAP so the colon sits symmetric
            // across the physical gap (see "THE INTER-PANEL GAP" above).
            const int top = 1;                   // 7-tall band, rows 1..7
            const int P1 = 16 + GAP;             // physical x of the right panel's first col
            const int hh_x[2] = {2, 8};
            const int mm_x[2] = {P1 + 1, P1 + 7};
            if (digs[0] >= 0) draw_glyph(FONT5x7[digs[0]], 5, 7, hh_x[0], top);
            if (digs[1] >= 0) draw_glyph(FONT5x7[digs[1]], 5, 7, hh_x[1], top);
            if (digs[2] >= 0) draw_glyph(FONT5x7[digs[2]], 5, 7, mm_x[0], top);
            if (digs[3] >= 0) draw_glyph(FONT5x7[digs[3]], 5, 7, mm_x[1], top);
            if (valid) { set_px(15, top + 2); set_px(15, top + 4); }  // colon (left panel edge)
          } else {
            // Single-panel clock: compact 3x5 font, no gap to worry about.
            const int top = 2;                   // 5-tall band, rows 2..6
            const int xoff[4] = {0, 4, 9, 13};
            for (int i = 0; i < 4; i++)
              if (digs[i] >= 0) draw_glyph(FONT3x5[digs[i]], 3, 5, xoff[i], top);
            if (valid) { set_px(7, top + 1); set_px(7, top + 3); }    // colon
          }

          // ---- flush: slice each panel's 16 cols and burst its PWM ----
          for (int p = 0; p < PANELS; p++) {
            uint8_t addr = ADDR[p];
            uint8_t pwm[144];
            for (int y = 0; y < H; y++)
              for (int lx = 0; lx < 16; lx++)
                pwm[lx + y * 16] = fb[y][p * 16 + lx];
            // Auto-incrementing 16-byte bursts (9): [start-reg, b0, b1, ...].
            for (int i = 0; i < 144; i += 16) {
              uint8_t burst[1 + 16];
              burst[0] = 0x24 + i;
              for (int j = 0; j < 16; j++) burst[1 + j] = pwm[i + j];
              id(internal_i2c).write(addr, burst, sizeof(burst));
            }
          }

number:
  - platform: template
    name: "Matrix Scroll ms per px"
    id: matrix_scroll_speed
    icon: "mdi:arrow-left-right"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: ${matrix_scroll_ms_per_px_min}
    max_value: ${matrix_scroll_ms_per_px_max}
    step: ${matrix_scroll_ms_per_px_step}
    mode: box
    initial_value: ${matrix_scroll_ms_per_px_default}
    set_action:
      - lambda: |-
          int ms = (int) x;
          if (ms < ${matrix_scroll_ms_per_px_min}) ms = ${matrix_scroll_ms_per_px_min};
          if (ms > ${matrix_scroll_ms_per_px_max}) ms = ${matrix_scroll_ms_per_px_max};
          id(matrix_scroll_ms_per_px) = ms;

  - platform: template
    name: "Matrix Message Duration"
    id: matrix_message_duration
    icon: "mdi:timer-outline"
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: ${matrix_message_duration_min}
    max_value: ${matrix_message_duration_max}
    step: 1
    mode: box
    initial_value: ${matrix_message_duration_default}
    set_action:
      - lambda: |-
          int seconds = (int) x;
          if (seconds < ${matrix_message_duration_min}) seconds = ${matrix_message_duration_min};
          if (seconds > ${matrix_message_duration_max}) seconds = ${matrix_message_duration_max};
          id(matrix_custom_duration_s) = seconds;

text:
  - platform: template
    name: "Matrix Message"
    id: matrix_message_input
    icon: "mdi:message-text-outline"
    optimistic: true
    mode: text
    max_length: 64
    set_action:
      - lambda: |-
          std::string filtered;
          filtered.reserve(x.size());
          for (char ch : x) {
            if (ch >= 'a' && ch <= 'z') ch = (char) (ch - 'a' + 'A');
            bool allowed =
              (ch >= 'A' && ch <= 'Z') ||
              (ch >= '0' && ch <= '9') ||
              ch == ' ' || ch == '-' || ch == '_' || ch == '.' ||
              ch == '!' || ch == '?' || ch == ':';
            filtered.push_back(allowed ? ch : ' ');
          }
          while (!filtered.empty() && filtered.back() == ' ') filtered.pop_back();
          id(matrix_custom_text) = filtered;

button:
  - platform: template
    name: "Show Matrix Message"
    id: matrix_message_show
    icon: "mdi:message-flash-outline"
    on_press:
      - lambda: |-
          if (id(matrix_custom_text).empty()) {
            id(matrix_custom_until_ms) = 0;
          } else {
            int seconds = id(matrix_custom_duration_s);
            if (seconds < ${matrix_message_duration_min}) seconds = ${matrix_message_duration_min};
            if (seconds > ${matrix_message_duration_max}) seconds = ${matrix_message_duration_max};
            id(matrix_custom_until_ms) = millis() + (uint32_t) seconds * 1000u;
          }
      - script.execute: render_display
