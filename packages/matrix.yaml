# =====================================================================
# IS31FL3731 CHARLIEPLEX 16x9 MATRIX (I2C) - the ACTIVE clock display
#
# There is NO native ESPHome component for the IS31FL3731, so this drives it
# over the shared I2C bus with raw register writes (same approach as the amp/
# 7-seg init lambdas). This is the interchangeable "display" package that is
# loaded by default (the 7-seg in packages/display.yaml is the alternative -
# load EITHER, never both: they both define render_display).
#
# It provides the display-agnostic contract that packages/ambient.yaml drives:
#   render_display  - paints the matrix honouring, in priority order,
#                     low-battery "LO" -> transient preset code -> clock.
# The 1s tick, show_preset_code, the preset-code state and the ambient auto-dim
# (display_brightness) all live in packages/ambient.yaml.
#
# SINGLE vs DUAL PANEL --------------------------------------------------------
# One 16x9 panel is tight for a clock, so the design tiles N panels side-by-side
# into ONE logical framebuffer 16*N wide x 9 tall. Everything draws in LOGICAL
# (x,y); a flush step slices the framebuffer per panel and pushes each slice to
# that panel's own I2C address. Change ONE substitution to go from bring-up to
# the full display:
#     matrix_panels: "1"   -> left panel only, compact 3x5 font  (bring-up)
#     matrix_panels: "2"   -> 32x9, roomy 5x7 font               (real clock)
# In single mode the 2nd address (${matrix_address_2}) is never touched, so a
# board that isn't wired yet causes no I2C errors. Tiling is horizontal: panel p
# owns logical columns [16*p .. 16*p+15]. Second board needs its ADDR jumper set
# to a free address (0x75/0x76/0x77) - see HARDWARE.md.
#
# THE INTER-PANEL GAP ---------------------------------------------------------
# Two panels butted together are NOT seamless: there is a physical ~1-pixel gap
# between the last column of the left panel and the first column of the right
# (${matrix_panel_gap}). So content is laid out in PHYSICAL columns (which
# include that gap as a dead column) and mapped back to logical columns at draw
# time - set_px() drops any pixel that lands in the gap. That keeps the clock
# visually centred across the seam instead of looking shoved to one side, and it
# makes 2-char preset codes ("S1", "LO"...) fall naturally one-per-panel with
# the gap between them.
#
# Chip model (from Adafruit's Adafruit_IS31FL3731 base 16x9 class):
#   - pixel (x,y) -> LED number  = x + y*16   (x: 0..15 cols, y: 0..8 rows)
#   - PWM byte for LED n         at register 0x24 + n   (144 LEDs, 0x24..0xB3)
#   - LED on/off enable          registers 0x00..0x11   (18 bytes, 8 LEDs each)
#   - blink enable               registers 0x12..0x23   (held off)
#   - "command register" 0xFD selects the bank/page:
#       0x00 = frame 0 (enable + PWM live here)
#       0x0B = function register (config / picture-frame / shutdown)
#   Function-bank registers: 0x00 config (0x00 = picture mode),
#       0x01 picture-display-frame, 0x0A shutdown (0 = off, 1 = normal).
#
# Defines ids: matrix_inited, render_display (script), and a manual
#   "Matrix: redraw" button (forces a re-init after a power glitch).
# Consumes: internal_i2c + ds3231_time (main), display_brightness + preset_code
#   + showing_preset (ambient), battery_low + external_power (battery).
#   Panel count / addresses / gap / brightness are the ${matrix_*} substitutions.
# =====================================================================
globals:
  # Panels are configured once (below), not every frame - the 1s tick only
  # pushes PWM. The "Matrix: redraw" button clears this to force a re-init,
  # which is how you recover if a 5V glitch resets the chip (it has no NVM).
  - id: matrix_inited
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # Single owner of the matrix. Ensures the driver is configured, then paints,
  # in priority order: a low-battery "LO", a transient preset code, or the
  # clock. Called by ambient.yaml's 1s interval, show_preset_code, and the
  # redraw button.
  - id: render_display
    then:
      - lambda: |-
          const int     PANELS  = ${matrix_panels};                 // 1 or 2
          const uint8_t ADDR[2] = {(uint8_t)${matrix_address},
                                   (uint8_t)${matrix_address_2}};
          const int     H = 9;
          // Physical geometry: a dead gap column sits between adjacent panels.
          const int GAP = (PANELS > 1) ? ${matrix_panel_gap} : 0;
          const int BLK = 16 + GAP;                    // physical span: panel + gap
          const int WP  = 16 * PANELS + GAP * (PANELS - 1);  // total physical width

          auto W1 = [&](uint8_t addr, uint8_t reg, uint8_t val) {
            uint8_t b[2] = {reg, val};
            id(internal_i2c).write(addr, b, 2);
          };

          // ---- one-time per-panel init (self-heals via the redraw button) ----
          bool force = false;
          if (!id(matrix_inited)) {
            for (int p = 0; p < PANELS; p++) {
              uint8_t addr = ADDR[p];
              W1(addr, 0xFD, 0x0B);              // function register bank
              W1(addr, 0x0A, 0x00);              // shutdown
              delay(10);
              W1(addr, 0x0A, 0x01);              // normal operation
              W1(addr, 0x00, 0x00);              // picture mode
              W1(addr, 0x01, 0x00);              // display frame 0
              W1(addr, 0xFD, 0x00);              // frame 0 bank
              for (uint8_t r = 0x00; r <= 0x11; r++) W1(addr, r, 0xFF);  // enable all
              for (uint8_t r = 0x12; r <= 0x23; r++) W1(addr, r, 0x00);  // blink off
            }
            id(matrix_inited) = true;
            force = true;                        // guarantee a paint after init
          }

          // Lit-pixel PWM tracks the shared ambient auto-dim (0..15), scaled into
          // [matrix_pwm_min .. matrix_pwm_on] so the matrix dims at night like the
          // 7-seg (and never fully blanks - min keeps digits readable).
          int b = id(display_brightness);
          if (b < 0) b = 0; if (b > 15) b = 15;
          const uint8_t PMIN = ${matrix_pwm_min};
          const uint8_t PMAX = ${matrix_pwm_on};
          const uint8_t ON = PMIN + (uint8_t)((PMAX - PMIN) * b / 15);

          // ---- decide what to show (priority: LO > preset code > clock) ----
          // 0 = low-battery warning, 1 = preset code, 2 = clock.
          int mode;
          std::string text;
          if (id(battery_low).state && !id(external_power).state) {
            mode = 0; text = "LO";               // suppressed while on mains (see battery.yaml)
          } else if (id(showing_preset)) {
            mode = 1; text = id(preset_code);    // e.g. "S3", "L1", "OFF"
          } else {
            mode = 2;                            // clock
          }

          // ---- read the battery-backed RTC (12h, blank leading zero) ----
          auto now = id(ds3231_time).now();
          bool valid = now.is_valid();
          int digs[4] = {-1, -1, -1, -1};        // -1 = blank slot
          if (valid) {
            int hour = now.hour % 12; if (hour == 0) hour = 12;
            int minute = now.minute;
            if (hour >= 10) digs[0] = hour / 10; // else leading zero stays blank
            digs[1] = hour % 10;
            digs[2] = minute / 10;
            digs[3] = minute % 10;
          }

          // Skip the redraw when nothing visible changed. The signature folds in
          // the mode, the shown content (code text OR the four clock digits) and
          // the brightness, so a preset/LO flash repaints even though the minute
          // didn't tick. Keeps the shared, timing-sensitive I2C bus quiet.
          std::string sigkey;
          if (mode == 0)      sigkey = "LO";
          else if (mode == 1) sigkey = "P:" + text;
          else {
            sigkey = "T:";
            for (int i = 0; i < 4; i++) sigkey += (digs[i] < 0 ? '_' : char('0' + digs[i]));
          }
          sigkey += "/"; sigkey += std::to_string((int) ON);
          uint32_t sig = 2166136261u;            // FNV-1a over the state key
          for (size_t i = 0; i < sigkey.size(); i++)
            sig = (sig ^ (uint8_t) sigkey[i]) * 16777619u;
          static uint32_t last_sig = 0;
          static bool have_sig = false;
          if (!force && have_sig && sig == last_sig) return;
          last_sig = sig; have_sig = true;

          // ---- render into the logical framebuffer (16*PANELS wide) ----
          uint8_t fb[9][32];
          for (int y = 0; y < H; y++)
            for (int x = 0; x < 32; x++) fb[y][x] = 0;

          // Place a pixel by PHYSICAL column: map physical -> logical, dropping
          // anything that falls in the inter-panel gap (a dead column).
          auto set_px = [&](int px, int y) {
            if (px < 0 || px >= WP || y < 0 || y >= H) return;
            int p = px / BLK;
            int within = px - p * BLK;
            if (within >= 16) return;            // in the gap between panels
            fb[y][p * 16 + within] = ON;
          };

          // Fonts: glyph rows are bit patterns, MSB = leftmost column.
          static const uint8_t FONT3x5[10][5] = {
            {0b111,0b101,0b101,0b101,0b111}, {0b010,0b110,0b010,0b010,0b111},
            {0b111,0b001,0b111,0b100,0b111}, {0b111,0b001,0b111,0b001,0b111},
            {0b101,0b101,0b111,0b001,0b001}, {0b111,0b100,0b111,0b001,0b111},
            {0b111,0b100,0b111,0b101,0b111}, {0b111,0b001,0b001,0b001,0b001},
            {0b111,0b101,0b111,0b101,0b111}, {0b111,0b101,0b111,0b001,0b111},
          };
          static const uint8_t FONT5x7[10][7] = {
            {0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110},  // 0
            {0b00100,0b01100,0b00100,0b00100,0b00100,0b00100,0b01110},  // 1
            {0b01110,0b10001,0b00001,0b00010,0b00100,0b01000,0b11111},  // 2
            {0b01110,0b10001,0b00001,0b00110,0b00001,0b10001,0b01110},  // 3
            {0b00010,0b00110,0b01010,0b10010,0b11111,0b00010,0b00010},  // 4
            {0b11111,0b10000,0b11110,0b00001,0b00001,0b10001,0b01110},  // 5
            {0b01110,0b10001,0b10000,0b11110,0b10001,0b10001,0b01110},  // 6
            {0b11111,0b00001,0b00010,0b00100,0b01000,0b01000,0b01000},  // 7
            {0b01110,0b10001,0b10001,0b01110,0b10001,0b10001,0b01110},  // 8
            {0b01110,0b10001,0b10001,0b01111,0b00001,0b10001,0b01110},  // 9
          };
          // Letters needed by preset codes ("OFF","S1..3","L1..3") + the "LO"
          // warning: O == digit 0, S == digit 5, plus L and F below.
          static const uint8_t L5[7] = {0b10000,0b10000,0b10000,0b10000,0b10000,0b10000,0b11111};
          static const uint8_t F5[7] = {0b11111,0b10000,0b10000,0b11110,0b10000,0b10000,0b10000};
          static const uint8_t L3[5] = {0b100,0b100,0b100,0b100,0b111};
          static const uint8_t F3[5] = {0b111,0b100,0b110,0b100,0b100};
          auto glyph5 = [&](char c) -> const uint8_t* {
            if (c >= '0' && c <= '9') return FONT5x7[c - '0'];
            switch (c) { case 'O': return FONT5x7[0]; case 'S': return FONT5x7[5];
                         case 'L': return L5; case 'F': return F5; }
            return nullptr;                      // space / unknown -> blank
          };
          auto glyph3 = [&](char c) -> const uint8_t* {
            if (c >= '0' && c <= '9') return FONT3x5[c - '0'];
            switch (c) { case 'O': return FONT3x5[0]; case 'S': return FONT3x5[5];
                         case 'L': return L3; case 'F': return F3; }
            return nullptr;
          };
          auto draw_glyph = [&](const uint8_t *rows, int gw, int gh, int dx, int dy) {
            if (!rows) return;
            for (int r = 0; r < gh; r++)
              for (int c = 0; c < gw; c++)
                if (rows[r] & (1 << (gw - 1 - c))) set_px(dx + c, dy + r);
          };
          // Draw a short string centred across the PHYSICAL width (used for the
          // LO warning and preset codes). 1px inter-glyph spacing.
          auto draw_text = [&](const std::string &s, int gw, int gh) {
            int n = (int) s.size();
            if (n == 0) return;
            int width = n * gw + (n - 1);
            int x0 = (WP - width) / 2;
            int y0 = (H - gh) / 2;
            for (int i = 0; i < n; i++) {
              const uint8_t *g = (gw == 5) ? glyph5(s[i]) : glyph3(s[i]);
              draw_glyph(g, gw, gh, x0 + i * (gw + 1), y0);
            }
          };

          if (mode != 2) {
            // LO / preset code: centred text, roomy font on dual, compact on single.
            if (PANELS >= 2) draw_text(text, 5, 7);
            else             draw_text(text, 3, 5);
          } else if (PANELS >= 2) {
            // Clock: HH on the left panel, MM on the right, colon at the seam.
            // MM is pulled toward the seam by GAP so the colon sits symmetric
            // across the physical gap (see "THE INTER-PANEL GAP" above).
            const int top = 1;                   // 7-tall band, rows 1..7
            const int P1 = 16 + GAP;             // physical x of the right panel's first col
            const int hh_x[2] = {2, 8};
            const int mm_x[2] = {P1 + 1, P1 + 7};
            if (digs[0] >= 0) draw_glyph(FONT5x7[digs[0]], 5, 7, hh_x[0], top);
            if (digs[1] >= 0) draw_glyph(FONT5x7[digs[1]], 5, 7, hh_x[1], top);
            if (digs[2] >= 0) draw_glyph(FONT5x7[digs[2]], 5, 7, mm_x[0], top);
            if (digs[3] >= 0) draw_glyph(FONT5x7[digs[3]], 5, 7, mm_x[1], top);
            if (valid) { set_px(15, top + 2); set_px(15, top + 4); }  // colon (left panel edge)
          } else {
            // Single-panel clock: compact 3x5 font, no gap to worry about.
            const int top = 2;                   // 5-tall band, rows 2..6
            const int xoff[4] = {0, 4, 9, 13};
            for (int i = 0; i < 4; i++)
              if (digs[i] >= 0) draw_glyph(FONT3x5[digs[i]], 3, 5, xoff[i], top);
            if (valid) { set_px(7, top + 1); set_px(7, top + 3); }    // colon
          }

          // ---- flush: slice each panel's 16 cols and burst its PWM ----
          for (int p = 0; p < PANELS; p++) {
            uint8_t addr = ADDR[p];
            uint8_t pwm[144];
            for (int y = 0; y < H; y++)
              for (int lx = 0; lx < 16; lx++)
                pwm[lx + y * 16] = fb[y][p * 16 + lx];
            // Auto-incrementing 16-byte bursts (9): [start-reg, b0, b1, ...].
            for (int i = 0; i < 144; i += 16) {
              uint8_t burst[1 + 16];
              burst[0] = 0x24 + i;
              for (int j = 0; j < 16; j++) burst[1 + j] = pwm[i + j];
              id(internal_i2c).write(addr, burst, sizeof(burst));
            }
          }

button:
  - platform: template
    name: "Matrix: redraw"
    icon: "mdi:clock-digital"
    entity_category: config
    on_press:
      # Force a full re-init + repaint (recovers from a chip power glitch).
      - lambda: 'id(matrix_inited) = false;'
      - script.execute: render_display
