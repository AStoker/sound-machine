# =====================================================================
# BATTERY / UPS MONITORING - Waveshare UPS Module 3S (3x 18650 series)
#
# Self-contained package. Defines the ids: battery_voltage, battery_current,
# battery_power, battery_shunt_voltage, battery_level, battery_cell_voltage,
# battery_charging, battery_low. Other packages (display) read battery_low /
# battery_charging by id. All tunables live in the substitutions block of the
# main config.
#
# !! THE ADDRESS AND SHUNT VALUE ARE PLACEHOLDERS !! See the substitutions
# block. Boot with the UPS connected, read the I2C scan in the logs, and set
# ups_i2c_address to whatever unclaimed address appears. Everything below keys
# off the substitutions, so that's the only thing you should need to change
# once the scan comes back.
#
# SIGN CONVENTION: current is positive when the shunt sees flow in the board's
# designed direction. Which direction that is depends on how Waveshare wired
# it, so verify on the bench: run on battery, note the sign; if discharge reads
# positive, flip the comparison in `battery_charging` and drop the
# `- multiply: -1` filter from Battery Current.
# =====================================================================
sensor:
  - platform: ina219
    address: ${ups_i2c_address}
    i2c_id: internal_i2c
    shunt_resistance: ${ups_shunt_ohms}
    max_voltage: 16.0V         # 3S tops out at 12.6V; 16V bus range covers it
    max_current: 5.0A          # matches the board's 5V/5A output rating
    update_interval: 30s
    bus_voltage:
      name: "Battery Voltage"
      id: battery_voltage
      unit_of_measurement: "V"
      accuracy_decimals: 2
      device_class: voltage
      state_class: measurement
    current:
      name: "Battery Current"
      id: battery_current
      unit_of_measurement: "A"
      accuracy_decimals: 3
      device_class: current
      state_class: measurement
      filters:
        - multiply: -1.0       # see SIGN CONVENTION above: make discharge negative
    power:
      name: "Battery Power"
      id: battery_power
      unit_of_measurement: "W"
      accuracy_decimals: 2
      device_class: power
      state_class: measurement
    shunt_voltage:
      name: "Battery Shunt Voltage"
      id: battery_shunt_voltage
      internal: true           # diagnostic only; not worth an HA entity

  # State of charge, derived from pack voltage against a lithium-ion OCV curve.
  # This is an ESTIMATE and it is worst exactly when you're drawing hardest:
  # under a bright sunrise plus loud audio the pack sags and this will read low,
  # then recover when the load drops. The UPS board has no coulomb counter, so
  # voltage is all we get. Treat <20% as "plug it in", not as a fuel gauge.
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    icon: "mdi:battery"
    update_interval: 30s
    lambda: |-
      if (!id(battery_voltage).has_state()) return {};
      float pack = id(battery_voltage).state;
      if (!(pack > 0.0f)) return {};
      float cell = pack / 3.0f;          // 3 cells in SERIES

      // Li-ion rest-voltage curve. Flat through the middle by nature - that
      // plateau is why voltage-based SOC is only ever approximate.
      static const float curve_v[]   = {3.00f, 3.30f, 3.50f, 3.62f, 3.70f, 3.75f,
                                        3.80f, 3.85f, 3.92f, 4.00f, 4.10f, 4.20f};
      static const float curve_pct[] = {0.0f,  5.0f,  10.0f, 20.0f, 30.0f, 40.0f,
                                        50.0f, 60.0f, 75.0f, 85.0f, 95.0f, 100.0f};
      const int points = sizeof(curve_v) / sizeof(curve_v[0]);

      if (cell <= curve_v[0]) return 0.0f;
      if (cell >= curve_v[points - 1]) return 100.0f;
      for (int i = 0; i < points - 1; i++) {
        if (cell < curve_v[i + 1]) {
          float span = curve_v[i + 1] - curve_v[i];
          float blend = (cell - curve_v[i]) / span;
          return curve_pct[i] + (curve_pct[i + 1] - curve_pct[i]) * blend;
        }
      }
      return 100.0f;

  # Per-cell average - the number that actually matters for pack health, and
  # much easier to sanity-check against a multimeter than the pack total.
  - platform: template
    name: "Battery Cell Voltage"
    id: battery_cell_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (!id(battery_voltage).has_state()) return {};
      return id(battery_voltage).state / 3.0f;

binary_sensor:
  # "Charging" here means the barrel jack is supplying the board. The UPS runs
  # charge and discharge simultaneously, so this is really "mains present"
  # rather than "cells are absorbing" - close enough to gate behaviour on.
  # Threshold is above zero so shunt noise at idle doesn't flap the state.
  - platform: template
    name: "Battery Charging"
    id: battery_charging
    device_class: battery_charging
    lambda: |-
      if (!id(battery_current).has_state()) return {};
      return id(battery_current).state > 0.05f;   // see SIGN CONVENTION above

  # Latching low-battery flag with hysteresis: trips at battery_low_pct, and
  # will not clear until SOC climbs 10 points past it. Without the gap this
  # would chatter every time the sunrise ramps and the pack sags across the
  # threshold. Anything that reacts to low battery should read THIS, not the
  # raw percentage.
  - platform: template
    name: "Battery Low"
    id: battery_low
    device_class: battery
    lambda: |-
      if (!id(battery_level).has_state()) return {};
      float pct = id(battery_level).state;
      if (id(battery_low).state) return pct < (${battery_low_pct} + 10.0f);
      return pct <= ${battery_low_pct};
