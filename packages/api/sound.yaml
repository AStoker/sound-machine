# =====================================================================
# API: THE SOUND SUBSYSTEM  [layer: api]
#
# Every write to the audio chain goes through one of the verbs below. Nothing
# outside this file calls noise.start(), touches the mixer, or makes a
# media_player call - so "what can happen to the sound" is this file's list of
# scripts, and nothing longer.
#
# Reading is unrestricted: external_media_player->volume and
# media_player.is_announcing are state, and behavior packages read them freely
# (see the layer rules in packages/README.md).
#
# THE VERBS
#   noise_play(color_index)   0 = white, 1 = pink, 2 = brown. Sets the colour and
#                             starts the generator.
#   noise_stop()
#   ambience_play(name)       start (or switch to) a flashed ambience, by the
#                             `name:` it is given in ambience_player.files:
#   ambience_stop()
#   media_stop()              stop whatever Home Assistant is playing
#
# GENERATED, FLASHED, STREAMED - and the first two are both AMBIENCES. They own a
# mixer source, start once and run for hours; nothing about them ends, so nothing
# about them can fail to restart. Only Home Assistant's audio and the TTS reply
# go through the media player's pipeline, and neither of those loops. That is
# deliberate: looping through it means `repeat_one`, which restarts the pipeline
# every pass and eventually wedges the channel (FUTURE-DEVELOPMENT T3/T4/T5).
#   volume_apply(fraction)    absolute volume, 0..1, clamped
#   sound_duck() / sound_unduck()   dip BOTH background channels for a voice turn
#
# BOOT ORDER IS A REAL CONSTRAINT. The audio stack is not safe to drive until
# well after setup - starting the noise generator during setup dereferenced an
# uninitialized event group and crashed the device. So:
#   * every verb that starts audio is gated on `audio_ready`, and
#   * the boot hook below waits audio_ready_delay at priority -100, sets the
#     flag, and raises on_audio_ready so behavior can re-apply whatever sound
#     was persisted.
# A verb called before that point is a silent no-op by design, not a bug: the
# restore that follows on_audio_ready is what makes it right.
#
# DEFINES  audio_ready (global), volume_pct (sensor), all the verbs above.
# CONSUMES noise, ambience, external_media_player, noise_mixing_input,
#          media_mixing_input, ambience_mixing_input (hw/audio_chain).
# REQUIRES script on_audio_ready (behavior/sound.yaml).
# =====================================================================
esphome:
  on_boot:
    - priority: -100
      then:
        - delay: ${audio_ready_delay}
        - lambda: 'id(audio_ready) = true;'
        - script.execute: on_audio_ready

globals:
  - id: audio_ready
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  # ---- noise generator ----
  - id: noise_play
    parameters:
      color_index: int
    then:
      - lambda: |-
          // The colour is set unconditionally, even before the stack is ready, so
          // that a restore at boot lands on the right colour the moment
          // on_audio_ready starts the generator.
          id(noise).set_color_index((uint8_t) color_index);
          if (id(audio_ready)) id(noise).start();

  - id: noise_stop
    then:
      - lambda: 'if (id(audio_ready)) id(noise).stop();'

  # ---- sampled ambiences ----
  # Same shape as the noise verbs, and gated on audio_ready for the same reason:
  # starting a mixer source before the stack is up dereferences an event group
  # that does not exist yet.
  #
  # ONE PARAMETERISED VERB, where flashed audio used to need one per file. The
  # old constraint was real - an `audio::AudioFile` id cannot be a script
  # parameter - but a NAME can, so holding the file list inside the component
  # dissolves it. `name` is a `name:` from `ambience_player.files:`
  # (hw/audio_chain.yaml); an unknown one logs there and plays nothing.
  #
  # There is no wait and no repeat flag. The component owns its mixer source
  # outright, so starting an ambience is just starting it, and switching between
  # ambiences does not stop the speaker at all.
  - id: ambience_play
    parameters:
      name: string
    then:
      - lambda: 'if (id(audio_ready)) id(ambience)->start(name);'

  - id: ambience_stop
    then:
      - lambda: 'if (id(audio_ready)) id(ambience)->stop();'

  # ---- media ----
  # ---------------------------------------------------------------------
  # WHAT USED TO BE HERE, AND WHY IT IS NOT
  #
  # There were `media_play_<name>` verbs, a `media_set_repeat`, a
  # `media_wanted_track` global and a bounded wait for the mixer to drain -
  # roughly seventy lines, all of it load-bearing, all of it in service of
  # looping a flashed file through `speaker.media_player`.
  #
  # The wait existed because `repeat_one` does not key off the decoder's
  # end-of-file: it restarts the file only when the media *pipeline* reports
  # PLAYING -> STOPPED, and a mixer source only leaves STATE_RUNNING once its
  # `pending_playback_frames_` counter reaches zero. A source that starts
  # contributing while the output pipeline already holds frames is handicapped by
  # that backlog, and when the callbacks stop before the handicap is paid off the
  # counter freezes short of zero - pipeline PLAYING forever, media channel dead
  # until reboot. Waiting for an empty pipeline bought a zero handicap.
  #
  # It only ever half-worked, and could not do better: `repeat_one` calls
  # `start_file()` straight from SpeakerMediaPlayer::loop(), so the wait
  # protected the FIRST start and no later one. On hardware that meant a gap at
  # every loop and a dead channel after a pass or two (FUTURE-DEVELOPMENT T5).
  #
  # So the flashed files became ambiences instead, and all of it went. Nothing loops
  # through the media player now - it carries the TTS reply and Home Assistant's
  # audio, neither of which repeats. `media_stop` survives because HA can still
  # be told to play something.
  #
  # This was upstream behaviour, not a bug in this config - esphome/esphome#14641
  # ("mixer speaker always reporting playing") is closed as not planned. T3 keeps
  # the details in case a one-shot ever needs them again.
  # ---------------------------------------------------------------------
  - id: media_stop
    then:
      - media_player.stop:

  # ---- volume ----
  # The single place volume is written. Callers pass an absolute fraction; how a
  # knob click maps to a fraction is policy and lives in behavior/sound.yaml.
  - id: volume_apply
    parameters:
      fraction: float
    then:
      - lambda: |-
          float target = fraction;
          if (!(target >= 0.0f)) target = 0.0f;        // nan guard
          if (target > 1.0f) target = 1.0f;
          auto call = id(external_media_player)->make_call();
          call.set_volume(target);
          call.perform();
          id(volume_pct).publish_state(target * 100.0f);

  # ---- ducking ----
  # ALL THREE background channels are always dipped together. Noise, the sampled
  # ambience and media are independent and can play at once, so dipping all of
  # them is correct; dipping a silent channel is a harmless no-op. The spoken
  # reply rides the fourth (announcement) channel and stays at full volume.
  #
  # THE CHANNEL LIST IS WRITTEN ONCE, in sound_duck_apply below, and the two
  # public verbs are just the two depths it gets called at. That is the whole
  # reason for the extra script: when the list lived in both verbs, adding a
  # background channel meant remembering to add it to both, and forgetting the
  # un-duck side left that channel quiet for good with no symptom beyond "that
  # sound got quiet after I talked to it once". Now a new channel is one line
  # that cannot be half-applied.
  - id: sound_duck_apply
    parameters:
      decibels: int
      ramp_ms: int
    then:
      - mixer_speaker.apply_ducking:
          id: noise_mixing_input
          decibel_reduction: !lambda 'return decibels;'
          duration: !lambda 'return ramp_ms;'
      - mixer_speaker.apply_ducking:
          id: ambience_mixing_input
          decibel_reduction: !lambda 'return decibels;'
          duration: !lambda 'return ramp_ms;'
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: !lambda 'return decibels;'
          duration: !lambda 'return ramp_ms;'

  # Dip for a voice turn, and come back out again. Different ramps on purpose:
  # into the dip quickly so the reply is not talked over, back out gently so the
  # background does not swell.
  - id: sound_duck
    then:
      - script.execute:
          id: sound_duck_apply
          decibels: ${duck_decibels}
          ramp_ms: ${duck_ramp_ms}

  - id: sound_unduck
    then:
      - script.execute:
          id: sound_duck_apply
          decibels: 0
          ramp_ms: ${unduck_ramp_ms}

sensor:
  # Volume as a percentage, for Home Assistant. Pushed by volume_apply on every
  # change; the poll is a slow backstop in case HA or the web UI moves the
  # player's volume without going through the verb above.
  - platform: template
    name: "Volume"
    id: volume_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:volume-high"
    update_interval: 5s
    lambda: 'return id(external_media_player)->volume * 100.0f;'
