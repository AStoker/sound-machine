# =====================================================================
# API: THE SOUND SUBSYSTEM  [layer: api]
#
# Every write to the audio chain goes through one of the verbs below. Nothing
# outside this file calls noise.start(), touches the mixer, or makes a
# media_player call - so "what can happen to the sound" is this file's list of
# scripts, and nothing longer.
#
# Reading is unrestricted: external_media_player->volume and
# media_player.is_announcing are state, and behavior packages read them freely
# (see the layer rules in packages/README.md).
#
# THE VERBS
#   noise_play(color_index)   0 = white, 1 = pink, 2 = brown. Sets the colour and
#                             starts the generator.
#   noise_stop()
#   media_play_la_la()        play the flashed file. One verb per flashed track -
#   media_play_crickets()     a media_file id cannot be a script parameter.
#   media_stop()              stop playback and clear repeat
#   media_set_repeat(loop)
#   volume_apply(fraction)    absolute volume, 0..1, clamped
#   sound_duck() / sound_unduck()   dip BOTH background channels for a voice turn
#
# BOOT ORDER IS A REAL CONSTRAINT. The audio stack is not safe to drive until
# well after setup - starting the noise generator during setup dereferenced an
# uninitialized event group and crashed the device. So:
#   * every verb that starts audio is gated on `audio_ready`, and
#   * the boot hook below waits audio_ready_delay at priority -100, sets the
#     flag, and raises on_audio_ready so behavior can re-apply whatever sound
#     was persisted.
# A verb called before that point is a silent no-op by design, not a bug: the
# restore that follows on_audio_ready is what makes it right.
#
# DEFINES  audio_ready, media_wanted_track (globals), volume_pct (sensor), all
#          the verbs above.
# CONSUMES noise, external_media_player, mixing_speaker, noise_mixing_input,
#          media_mixing_input, la_la_sad, crickets (hw/audio_chain).
# REQUIRES script on_audio_ready (behavior/sound.yaml).
# =====================================================================
esphome:
  on_boot:
    - priority: -100
      then:
        - delay: ${audio_ready_delay}
        - lambda: 'id(audio_ready) = true;'
        - script.execute: on_audio_ready

globals:
  - id: audio_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  # Which flashed track the machine currently wants playing, as a TRACKS index,
  # or -1 for none. Exists only to arbitrate the drain wait in the play verbs
  # below - it is not the sound state, which lives in behavior/sound.yaml.
  - id: media_wanted_track
    type: int
    restore_value: no
    initial_value: '-1'

script:
  # ---- noise generator ----
  - id: noise_play
    parameters:
      color_index: int
    then:
      - lambda: |-
          // The colour is set unconditionally, even before the stack is ready, so
          // that a restore at boot lands on the right colour the moment
          // on_audio_ready starts the generator.
          id(noise).set_color_index((uint8_t) color_index);
          if (id(audio_ready)) id(noise).start();

  - id: noise_stop
    then:
      - lambda: 'if (id(audio_ready)) id(noise).stop();'

  # ---- media ----
  - id: media_set_repeat
    parameters:
      loop: bool
    then:
      - if:
          condition:
            lambda: 'return loop;'
          then:
            - media_player.repeat_one:
          else:
            - media_player.repeat_off:

  # One verb per flashed track. Looping follows whatever media_set_repeat was
  # last told.
  #
  # ---------------------------------------------------------------------
  # WHY EVERY TRACK WAITS FOR THE MIXER TO DRAIN FIRST
  #
  # `repeat_one` does NOT key off the decoder's end-of-file, whatever the name
  # suggests. It is implemented in SpeakerMediaPlayer::loop(), and it restarts
  # the file only when the media *pipeline* reports PLAYING -> STOPPED. That
  # transition walks back through the resampler to media_mixing_input, and a
  # mixer source speaker only leaves STATE_RUNNING once its
  # `pending_playback_frames_` counter reaches zero.
  #
  # That counter is drained by the i2s speaker's output callback, which fires
  # ONLY for buffers containing real audio. And a source speaker that starts
  # contributing while the output pipeline already holds frames is given a
  # `playback_delay_frames_` handicap equal to that backlog, which is drained
  # FIRST. So when a track ends and nothing else is making sound, the callbacks
  # stop before the handicap is paid off, the counter freezes short of zero, and
  # media_mixing_input is left in STATE_STOPPING for good. The pipeline reports
  # PLAYING forever: repeat never fires, and - because the resampler is in
  # passthrough here (mono 48 kHz in, 48 kHz out) and so has no ring buffer to
  # fall back on - every later play is silently discarded too. One track, then
  # a dead media channel until reboot.
  #
  # Noise escapes this because it first contributes at boot, when the pipeline
  # is empty and the handicap is zero.
  #
  # Waiting for the mixer to report an empty pipeline before handing it a track
  # buys the same zero handicap, so the counter can drain exactly to zero at
  # end-of-file and the transition happens. The wait is bounded: on timeout we
  # play anyway, which is no worse than not waiting at all.
  #
  # This is upstream behaviour, not a bug in this config - esphome/esphome#14641
  # ("mixer speaker always reporting playing") is closed as not planned, and
  # mixer_speaker.cpp / resampler_speaker.cpp / speaker_media_player.cpp /
  # audio_pipeline.cpp in 2026.7.2 are all byte-identical to upstream `dev`.
  # See FUTURE-DEVELOPMENT T3 for the fallback if this ever stops holding.
  #
  # media_wanted_track is what makes the wait safe: the play only happens if the
  # track it was queued for is still the one wanted. Switching tracks or calling
  # media_stop during the (~150 ms) wait cancels it rather than racing it.
  # ---------------------------------------------------------------------
  - id: media_play_la_la
    mode: restart
    then:
      - lambda: 'id(media_wanted_track) = 0;'
      - wait_until:
          condition:
            lambda: 'return id(mixing_speaker)->get_frames_in_pipeline() == 0;'
          timeout: ${media_drain_timeout}
      - if:
          condition:
            lambda: 'return id(media_wanted_track) == 0;'
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: la_la_sad
                announcement: false

  - id: media_play_crickets
    mode: restart
    then:
      - lambda: 'id(media_wanted_track) = 1;'
      - wait_until:
          condition:
            lambda: 'return id(mixing_speaker)->get_frames_in_pipeline() == 0;'
          timeout: ${media_drain_timeout}
      - if:
          condition:
            lambda: 'return id(media_wanted_track) == 1;'
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: crickets
                announcement: false

  - id: media_stop
    then:
      # -1 is "no track wanted", which also cancels a play still waiting on the
      # mixer to drain. Without it a stop issued during that window would be
      # overtaken by the play it was meant to pre-empt.
      - lambda: 'id(media_wanted_track) = -1;'
      - media_player.repeat_off:
      - media_player.stop:

  # ---- volume ----
  # The single place volume is written. Callers pass an absolute fraction; how a
  # knob click maps to a fraction is policy and lives in behavior/sound.yaml.
  - id: volume_apply
    parameters:
      fraction: float
    then:
      - lambda: |-
          float target = fraction;
          if (!(target >= 0.0f)) target = 0.0f;        // nan guard
          if (target > 1.0f) target = 1.0f;
          auto call = id(external_media_player)->make_call();
          call.set_volume(target);
          call.perform();
          id(volume_pct).publish_state(target * 100.0f);

  # ---- ducking ----
  # Both background channels are always dipped together. Noise and media are
  # independent and can play at once, so dipping both is correct; dipping a
  # silent channel is a harmless no-op. The spoken reply rides the third
  # (announcement) channel and stays at full volume.
  - id: sound_duck
    then:
      - mixer_speaker.apply_ducking:
          id: noise_mixing_input
          decibel_reduction: ${duck_decibels}
          duration: ${duck_ramp}
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: ${duck_decibels}
          duration: ${duck_ramp}

  - id: sound_unduck
    then:
      - mixer_speaker.apply_ducking:
          id: noise_mixing_input
          decibel_reduction: 0
          duration: ${unduck_ramp}
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: ${unduck_ramp}

sensor:
  # Volume as a percentage, for Home Assistant. Pushed by volume_apply on every
  # change; the poll is a slow backstop in case HA or the web UI moves the
  # player's volume without going through the verb above.
  - platform: template
    name: "Volume"
    id: volume_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:volume-high"
    update_interval: 5s
    lambda: 'return id(external_media_player)->volume * 100.0f;'
