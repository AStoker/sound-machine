# =====================================================================
# API: THE KNOB INDICATOR - the NeoPixel inside the rotary encoder  [layer: api]
#
# The only writer of that pixel. Callers say what it should MEAN (a hue, a flash,
# a glow) and this file owns everything about how it gets there: the fade, the
# perceptual curve, the ambient brightness ceiling, and - most importantly - how
# often the seesaw is written to at all.
#
# THE VERBS
#   indicator_set_hue(degrees)  0 = red, 120 = green, 240 = blue. The colour the
#                               pixel shows whenever it is lit.
#   indicator_flash()           snap to full and hold for knob_led_hold_ms after
#                               the LAST call, then fade. The "something is
#                               happening" signal.
#   indicator_glow_set(on)      a gentle standing glow at knob_led_near_level -
#                               "the knob is here", for finding it in the dark.
#
# WHO WINS: a flash always beats a glow; with neither, the pixel fades to black.
#
# WHY THIS DRIVES THE PIXEL FROM A LAMBDA INSTEAD OF THE `light:` PLATFORM
# The vendored seesaw component does provide a light platform (see
# components/seesaw/light/), and using it would be the obvious choice. It is
# deliberately NOT used:
#   * ESPHome's light transitions call write_state() once per main-loop iteration,
#     and every one of those is 2 I2C transactions to the seesaw. That is hundreds
#     of writes/second, on a bus this build has already had to slow to 100kHz
#     because the XVF3800 was being starved. The interval below is a hard 20 Hz
#     ceiling instead, and it writes NOTHING while the pixel is idle or already at
#     its target.
#   * It would also publish a light entity's state to HA at that same rate.
# So the fade/gamma/colour maths lives here and calls the component's public
# color_neopixel() directly. Trade-off: no "Knob LED" light entity in HA. The
# pixel is a status indicator, not a lamp.
#
# DEFINES  indicator_inited, indicator_level, indicator_hold_until_ms,
#          indicator_hue_deg, indicator_glow (globals), the three verbs, and the
#          pixel's tick.
# CONSUMES seesaw_hub (hw/knob), ambient_level (hw/ambient_light).
# =====================================================================
globals:
  # The pixel's pin/length/speed are configured on the seesaw once, then only
  # colour bytes are sent. Cleared on the way to black so a seesaw brownout reset
  # is repaired on the next wake (the chip has no NVM) - the same self-healing
  # idea as matrix_inited in hw/matrix.yaml.
  - id: indicator_inited
    type: bool
    restore_value: no
    initial_value: 'false'
  # Current fade position, 0.0 (off) .. 1.0 (full). LINEAR - the perceptual curve
  # and the ambient scaling are applied on top when the bytes are built.
  - id: indicator_level
    type: float
    restore_value: no
    initial_value: '0.0f'
  # Absolute millis() deadline: hold at full until this passes. Pushed forward by
  # every indicator_flash(), so a slow scroll through the volume range keeps the
  # pixel lit the whole way.
  - id: indicator_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # The colour, as a hue in degrees.
  - id: indicator_hue_deg
    type: float
    restore_value: no
    initial_value: '240.0f'
  - id: indicator_glow
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: indicator_set_hue
    parameters:
      degrees: float
    then:
      - lambda: 'id(indicator_hue_deg) = degrees;'

  - id: indicator_flash
    then:
      - lambda: |-
          // 0 is the "no hold pending" sentinel, so nudge a deadline that lands
          // exactly there (a 1.5s window once every 49.7 days of uptime).
          uint32_t deadline = millis() + ${knob_led_hold_ms}u;
          id(indicator_hold_until_ms) = deadline ? deadline : 1u;

  # NB: the parameter is `enabled`, not `on` - a bare `on:` key is parsed as the
  # boolean true by YAML, so it can never be used as a script parameter name.
  - id: indicator_glow_set
    parameters:
      enabled: bool
    then:
      - lambda: 'id(indicator_glow) = enabled;'

interval:
  # The pixel's only heartbeat. Slews the level toward its target, rebuilds the
  # colour, and writes ONLY when the resulting bytes actually differ - so a steady
  # pixel, lit or dark, costs zero I2C traffic.
  - interval: ${knob_led_fade_ms}ms
    then:
      - lambda: |-
          const float TICK_MS     = ${knob_led_fade_ms};
          const float RISE_ACTIVE = ${knob_led_rise_active_ms};   // flash: snap on
          const float RISE_NEAR   = ${knob_led_rise_near_ms};     // glow: ease on
          const float FALL_MS     = ${knob_led_fade_out_ms};      // always gentle
          const float LEVEL_GLOW  = ${knob_led_near_level}f;      // standing glow, 0..1
          const float SCALE_MIN   = ${knob_led_min}f;             // ceiling when dark
          const float SCALE_MAX   = ${knob_led_max}f;             // ceiling in daylight
          const float GAMMA       = ${knob_led_gamma}f;

          // ---- where should the pixel be? ----
          // The deadline is CLEARED the moment it expires, not just compared
          // against. A signed-difference compare against a stale deadline is only
          // rollover-safe for 2^31 ms: leave a long-past deadline sitting there
          // and after ~24.8 days of uptime the difference flips positive and the
          // pixel latches on. Clearing keeps it live for its intended window only.
          uint32_t hold_until = id(indicator_hold_until_ms);
          bool holding = (hold_until != 0) && ((int32_t) (hold_until - millis()) > 0);
          if (!holding && hold_until != 0) id(indicator_hold_until_ms) = 0;
          float target = holding ? 1.0f : (id(indicator_glow) ? LEVEL_GLOW : 0.0f);

          // ---- slew toward it (fast up on a flash, easy up on a glow, always
          //      slow down, so the pixel never blinks off) ----
          float level = id(indicator_level);
          if (level < target) {
            level += TICK_MS / (holding ? RISE_ACTIVE : RISE_NEAR);
            if (level > target) level = target;
          } else if (level > target) {
            level -= TICK_MS / FALL_MS;
            if (level < target) level = target;
          }
          id(indicator_level) = level;

          // ---- hue -> RGB (a full sweep, so every intermediate value gets its
          //      own shade instead of snapping between a few colours) ----
          float hue = id(indicator_hue_deg);
          hue = fmodf(hue, 360.0f);
          if (hue < 0.0f) hue += 360.0f;
          float sector = hue / 60.0f;
          int   sector_index = ((int) sector) % 6;
          float ramp = sector - floorf(sector);       // 0..1 within the sector
          float ramp_down = 1.0f - ramp;
          float red = 0.0f, green = 0.0f, blue = 0.0f;
          switch (sector_index) {
            case 0: red = 1.0f;      green = ramp;      blue = 0.0f;      break;
            case 1: red = ramp_down; green = 1.0f;      blue = 0.0f;      break;
            case 2: red = 0.0f;      green = 1.0f;      blue = ramp;      break;
            case 3: red = 0.0f;      green = ramp_down; blue = 1.0f;      break;
            case 4: red = ramp;      green = 0.0f;      blue = 1.0f;      break;
            default: red = 1.0f;     green = 0.0f;      blue = ramp_down; break;
          }

          // ---- how bright may it get? Follows the same ambient auto-dim the
          //      clock uses, because this pixel sits 60cm from a face at 3am too.
          int ambient = id(ambient_level);
          if (ambient < 0) ambient = 0;
          if (ambient > 15) ambient = 15;
          float ceiling = SCALE_MIN + (SCALE_MAX - SCALE_MIN) * (ambient / 15.0f);
          // NB: named 'intensity', not 'output' - esphome::output is a namespace
          // and main.cpp has `using namespace esphome`, so a local of that name
          // would hide it for the rest of the scope.
          float intensity = ceiling * powf(level, GAMMA);   // gamma = perceptual fade

          float red_f   = red   * 255.0f * intensity;
          float green_f = green * 255.0f * intensity;
          float blue_f  = blue  * 255.0f * intensity;
          uint8_t red_b   = (uint8_t) lroundf(red_f);
          uint8_t green_b = (uint8_t) lroundf(green_f);
          uint8_t blue_b  = (uint8_t) lroundf(blue_f);
          // At the dim end (dark room + the faint glow) the whole colour can round
          // to zero and the pixel would just never appear. Keep the dominant
          // channel at 1 rather than losing the bottom of the range.
          if (intensity > 0.0f && red_b == 0 && green_b == 0 && blue_b == 0) {
            if (red_f >= green_f && red_f >= blue_f) red_b = 1;
            else if (green_f >= blue_f) green_b = 1;
            else blue_b = 1;
          }

          // ---- write only on a real change ----
          static uint8_t last_red = 0, last_green = 0, last_blue = 0;
          static bool have_written = false;
          if (have_written && red_b == last_red && green_b == last_green && blue_b == last_blue)
            return;
          last_red = red_b; last_green = green_b; last_blue = blue_b;
          have_written = true;

          // Configure the pixel BEFORE any write, including the black one the
          // first tick does - on a warm reboot the seesaw keeps running and would
          // otherwise sit there holding whatever colour it had before, since a
          // bare colour write does nothing until pin/length are set.
          if (!id(indicator_inited)) {
            id(seesaw_hub)->setup_neopixel(${knob_led_pin});
            id(indicator_inited) = true;
          }
          id(seesaw_hub)->color_neopixel(red_b, green_b, blue_b);
          // Settled at black: forget the config, so the NEXT wake re-sends it.
          // That is the recovery path if the seesaw ever browns out and loses its
          // pin assignment (it has no NVM). Costs 3 tiny writes per wake.
          if (red_b == 0 && green_b == 0 && blue_b == 0) id(indicator_inited) = false;
