# =====================================================================
# API: THE DISPLAY SERVICE  [layer: api]
#
# The one and only way anything in this device puts something on the clock
# display. Nothing outside this file names a display id, a font, a panel or a
# pixel; nothing outside the DRIVER touches the display's I2C address.
#
#          behavior/*  ->  display_show_* (here)  ->  matrix->paint(frame)
#
# WHY THIS IS A SEPARATE FILE FROM THE DRIVER. Not for pluggability - there is
# exactly one display and no plan for another. The split is that deciding WHAT to
# show is a completely different problem from drawing it: priority between four
# competing sources, expiry, and clock formatting are pure policy over strings,
# while the driver is fonts, panel geometry and register bursts. It lives in
# components/clock_display (C++, like every other register-level driver in this
# build) rather than in a YAML lambda, which is what lets the contract between
# the two be a struct the compiler checks.
#
# WHAT THIS LAYER OWNS
#   * the OVERLAYS below and their priority,
#   * expiring them,
#   * choosing the DEFAULT VIEW shown when no overlay is up,
#   * building the clock, so 12h/24h formatting lives in one place,
#   * the single heartbeat that keeps all of the above honest.
#
# WHAT THE DRIVER OWNS
#   * `paint(frame)`, which renders that Frame and nothing else. It makes no
#     decisions about what to show, and it skips the I2C write when the frame
#     resolves to what is already on the glass.
#
# TWO KINDS OF CONTENT, and the distinction is the whole design:
#
#   OVERLAYS are transient. Something just happened and the display says so for
#   a few seconds, then gets out of the way. Every overlay is timed.
#
#   DEFAULT VIEWS are what the display is *resting on* - what it shows when
#   nothing has happened lately. There is always exactly one; normally it is the
#   clock.
#
# THE OVERLAYS, highest priority first:
#   message  timed   Home Assistant authored text (behavior/message.yaml)
#   status   timed   a device announcement, e.g. "CHG"  (any behavior)
#   code     timed   a short code from a user action: "L1", "S3", "42"
#
# THE DEFAULT VIEWS, highest priority first:
#   alert    sticky  a condition that persists, e.g. "LOW"
#   clock    always  the last resort, and the usual answer
#
# THE CHANNEL DECIDES WHEN, NOT HOW IT LOOKS. Every one of them is drawn in the
# same font in the same place, so nothing on this display looks like it came from
# a different machine. Up to 4 characters sits still; longer text scrolls. That is
# the only difference length makes, and it is the same rule for all four.
#
# WHY AN ALERT IS A DEFAULT VIEW AND NOT A HIGH-PRIORITY OVERLAY. It was one
# once, and it made a flat battery feel like a broken machine: "LOW" is sticky,
# so it outranked every code, and turning the knob or cycling a light preset
# showed nothing at all. But a sticky condition is not an event - it is not
# competing with the volume readout for the same instant, it is describing what
# the display should say when it has nothing better to do. Demoting it below the
# overlays says exactly that: a low pack replaces the CLOCK, not the feedback.
#
# It also removes a special case. Status used to be documented as outranking
# alert so that plugging in a flat pack showed "CHG" rather than "LOW"; now
# every overlay outranks every default, so that behaviour falls out for free.
#
# Adding a time-of-day default (a dimmer night face, a weekend face) is a row in
# the defaults table plus a setter - the same shape as adding an overlay.
#
# THE FRAME - the driver's entire input - is a struct, `clock_display::Frame`,
# defined and documented in components/clock_display/clock_display.h. It is built as a
# LOCAL in display_refresh below and handed straight over, so there is no
# half-updated frame to reason about and nothing to keep in sync between ticks.
# (It used to be four globals plus a prose contract repeated in two file headers.
# The compiler now checks what those paragraphs used to ask for.)
#
# DEFINES  the overlay + default-view globals, display_scroll_ms,
#          display_show_message, display_show_status, display_show_code,
#          display_set_alert, display_set_scroll_speed, display_refresh, and the
#          display tick.
# CONSUMES ds3231_time (hw/rtc), ambient_level (hw/ambient_light),
#          matrix (hw/matrix.yaml).
# =====================================================================
globals:
  # ---- overlay state ----
  # Each overlay is an expiry STAMP rather than a running timer, so a second
  # event simply overwrites it (last one wins) with no script cancellation to
  # reason about. The resolve step CLEARS an overlay it finds expired, which is
  # what keeps the signed-difference compare below safe past the ~24.8 day mark
  # where a stale deadline would otherwise read as future.
  - id: display_message_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: display_message_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: display_status_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: display_status_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: display_code_text
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: display_code_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # ---- default-view state ----
  # Sticky: no expiry, because it is not describing an event. Set to "" to
  # clear. A future default view (night face, weekend face) gets its own global
  # here and its own row in the defaults table below.
  - id: display_alert_text
    type: std::string
    restore_value: no
    initial_value: '""'

  # Scroll rate for overflowing text. Persisted because it is a user preference.
  # The only piece of the frame that outlives the tick that builds it.
  - id: display_scroll_ms
    type: int
    restore_value: yes
    initial_value: '${display_scroll_ms_per_px_default}'

script:
  # ---- the public API: four ways to put something on the display ----
  # Each one stamps its overlay (or the default view) and repaints immediately,
  # so feedback is instant rather than waiting up to one tick.

  # A Home Assistant authored message - the one channel that is routinely long
  # enough to scroll.
  # This is the only channel fed by free text, so it is the only one that trims:
  # a trailing space is invisible but still occupies a glyph cell, which would
  # push centred text off-centre. Callers should not have to know that.
  - id: display_show_message
    parameters:
      text: string
      seconds: int
    then:
      - lambda: |-
          std::string trimmed = text;
          const size_t end = trimmed.find_last_not_of(' ');
          trimmed = (end == std::string::npos) ? std::string() : trimmed.substr(0, end + 1);
          id(display_message_text) = trimmed;
          id(display_message_until_ms) = millis() + (uint32_t) (seconds > 0 ? seconds : 1) * 1000u;
      - script.execute: display_refresh

  # A device announcement. Keep it to 4 characters so it sits still - a status is
  # meant to occupy a few seconds, and a scrolling pass takes far longer than
  # that. See settings.yaml section 4.
  - id: display_show_status
    parameters:
      text: string
      seconds: int
    then:
      - lambda: |-
          id(display_status_text) = text;
          id(display_status_until_ms) = millis() + (uint32_t) (seconds > 0 ? seconds : 1) * 1000u;
      - script.execute: display_refresh

  # A short code from a user action ("L1", "S3", "OFF", a volume percentage).
  # Fixed duration - callers never need to care how long it lingers.
  - id: display_show_code
    parameters:
      text: string
    then:
      - lambda: |-
          id(display_code_text) = text;
          id(display_code_until_ms) = millis() + (uint32_t) ${display_code_seconds} * 1000u;
      - script.execute: display_refresh

  # Raise or clear the sticky alert - the DEFAULT VIEW used in place of the
  # clock while some condition holds. It does not interrupt anything: overlays
  # still show over the top of it, so a low pack does not silence the volume
  # readout or the preset codes. Pass "" to clear.
  # It is safe to call on a tick with an unchanged value - the compare below is
  # the whole cost - which is what lets behavior/power.yaml re-derive it rather
  # than latch it on an edge. Logging the transition (and only the transition)
  # is worth it: this channel is the one thing on the display that can be wrong
  # for hours without anyone touching the device.
  - id: display_set_alert
    parameters:
      text: string
    then:
      - lambda: |-
          if (id(display_alert_text) != text) {
            ESP_LOGI("display", "alert %s", text.empty() ? "cleared" : text.c_str());
            id(display_alert_text) = text;
          }
      - script.execute: display_refresh

  # The one place the scroll rate is bounded, so the driver can use the value
  # without re-checking it. Repaints like its siblings, so dragging the slider in
  # Home Assistant changes the speed of a scroll already in progress.
  - id: display_set_scroll_speed
    parameters:
      milliseconds: int
    then:
      - lambda: |-
          int ms = milliseconds;
          if (ms < ${display_scroll_ms_per_px_min}) ms = ${display_scroll_ms_per_px_min};
          if (ms > ${display_scroll_ms_per_px_max}) ms = ${display_scroll_ms_per_px_max};
          id(display_scroll_ms) = ms;
      - script.execute: display_refresh

  # ---- resolve + paint ----
  # Turns the overlays and the default view into a Frame, and hands it to the
  # driver. This is the ONLY caller of paint().
  - id: display_refresh
    then:
      - lambda: |-
          const uint32_t now_ms = millis();

          clock_display::Frame frame;

          // ---- 1. OVERLAYS ----
          // PRIORITY IS THIS LIST, in order. Each entry is (text, expiry).
          // Adding an overlay is a row here plus a setter above - there is no
          // cascade of branches to extend and no second place that encodes the
          // order.
          //
          // EVERY CHANNEL LOOKS THE SAME on the glass. There is no per-channel
          // font or placement to choose: the driver draws whatever it is given in
          // the same font, in the same seam-free slots, so a low-battery warning
          // and a volume readout are the same size in the same place. The only
          // thing length changes is whether the text sits still or scrolls.
          struct Overlay { std::string *text; uint32_t *until; };
          const Overlay overlays[] = {
            {&id(display_message_text), &id(display_message_until_ms)},
            {&id(display_status_text),  &id(display_status_until_ms)},
            {&id(display_code_text),    &id(display_code_until_ms)},
          };

          bool overlaid = false;
          for (const Overlay &overlay : overlays) {
            if (overlay.text->empty())
              continue;
            // An overlay is live while its stamp is still in the future. Expired
            // text is CLEARED rather than merely skipped - see the note on the
            // globals above for why that matters past 24.8 days of uptime.
            if ((int32_t) (*overlay.until - now_ms) <= 0) {
              overlay.text->clear();
              continue;
            }
            frame.text = *overlay.text;
            overlaid = true;
            break;
          }

          // ---- 2. THE DEFAULT VIEW ----
          // What the display rests on when no overlay is up. Same shape as the
          // table above minus expiry: first non-empty wins, and falling off the
          // end leaves the frame text EMPTY, which the driver reads as "draw the
          // clock". The clock is therefore the default view by omission - it
          // needs no row, and nothing can displace it but a view that has
          // deliberately claimed the slot.
          if (!overlaid) {
            std::string *const defaults[] = {
              &id(display_alert_text),
            };
            for (std::string *view : defaults) {
              if (view->empty())
                continue;
              frame.text = *view;
              break;
            }
          }

          // The clock. '_' marks a blank slot; an empty string means the RTC has
          // nothing valid to show and the driver says so.
          const bool use_24h = ${clock_24h_mode};
          auto now = id(ds3231_time).now();
          if (now.is_valid()) {
            int hour = now.hour;
            if (!use_24h) { hour = hour % 12; if (hour == 0) hour = 12; }
            const int minute = now.minute;
            frame.clock.push_back(hour >= 10 ? (char) ('0' + hour / 10) : '_');  // blank leading zero
            frame.clock.push_back((char) ('0' + hour % 10));
            frame.clock.push_back((char) ('0' + minute / 10));
            frame.clock.push_back((char) ('0' + minute % 10));
          }

          // Both passed straight through: hw/ambient_light.yaml is the only
          // writer of the level and clamps to 0..15 there, and the scroll rate is
          // bounded by display_set_scroll_speed. Re-checking either here would
          // only hide a bug in its owner.
          frame.level     = (uint8_t) id(ambient_level);
          frame.scroll_ms = (uint16_t) id(display_scroll_ms);

          id(matrix)->paint(frame);

interval:
  # THE display heartbeat, and the only one. It expires overlays, advances
  # a scroll, and notices the minute rolling over.
  #
  # It is safe to run this several times a second because paint() compares the
  # frame against what it last drew and returns before touching I2C when nothing
  # visible changed. An idle tick costs building a small struct and comparing it;
  # a real repaint costs ~300 bytes on a 100kHz bus, which is why the dedup is the
  # driver's responsibility rather than something callers must think about.
  - interval: ${display_tick_ms}ms
    then:
      - script.execute: display_refresh
