# =====================================================================
# AMBIENT / DISPLAY SUBSTRATE - the display-agnostic shared layer
#
# This package holds everything the CLOCK DISPLAY needs that is NOT specific to
# a particular display device: the ambient-light auto-dim (produces
# display_brightness), the transient preset-code state, and the single 1s tick.
# It was split out of the old 7-seg package so that the 7-seg and the matrix are
# interchangeable "display" packages - exactly ONE of them is loaded at a time,
# and each one only has to provide a `render_display` script. Swap which display
# you use by editing the `packages:` block in soundmachine.yaml; nothing here
# changes.
#
# Defines ids: display_brightness, display_brightness_last, preset_code,
#   showing_preset, show_preset_code, status_message, status_message_until_ms,
#   show_status_message, ambient_light, plus the 1s render tick.
# Consumes: render_display  <-- MUST be provided by the active display package
#   (packages/matrix.yaml today, or packages/display.yaml for the 7-seg).
#   Also internal_i2c (main) via the BH1750.
#
# preset_code / showing_preset are set by the Sound and Crescent Preset selects
# (audio, lighting), which then call show_preset_code. The active display reads
# them in its render_display.
#
# status_message is the OTHER transient channel: whole-word announcements raised
# by device events rather than by a user turning a knob (today: the power-source
# change messages in battery.yaml). It lives here, not in the display package,
# so an event source like battery.yaml never has to reference a display-specific
# id - which would break the documented matrix <-> 7-seg swap.
# =====================================================================
globals:
  - id: display_brightness
    type: int
    restore_value: no
    initial_value: '9'      # sensible mid default until first lux read
  - id: display_brightness_last
    type: int
    restore_value: no
    initial_value: '-1'     # forces first write
  # Transient display state: while showing_preset is true the active display
  # shows preset_code (e.g. "L1"/"S3") instead of the clock.
  - id: preset_code
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: showing_preset
    type: bool
    restore_value: no
    initial_value: 'false'
  # Transient STATUS message: a whole word raised by a device event, shown until
  # status_message_until_ms passes. Deliberately expiry-stamped rather than
  # script-timed like showing_preset, so a second event can simply overwrite it
  # (last one wins) with no script cancellation to reason about. The active
  # display treats it as "live" only while the text is non-empty AND the stamp is
  # still in the future, so nothing has to clear it.
  - id: status_message
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: status_message_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

script:
  # Flash preset_code for preset_code_seconds, then revert to the clock.
  # mode: restart so rapid toggles keep showing the latest code. render_display
  # is provided by whichever display package is active (matrix / 7-seg).
  - id: show_preset_code
    mode: restart
    then:
      - lambda: 'id(showing_preset) = true;'
      - script.execute: render_display
      - delay: ${preset_code_seconds}
      - lambda: 'id(showing_preset) = false;'
      - script.execute: render_display

  # Announce a short word/phrase for `seconds`, then fall back to whatever the
  # display would otherwise show. Callers pass their own text so this stays
  # generic; keep the text SHORT - see the note on width in matrix.yaml.
  # NOTE: the 7-seg display package can only render 4 characters and truncates.
  - id: show_status_message
    parameters:
      text: string
      seconds: int
    then:
      - lambda: |-
          id(status_message) = text;
          id(status_message_until_ms) = millis() + (uint32_t) (seconds > 0 ? seconds : 1) * 1000u;
      - script.execute: render_display

interval:
  # The single display heartbeat. The active display's render_display decides
  # what to paint (status message / low-battery warning / preset code / clock)
  # and self-throttles its I2C writes, so ticking every second is cheap. This
  # tick is also what retires an expired status_message.
  - interval: 1s
    then:
      - script.execute: render_display

sensor:
  # Ambient light -> auto-dims whatever display is active (7-seg or matrix, both
  # read display_brightness).
  - platform: bh1750
    id: ambient_light
    name: "Ambient Light"
    address: 0x23
    update_interval: 5s
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 2
    on_value:
      - lambda: |-
          // Auto-dim the display. Eyes respond to light roughly logarithmically,
          // so the map is log-in-lux rather than linear - a linear map spends
          // almost its whole range on daylight and leaves the whole dim end
          // pinned at one level.
          //
          // Tuned DARK on purpose (this thing lives 60cm from a face at 3am):
          //   below display_lux_dark lux the display sits at the hardware floor,
          //   and display_dim_gamma > 1 holds the curve down through the middle
          //   so an ordinary lamp-lit room is still only ~level 5, not 9.
          //
          // display_brightness is a 0..15 abstract level: the 7-seg maps it to
          // its HT16K33 brightness register, the matrix scales it into a PWM
          // range. NOTE ON THE FLOOR: HT16K33 level 0 is 1/16 duty and is as dim
          // as that chip goes; the matrix keeps a small PWM floor of its own.
          float lux = x;
          if (!(lux >= 0.0f)) lux = 0.0f;               // nan/negative guard

          const float lux_dark   = ${display_lux_dark};
          const float lux_bright = ${display_lux_bright};
          const float level_min  = ${display_level_min};
          const float level_max  = ${display_level_max};

          float target;
          if (lux <= lux_dark) {
            target = level_min;
          } else if (lux >= lux_bright) {
            target = level_max;
          } else {
            // Normalised position between the two anchors, in log space.
            float t = logf(lux / lux_dark) / logf(lux_bright / lux_dark);
            target = level_min + (level_max - level_min) * powf(t, ${display_dim_gamma}f);
          }

          // Slew toward the target instead of snapping. The BH1750's moving
          // average already kills sample jitter; this stops a visible step when
          // you walk past the sensor or the room light crosses a boundary.
          static float smoothed = -1.0f;
          if (smoothed < 0.0f) smoothed = target;       // first reading: jump
          smoothed += (target - smoothed) * 0.35f;

          int display_level = (int) lroundf(smoothed);
          if (display_level < 0)  display_level = 0;
          if (display_level > 15) display_level = 15;
          id(display_brightness) = display_level;
          // render_display only pushes brightness when the value actually
          // changes, so calling this every reading is cheap.
