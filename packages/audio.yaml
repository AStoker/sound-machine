# =====================================================================
# AUDIO - amp, I2S path, noise generator, media, wake word, voice assistant,
#         and the physical controls that drive sound (volume knob + knob press)
#
# Owns the whole audio chain from the TPA2016 amp through the XVF3800 voice
# stack, plus the Sound / Media Preset selects and the seesaw volume knob.
#
# Defines ids: enc_last, enc_init, sound_ducked, booted, sound_option,
#   sound_option_last, resume_if_ducked, duck_watchdog, cycle_sound_preset,
#   turn_off_sound, amp, seesaw_hub, volume_knob, volume_pct, sound_select,
#   media_select, media_loop, i2s_output/i2s_input, aic3104_dac, i2s_mics,
#   the speakers/mixer inputs, noise, external_media_player, respeaker, mww, va.
# Consumes (display): preset_code + show_preset_code (via the Sound select).
# Consumes (knob): volume_feedback - the volume knob calls it on every real
#   change to light the encoder's NeoPixel + show the level (packages/knob.yaml).
# booted is flipped true by the main config's esphome:on_boot.
# =====================================================================
globals:
  # enc_last/init: delta tracking for the encoder volume knob.
  - id: enc_last
    type: int
    restore_value: no
    initial_value: '0'
  - id: enc_init
    type: bool
    restore_value: no
    initial_value: 'false'
  # Tracks whether we ducked a background sound (noise OR La La) for a voice
  # turn, so resume_if_ducked only un-ducks sound that WE ducked.
  - id: sound_ducked
    type: bool
    restore_value: no
    initial_value: 'false'
  # False until on_boot finishes (priority -100). The Sound select checks this
  # so it never starts the noise generator during setup (that crashed before).
  - id: booted
    type: bool
    restore_value: no
    initial_value: 'false'
  # Persisted current Sound selection = source of truth (the Sound select reads
  # this on boot). Avoids reading a select's .state in lambdas.
  - id: sound_option
    type: std::string
    restore_value: yes
    initial_value: '"Off"'
  # Last non-off sound so turning it back on restores what was playing.
  - id: sound_option_last
    type: std::string
    restore_value: yes
    initial_value: '"White"'

script:
  # Restore any background sound we ducked for a voice turn. Un-ducks BOTH
  # channels so it works whether the noise generator or the La La file was
  # playing (the inactive channel un-duck is a harmless no-op).
  - id: resume_if_ducked
    then:
      - if:
          condition:
            lambda: 'return id(sound_ducked);'
          then:
            - mixer_speaker.apply_ducking:
                id: noise_mixing_input
                decibel_reduction: 0
                duration: 0.5s
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 0.5s
            - lambda: 'id(sound_ducked) = false;'

  # Watches a voice turn and restores the ducked sound when the spoken reply
  # finishes. We track is_announcing (NOT idle): the TTS reply is played as an
  # announcement (VA calls set_announcement(true)), while the La La file loops
  # on the media channel. So is_announcing follows only the reply and ignores
  # La La's loop seams. Launched from on_wake_word_detected right after ducking.
  - id: duck_watchdog
    mode: restart
    then:
      # Wait for the reply to start. If none starts in the window (no-reply or
      # error turn), fall through and resume anyway.
      - wait_until:
          condition:
            media_player.is_announcing: external_media_player
          timeout: 10s
      # Then wait for the reply to finish playing (buffer included). Bounded
      # with a timeout so we can't stay ducked forever if the announcement
      # state ever gets stuck (same mixer-state class of issue as idle).
      - wait_until:
          condition:
            not:
              media_player.is_announcing: external_media_player
          timeout: 30s
      - script.execute: resume_if_ducked

  # SOUND controls (encoder button); rotation still = volume. Both drive the
  # single Sound select, which does the work + flashes the S#/OFF code.
  # Single press: next sound (Off -> White -> Pink -> Brown -> White).
  - id: cycle_sound_preset
    then:
      - select.set:
          id: sound_select
          option: !lambda |-
            std::string s = id(sound_option);
            if (s == "Off")   return id(sound_option_last);  // restore what was playing
            if (s == "White") return std::string("Pink");
            if (s == "Pink")  return std::string("Brown");
            return std::string("White");   // Brown -> White

  # Long-press: sound off.
  - id: turn_off_sound
    then:
      - select.set:
          id: sound_select
          option: "Off"

# ---------------------------------------------------------------------
# TPA2016 AMP - written ONCE at boot, then never touched again.
#
# Why this exists at all: left alone the amp powers up with its AGC enabled,
# which fights the software volume and - fatally for this build - makes the
# gain between the DAC and the speakers time-varying. The XVF3800 builds its
# echo reference from what we send the DAC, and AEC can only cancel a LINEAR
# echo path. An active compressor downstream breaks that. Wake word over
# playing noise is the exact case that would fail.
#
# ORDER OF THE REGISTER WRITES MATTERS and is handled inside the component:
# compression must go to 1:1 BEFORE the gain is set, because disabling
# compression narrows the legal gain range from -28..30 dB to 0..30 dB. Set
# gain first and it gets clamped - people end up with a silent amp this way.
#
# gain_db: the ceiling, not the operating point. Volume lives in the AIC3104
#   upstream. Was 6 dB (~1W full-scale); raised to 9 dB (~2W) because the mix
#   was a touch quiet. That's near the PHYSICAL ceiling of a 5V / 4-ohm amp -
#   the limiter parks at ~2.5W - so there isn't much more clean headroom here.
#   Going much past 9 pushes normal peaks into the limiter, which distorts AND
#   makes the DAC->speaker path non-linear again (the exact thing AGC-off was
#   protecting for the XVF3800's AEC). If you hear it clip or "breathe" before
#   the knob maxes out, come back down.
# limiter_level: 9.0 dBV is the top of the range (~2.5W into 4 ohm), just under
#   the clipping point at 5V. It should NEVER engage in normal use - it exists
#   to stop a runaway signal, not to shape dynamics.
# ---------------------------------------------------------------------
tpa2016:
  id: amp
  address: 0x58
  i2c_id: internal_i2c
  compression: "1:1"     # AGC OFF. Do not change without re-testing AEC.
  gain_db: 9
  limiter: true
  limiter_level: 9.0
  noise_gate: false

# ---------------------------------------------------------------------
# SEESAW hub + encoder (volume knob)
# ---------------------------------------------------------------------
seesaw:
  id: seesaw_hub
  address: 0x36

sensor:
  # Rotary encoder -> media player volume
  - platform: seesaw
    type: encoder
    id: volume_knob
    name: "Volume Knob"
    on_value:
      - lambda: |-
          int encoder_position = (int) x;
          // First reading only seeds the baseline; don't move volume yet.
          if (!id(enc_init)) { id(enc_last) = encoder_position; id(enc_init) = true; return; }
          int position_change = encoder_position - id(enc_last);
          id(enc_last) = encoder_position;
          if (position_change == 0) return;
          float current_volume = id(external_media_player)->volume;
          // Larger steps when quiet, finer when loud:
          float step_size = 0.09f - 0.07f * current_volume;   // ~9% near bottom, ~2% near top
          float new_volume = current_volume - position_change * step_size;  // -change matches knob direction
          if (new_volume < 0.0f) new_volume = 0.0f;
          if (new_volume > 1.0f) new_volume = 1.0f;
          auto volume_call = id(external_media_player)->make_call();
          volume_call.set_volume(new_volume);
          volume_call.perform();
          id(volume_pct).publish_state(new_volume * 100.0f);
          // User feedback for the new volume: light the knob's NeoPixel in the
          // volume colour and flash the level on the display. Called from INSIDE
          // this lambda, past the two early returns above, so it fires only on a
          // genuine change - the encoder sensor also publishes 0 once at setup,
          // and an action on the trigger itself would light up at every boot.
          id(volume_feedback)->execute();
  - platform: template
    name: "Volume"
    id: volume_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:volume-high"
    update_interval: 5s
    lambda: 'return id(external_media_player)->volume * 100.0f;'

binary_sensor:
  # Encoder push: tap = next sound, hold = sound off (rotation still = volume)
  - platform: seesaw
    pin: "24"
    name: "Knob Press"
    on_multi_click:
      - timing:                        # quick press -> next sound (and turn on)
          - ON for at most 0.8s
          - OFF for at least 0.2s
        then:
          - script.execute: cycle_sound_preset
      - timing:                        # hold ~1s -> sound off, display "OFF"
          - ON for at least 1s
        then:
          - script.execute: turn_off_sound

# SOUND = Off + the noise colours (replaces the old on/off switch plus a
# separate type select). MEDIA PRESET = Off + playable tracks.
select:
  - platform: template
    name: "Sound"
    id: sound_select
    icon: "mdi:waveform"
    optimistic: true
    restore_value: false          # persistence lives in the sound_option global
    initial_option: "Off"
    options:
      - "Off"
      - "White"
      - "Pink"
      - "Brown"
    set_action:
      - lambda: |-
          std::string sel = x;
          id(sound_option) = sel;           // remember the choice (persisted)
          bool off = (sel == "Off");
          if (!off) id(sound_option_last) = sel;   // remember last real sound
          uint8_t color_index = 0; int sound_number = 1;
          if (sel == "Pink")  { color_index = 1; sound_number = 2; }
          else if (sel == "Brown") { color_index = 2; sound_number = 3; }
          if (!off) id(noise).set_color_index(color_index);
          // Only drive the audio engine after boot (see 'booted') to avoid the
          // start-during-setup crash.
          if (id(booted)) {
            if (off) id(noise).stop(); else id(noise).start();
          }
          id(preset_code) = off ? std::string("OFF")
                                : (std::string("S") + std::to_string(sound_number));
      # Noise and media are mutually exclusive: turning ON a noise colour stops
      # any playing media and syncs the Media Preset select to Off. publish_state
      # (not select.set) so it doesn't re-enter the media set_action or flash a
      # code - it just updates the shown state.
      - if:
          condition:
            lambda: 'return x != "Off";'
          then:
            - media_player.repeat_off:
            - media_player.stop:
            - lambda: 'id(media_select).publish_state("Off");'
      - script.execute: show_preset_code

  # MEDIA PRESET: Off + playable tracks. Each track is either a file flashed
  # into the ESP (play_on_device_media_file, offline-capable) or a URL played
  # to the same media_player (Home Assistant / network). Looping follows the
  # Media Loop switch. Stop via "Off" here or the media_player controls in HA.
  - platform: template
    name: "Media Preset"
    id: media_select
    icon: "mdi:music"
    optimistic: true
    restore_value: false
    initial_option: "Off"
    options:
      - "Off"
      - "La La"
      # - "Rain (HA)"      # example URL-based track (see commented branch below)
    set_action:
      # Noise and media are mutually exclusive: any real track (anything but
      # "Off") stops the noise generator first and syncs the Sound select to Off.
      # publish_state (not select.set) so it doesn't re-enter the Sound set_action
      # or flash the "OFF" code. sound_option_last is left intact, so the knob can
      # still restore the previous colour later.
      - if:
          condition:
            lambda: 'return x != "Off";'
          then:
            - lambda: |-
                if (id(booted)) id(noise).stop();
                id(sound_option) = "Off";
                id(sound_select).publish_state("Off");
      # ----- OFF: stop playback -----
      - if:
          condition:
            lambda: 'return x == "Off";'
          then:
            - media_player.repeat_off:
            - media_player.stop:
      # ----- "La La": a file flashed into the ESP (works with no network) -----
      - if:
          condition:
            lambda: 'return x == "La La";'
          then:
            - if:
                condition:
                  switch.is_on: media_loop
                then:
                  - media_player.repeat_one:
                else:
                  - media_player.repeat_off:
            - media_player.speaker.play_on_device_media_file:
                media_file: la_la_sad
                announcement: false
      # ----- URL / Home Assistant track (uncomment + edit to use) -----
      # - if:
      #     condition:
      #       lambda: 'return x == "Rain (HA)";'
      #     then:
      #       - if:
      #           condition:
      #             switch.is_on: media_loop
      #           then:
      #             - media_player.repeat_one:
      #           else:
      #             - media_player.repeat_off:
      #       - media_player.play_media:
      #           id: external_media_player
      #           media_url: "http://homeassistant.local:8123/local/rain.mp3"

switch:
  # ---- MEDIA loop mode (on = repeat the track, off = play once) ----
  # Read by the "Media Preset" dropdown and by anything you trigger from HA.
  - platform: template
    name: "Media Loop"
    id: media_loop
    icon: "mdi:repeat"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# ---------------------------------------------------------------------
# AUDIO - I2S to/from XVF3800 (pins fixed by Flex routing)
# ---------------------------------------------------------------------
i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

audio_dac:
  - platform: aic3104
    id: aic3104_dac
    address: 0x18
    i2c_id: internal_i2c

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 48000
    i2s_mode: secondary
    i2s_dout_pin: GPIO44
    bits_per_sample: 32bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3104_dac
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        num_channels: 1
        timeout: never
      - id: media_mixing_input
        num_channels: 1
        timeout: never
      - id: noise_mixing_input
        num_channels: 1
        timeout: never

# Noise Maker
noise_source:
  id: noise
  speaker: noise_mixing_input
  sample_rate: 48000
  gain: 30%               # base amplitude; leaves headroom so noise + TTS won't clip
  fade_length: 2s
  high_pass_frequency: 160
  high_pass_makeup: 4.0   # tune by ear against white at the same volume

media_player:
  - platform: speaker
    id: external_media_player
    name: None
    internal: false
    announcement_pipeline:
      speaker: announcement_resampling_speaker
    media_pipeline:
      speaker: media_resampling_speaker
    volume_min: 55%
    volume_max: 100%
    # On-device files baked into flash, playable with no HA/network connection.
    # Encode mono, 48 kHz, 16-bit MP3 (matches media_mixing_input / pipeline).
    files:
      # Source is a substitution so it works in both worlds. ESPHome resolves a
      # LOCAL file path against the *build machine's* config dir - which the HA
      # side (pulling this as a remote package) does not have the asset in - so
      # the default is a URL, which ESPHome downloads at build time. Override
      # la_la_sad_source with a repo-relative path for local/offline dev.
      - id: la_la_sad
        file: ${la_la_sad_source}
    # NOTE: no on_idle hook here. The mixer keeps this player from reporting
    # idle reliably, so voice-turn un-ducking is handled by duck_watchdog
    # (keyed off is_announcing), not by media idle. Looping is done with
    # media_player.repeat_one (see the Play button), which relies on the
    # decoder's own end-of-file detection, not the (broken) idle state.

respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    update_interval: 60s     # was 1s - quieter logs, still functional

micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 0                 # XVF3800 clean beamformed output
  stop_after_detection: true    # yield the mic to the pipeline on detect;
                                # we restart it on_end below
  models:
    - model: okay_nabu
      probability_cutoff: 0.9   # was 0.97 (default) - a bit more forgiving,
                                # esp. once background sound resumes after a turn
  on_wake_word_detected:
    # Duck BOTH background channels for the whole turn. Noise and media are now
    # independent and can play together, so we always dip both (a no-op on any
    # channel that happens to be silent). The spoken reply rides the announcement
    # channel, so it stays at full volume.
    - mixer_speaker.apply_ducking:
        id: noise_mixing_input
        decibel_reduction: 15
        duration: 0.3s
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 15
        duration: 0.3s
    - lambda: 'id(sound_ducked) = true;'
    - script.execute: duck_watchdog
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone:
    microphone: i2s_mics
    channels: 0
  # Linking the mww instance here is what makes Home Assistant's "Wake word" /
  # "Wake word 2" selects work. HA fetches the satellite config over the API and
  # voice_assistant answers from micro_wake_word's model list; with this key
  # absent that pointer is null, so it reports zero available wake words and
  # max_active_wake_words = 0 - HA still creates both selects (it always makes
  # two) but they hold only "no wake word" and render as UNAVAILABLE.
  # Detection itself never needed this: the wiring below (on_wake_word_detected
  # -> voice_assistant.start) is local, which is why it worked anyway.
  # Side effect: HA now OWNS which models are enabled - on connect it disables
  # every model and re-enables only what the selects name, and that enable bit
  # is persisted in flash. Set the select to "Okay Nabu" after flashing.
  micro_wake_word: mww
  media_player: external_media_player
  noise_suppression_level: 0
  # --- wake-word lifecycle (manual pattern) ---
  on_client_connected:
    - micro_wake_word.start:          # begin listening for "Okay Nabu"
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
  # Restart wake-word listening at the end of each turn. Un-ducking is handled
  # by duck_watchdog (launched at wake word), which keys off the reply
  # announcement rather than any pipeline-end event.
  on_end:
    - micro_wake_word.start:
  on_error:
    - script.execute: resume_if_ducked
    - micro_wake_word.start:
